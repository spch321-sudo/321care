  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){
    const ss=tracks[id].samples;
    const offs=newOff[id]||[];
    const old=mx_children(b,stblOld);
    const keep=[];
    ["stsd"].forEach(t=>{const x=mx_one(old,t);if(x)keep.push(b.slice(x.start,x.end));});

    /* stts */
    const stts=[];
    let runDur=-1,runCnt=0;
    ss.forEach(s=>{
      if(s.dur===runDur){runCnt++;}
      else{if(runCnt)stts.push([runCnt,runDur]);runDur=s.dur;runCnt=1;}
    });
    if(runCnt)stts.push([runCnt,runDur]);
    const sttsBody=[mx_b32(0),mx_b32(stts.length)];
    stts.forEach(e=>{sttsBody.push(mx_b32(e[0]));sttsBody.push(mx_b32(e[1]));});
    keep.push(mx_box("stts",mx_cat(sttsBody)));

    /* ctts（若有 composition offset） */
    if(ss.some(s=>s.cto!==0)){
      const ctts=[];let rv=null,rc=0;
      ss.forEach(s=>{if(s.cto===rv){rc++;}else{if(rc)ctts.push([rc,rv]);rv=s.cto;rc=1;}});
      if(rc)ctts.push([rc,rv]);
      const body=[new Uint8Array([1,0,0,0]),mx_b32(ctts.length)];
      ctts.forEach(e=>{body.push(mx_b32(e[0]));body.push(mx_b32(e[1]>>>0));});

    }

    if(syncs.length&&syncs.length!==ss.length){
      const body=[mx_b32(0),mx_b32(syncs.length)];

    keep.push(mx_box("stsc",mx_cat([mx_b32(0),mx_b32(1),mx_b32(1),mx_b32(1),mx_b32(1)])));

      const newMdia=mx_box("mdia",...mdiaParts);
      const trakParts=tkc.filter(x=>x.type!=="edts").map(x=>
        x.type==="mdia"?newMdia:(x.type==="tkhd"?tkhdBuf:b.slice(x.start,x.end)));
      newTraks.push(mx_box("trak",...trakParts));
    });

    /* mvhd：填入整體時長 */
    let maxDur=0;
    Object.keys(tracks).forEach(id=>{
      const tk=tracks[id];const trak=tk.trak;
      const mdhd=mx_one(mx_children(b,mx_one(mx_children(b,trak),"mdia")),"mdhd");
      const mv=b[mdhd.body];
      const mts=mx_u32(b,mdhd.body+(mv===1?20:12));
      let d=0;tk.samples.forEach(s=>d+=s.dur);
      maxDur=Math.max(maxDur,Math.round(d/mts*mvTimescale));
    });
    const mvhdBuf=b.slice(mvhd.start,mvhd.end);
    if(b[mvhd.body]===1)writeU64(mvhdBuf,mvhd.body-mvhd.start+24,maxDur);
    else writeU32(mvhdBuf,mvhd.body-mvhd.start+16,maxDur);

    return mx_box("moov",mvhdBuf,...newTraks);
  }

  function writeU32(buf,p,v){buf[p]=(v>>>24)&255;buf[p+1]=(v>>>16)&255;buf[p+2]=(v>>>8)&255;buf[p+3]=v&255;}
  function writeU64(buf,p,v){const hi=Math.floor(v/4294967296),lo=v>>>0;
    writeU32(buf,p,hi);writeU32(buf,p+4,lo);}

  const ftypBuf=ftyp?b.slice(ftyp.start,ftyp.end)
                    :mx_box("ftyp",mx_strBytes("isom"),mx_b32(512),mx_strBytes("isomiso2avc1mp41"));
  const pass1=assemble(0);
  const mdatStart=ftypBuf.length+pass1.length+16;   /* 16 = mdat 的 64 位元表頭 */
  Object.keys(newOff).forEach(id=>{
    newOff[id]=newOff[id].map(v=>v+mdatStart);
  });
  const moovNew=assemble(mdatStart);

  /* 組出 mdat（64 位元長度） */
  const mdatHead=new Uint8Array(16);
  mdatHead[3]=1;
  "mdat".split("").forEach((c,i)=>mdatHead[4+i]=c.charCodeAt(0));
  const total=mdatSize+16;
  const hi=Math.floor(total/4294967296),lo=total>>>0;
  writeU32(mdatHead,8,hi);writeU32(mdatHead,12,lo);

  const out=new Uint8Array(ftypBuf.length+moovNew.length+16+mdatSize);
  let p=0;
  out.set(ftypBuf,p);p+=ftypBuf.length;
  out.set(moovNew,p);p+=moovNew.length;
  out.set(mdatHead,p);p+=16;
  order.forEach(o=>{out.set(b.subarray(o.off,o.off+o.size),p);p+=o.size;});
  return out;
}
function mx_strBytes(s){const a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a;}



/* 只處理分段 MP4；其他格式或失敗時，原封不動回傳，不影響既有流程 */
async function fixVideoBlob(blob,mime){
  try{
    if(!blob||!/mp4/i.test(mime||blob.type||""))return blob;
    const buf=new Uint8Array(await blob.arrayBuffer());
    const out=mx_remux(buf);
    if(!out||!out.length)return blob;
    return new Blob([out],{type:"video/mp4"});
  }catch(e){logErr("mx_remux",e);return blob;}
}


/* ================= 詩歌庫（30 首，隨 App 一起發佈）=================
   詩歌 mp3 放在網站的 music/ 資料夾，music.json 是清單。
   同源檔案才混得進錄影，也不必請使用者一首一首加。
   註：GitHub 網頁版「Upload files」會把檔案丟進當前資料夾，很容易全部掉在根目錄，
   所以抓檔時 music/ 與根目錄兩邊都找，找到哪邊就記住。 */
const MUSIC_JSON="music.json", MUSIC_DIR="music/";
let hymnList=null, musicBase=null, hymnTag="", hymnQ="";
let bgmCredit="";
async function hymnLoad(){
  if(hymnList)return hymnList;
  const r=await fetch(MUSIC_JSON+"?v="+APP_VER,{cache:"no-store"});
  if(!r.ok)throw new Error("http "+r.status);
  const d=await r.json();
  hymnList=Array.isArray(d)?d:((d&&d.songs)||[]);
  return hymnList;
}
function hymnName(sg){return (LG()==="en"&&sg.ne)?sg.ne:LT(sg.n||sg.f||"");}
async function hymnFetch(sg){
  const name=encodeURIComponent(sg.f);
  const tries=(musicBase!==null)?[musicBase]:[MUSIC_DIR,""];
  let why="";
  for(const b of tries){
    const path=b+name;
    let r;
    try{r=await fetch(path+"?v="+APP_VER);}catch(e){why="連不上 "+path;continue;}
    if(!r.ok){why=path+"：HTTP "+r.status;continue;}
    const blob=await r.blob();
    if(!blob.size){why=path+" 是空檔";continue;}
    if(/text\/html/.test(blob.type||"")){why=path+" 抓到的是網頁，不是音檔";continue;}
    musicBase=b;return blob;
  }
  throw new Error(why||"讀取失敗");
}
let __hAudio=null,__hPlaying="";
function hymnAudio(){
  if(__hAudio)return __hAudio;
  __hAudio=document.createElement("audio");
  __hAudio.preload="auto";__hAudio.playsInline=true;
  ["playsinline","webkit-playsinline"].forEach(a=>__hAudio.setAttribute(a,""));
  __hAudio.style.cssText="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none";
  document.body.appendChild(__hAudio);
  return __hAudio;
}
function hymnStop(){
  try{if(__hAudio)__hAudio.pause();}catch(e){}
  __hPlaying="";
  document.querySelectorAll(".hymnplay").forEach(b=>b.textContent="▶");
}
async function hymnPlay(f){
  const sg=(hymnList||[]).find(x=>x.f===f);if(!sg)return;
  if(__hPlaying===f){hymnStop();return;}
  hymnStop();
  try{
    const blob=await hymnFetch(sg);
    const a=hymnAudio();
    if(a.src)try{URL.revokeObjectURL(a.src);}catch(e){}
    a.src=URL.createObjectURL(blob);
    await a.play().catch(()=>{});
    __hPlaying=f;
    const btn=document.querySelector('.hymnplay[data-f="'+f+'"]');
    if(btn)btn.textContent="■";
  }catch(e){logErr("hymnPlay",e);toast("這首讀取失敗，換一首試試");}
}
async function useHymn(f){
  const sg=(hymnList||[]).find(x=>x.f===f);if(!sg)return;

async function pxSearch(q,more){

/* 先套用帶數字的樣式，再由長到短套用固定詞句，避免短詞先吃掉長句 */
var EN_RX=EN_RULES.filter(function(x){return typeof x[0]!=="string";});
var EN_TX=EN_RULES.filter(function(x){return typeof x[0]==="string";})
                  .sort(function(a,b){return b[0].length-a[0].length;});
function toEn(t){
  for(var i=0;i<EN_RX.length;i++) t=t.replace(EN_RX[i][0],EN_RX[i][1]);
  for(var j=0;j<EN_TX.length;j++){
    var k=EN_TX[j][0];
    if(t.indexOf(k)>=0) t=t.split(k).join(EN_TX[j][1]);
  }
  return t;
}
function LT(s){
  s=String(s==null?"":s);
  var g=LG();
  if(g==="zh-Hans")return toSimp(simpWords(s));
  if(g==="en")return toEn(s);
  return s;
}
/* 只改畫面上的文字節點，不動屬性值與輸入框，避免比對邏輯壞掉 */
function localizeEl(root){
  try{
    var g=LG(); if(g==="zh-Hant"||!root||!document.createTreeWalker)return;
    var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null,false),n,arr=[];
    while((n=w.nextNode()))arr.push(n);
    for(var i=0;i<arr.length;i++){
      var tn=arr[i],pn=tn.parentNode,tg=pn&&pn.tagName;
      if(tg==="TEXTAREA"||tg==="INPUT"||tg==="SCRIPT"||tg==="STYLE")continue;
      var v=tn.nodeValue;
      if(!v||!/[\u4e00-\u9fff]/.test(v))continue;
      var c=LT(v); if(c!==v)tn.nodeValue=c;
    }
    var iv=root.querySelectorAll?root.querySelectorAll("[data-i18n]"):[];
    for(var m=0;m<iv.length;m++){
      var v0=iv[m].value;
      if(v0&&/[\u4e00-\u9fff]/.test(v0)){var c0=LT(v0);if(c0!==v0)iv[m].value=c0;}
    }
    var ph=root.querySelectorAll?root.querySelectorAll("[placeholder]"):[];
    for(var j=0;j<ph.length;j++){
      var p0=ph[j].getAttribute("placeholder");
      if(p0&&/[\u4e00-\u9fff]/.test(p0))ph[j].setAttribute("placeholder",LT(p0));
    }
  }catch(e){}
}
/* 無障礙：每次重繪後統一補上，比在 74 個樣板逐一手寫更不容易漏 */
function a11y(root){
  try{
    const r=root||document;
    r.querySelectorAll("button:not([type])").forEach(b=>b.setAttribute("type","button"));
    r.querySelectorAll("button,a.btn,label.btn").forEach(b=>{
      if(b.getAttribute("aria-label"))return;
      const t=(b.textContent||"").trim().replace(/\s+/g," ");
      if(t)b.setAttribute("aria-label",t);
      if(b.classList.contains("chip")||b.classList.contains("tpl"))
        b.setAttribute("aria-pressed",b.classList.contains("on")?"true":"false");
    });
    r.querySelectorAll("input,select,textarea").forEach(el=>{
      if(el.getAttribute("aria-label"))return;
      const ph=el.getAttribute("placeholder");
      let lab="";
      let pv=el.previousElementSibling;
      while(pv&&!lab){if(pv.classList&&pv.classList.contains("f"))lab=pv.textContent.trim();pv=pv.previousElementSibling;}
      if(lab||ph)el.setAttribute("aria-label",lab||ph);
    });
    r.querySelectorAll("canvas").forEach(c=>{
      if(!c.getAttribute("role")){c.setAttribute("role","img");c.setAttribute("aria-label",LT("經文卡片預覽"));}
    });
  }catch(e){logErr("a11y",e);}
}

const KEY="care321.v1";
const SCHEMA=2;   /* 資料結構版本：日後改結構時用來安全轉換舊資料 */
const DEF={__v:SCHEMA,set:{group:"國度321空中團契",signer:"",fs:1,dark:0,quota:5,tip:1,lang:"zh-Hant",cardFs:1,ai:1,lastBak:0},people:[],logs:[]};
let S=load();
/* 舊資料遷移：只補、不刪，永遠不讓使用者的資料因為改版而消失 */
function migrate(o){
  const v=+(o.__v)||1;
  if(v<2){
    o.people=(o.people||[]).map(p=>Object.assign({fam:[],tags:[]},p));
    o.logs=(o.logs||[]).filter(l=>l&&l.pid);
  }
  o.__v=SCHEMA;return o;
}
function load(){
  try{
    const o=JSON.parse(localStorage.getItem(KEY));
    if(o&&o.set)return migrate(Object.assign({},DEF,o,{set:Object.assign({},DEF.set,o.set)}));
  }catch(e){logErr("load",e);}
  return JSON.parse(JSON.stringify(DEF));
}
/* 存檔失敗過去是靜默的——牧養資料不能默默消失，一定要讓使用者知道 */
let __saveWarned=false;
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));__saveWarned=false;return true;}
  catch(e){
    logErr("save",e);
    if(!__saveWarned){
      __saveWarned=true;
      setTimeout(()=>alert(LT("儲存空間已滿，這筆資料沒有存進去！請立刻到「設定 → 備份全部資料」把資料存下來，再刪除一些錄音作品騰出空間。")),50);
    }
    return false;
  }
}

const ELOG="care321.err";
function logErr(where,e){

/* ================= 日期工具 ================= */
const today=()=>new Date();
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const zh=d=>`${d.getMonth()+1}月${d.getDate()}日`;
const WD=["日","一","二","三","四","五","六"];
function md(s){if(!s)return null;const p=s.split("-");return p.length===3?p[1]+"-"+p[2]:s;}
function daysTo(mmdd){if(!mmdd)return null;const t=today();const[m,d]=mmdd.split("-").map(Number);if(!m||!d)return null;
  let y=t.getFullYear();let n=new Date(y,m-1,d);const t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  if(n<t0)n=new Date(y+1,m-1,d);return Math.round((n-t0)/864e5);}
function ageAt(bd){const p=(bd||"").split("-");if(p.length<3)return null;const y=+p[0];if(!y||y<1900)return null;
  const t=today(),t0=new Date(t.getFullYear(),t.getMonth(),t.getDate());
  let occ=new Date(t.getFullYear(),+p[1]-1,+p[2]);if(occ<t0)occ=new Date(t.getFullYear()+1,+p[1]-1,+p[2]);
  const a=occ.getFullYear()-y;return a>0&&a<150?a:null;}
function lastCare(pid){const l=S.logs.filter(x=>x.pid===pid).sort((a,b)=>b.date.localeCompare(a.date));return l[0]?l[0].date:null;}
function gapDays(pid){const d=lastCare(pid);if(!d)return 999;return Math.round((new Date(iso(today()))-new Date(d))/864e5);}
function light(pid){const g=gapDays(pid);return g>=90?"red":g>=45?"amber":"green";}

/* ================= 合併欄位 ================= */
/* 卡片可自帶團體名、稱呼與署名；沒帶就用「設定」裡的預設值 */
function cGroup(c){return String((c&&c.grp)||S.set.group||"").trim();}
function cSigner(c){return String((c&&c.sig)||S.set.signer||"").trim();}
function cTo(c,p){
  const own=String((c&&c.to)||"").trim();
  if(own)return own;
  if(p)return p.title?p.name+p.title:p.name;
  return isEN()?"dear brother or sister":"親愛的弟兄姊妹";
}
function merge(txt,p,c){
  const sep=isEN()?", ":"、";
  const fam=p&&p.fam&&p.fam.length?p.fam.map(f=>f.n).filter(Boolean).join(sep):(isEN()?"your family":"家人");
  return (txt||"")
   .replace(/\{稱呼\}/g,cTo(c,p))
   .replace(/\{姓名\}/g,p?p.name:String((c&&c.to)||"").trim())
   .replace(/\{配偶\}/g,p&&p.spouse?p.spouse:(isEN()?"your spouse":"另一半"))
   .replace(/\{家人\}/g,fam)
   .replace(/\{團體\}/g,cGroup(c))
   .replace(/\{署名\}/g,cSigner(c));
}
function cardText(c,p){
  const sig=LT(cSigner(c));
  const q=isEN()?["\u201c","\u201d"]:["\u300c","\u300d"];
  const sg=sig?(isEN()?"\u2014 "+sig:sig+" 敬上"):"";
  return `${q[0]}${c.v}${q[1]}\n\u2014\u2014 ${c.r}\n\n${merge(c.w,p,c)}\n\n${c.b||BL()[0]}\n\n${sg}`.trim();
}

function lazyPreview(cards,p){
  try{if(__io)__io.disconnect();}catch(e){}
  const boxes=cards.map((c,i)=>({el:document.getElementById("pv"+i),c})).filter(x=>x.el);
  if(!window.IntersectionObserver){boxes.forEach((x,i)=>setTimeout(()=>renderPreview("pv"+i,x.c,p),40*i));return;}
  __io=new IntersectionObserver(es=>{
    es.forEach(e=>{

  const g=ctx.createLinearGradient(0,0,W*.3,H);
  g.addColorStop(0,T.bg[0]);g.addColorStop(.55,T.bg[1]);g.addColorStop(1,T.bg[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* --- 背景相片 + 半透明遮罩（維持文字可讀） --- */
  if(photoImg&&photoMode==="bg"){
    coverDraw(ctx,photoImg,0,0,W,H);
    const hex=T.bg[1].replace("#","");
    const R=parseInt(hex.slice(0,2),16),G=parseInt(hex.slice(2,4),16),Bl=parseInt(hex.slice(4,6),16);
    const sc=ctx.createLinearGradient(0,0,0,H);
    sc.addColorStop(0,`rgba(${R},${G},${Bl},0.46)`);
    sc.addColorStop(.5,`rgba(${R},${G},${Bl},0.66)`);
    sc.addColorStop(1,`rgba(${R},${G},${Bl},0.56)`);
    ctx.fillStyle=sc;ctx.fillRect(0,0,W,H);
  }
  /* 角落光暈 */
  const rg=ctx.createRadialGradient(W*.85,H*.10,10,W*.85,H*.10,W*.7);
  rg.addColorStop(0,T.glow);rg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  const rg2=ctx.createRadialGradient(W*.12,H*.94,10,W*.12,H*.94,W*.55);
  rg2.addColorStop(0,T.glow.replace(/[\d.]+\)$/,"0.22)"));rg2.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=rg2;ctx.fillRect(0,0,W,H);

  /* --- 邊框（可選） --- */
  drawBorder(ctx,W,H,pad,F,T);

  /* --- 團體名（固定在頂端） --- */
  const grpSz=Math.round(27*FT), refSz=Math.round(29*FT), blSz=Math.round(32*FT), sigSz=Math.round(26*FT);
  ctx.textAlign="center";ctx.fillStyle=subDeep;ctx.font=`600 ${grpSz}px ${sans}`;
  const grp=LT(cGroup(c));
  const grpY=pad+Math.round(40*F);
  if(grp){
    const gw=ctx.measureText(grp).width;
    ctx.fillText(grp,W/2,grpY);
    ctx.strokeStyle=T.frame.replace(/[\d.]+\)$/,"0.6)");ctx.lineWidth=Math.max(1,1.5*F);
    const lx=W/2-gw/2-Math.round(28*F), rx=W/2+gw/2+Math.round(28*F);
    ctx.beginPath();ctx.moveTo(lx-Math.round(30*F),grpY-Math.round(9*F));ctx.lineTo(lx,grpY-Math.round(9*F));ctx.stroke();
    ctx.beginPath();ctx.moveTo(rx,grpY-Math.round(9*F));ctx.lineTo(rx+Math.round(30*F),grpY-Math.round(9*F));ctx.stroke();
  }

  /* --- 版位計算（經文＋內文垂直置中於團體名之下） --- */
  const hasStickerLayout=photoImg&&photoMode==="sticker"&&!suppressSticker;
  /* 祝福語與署名會因為貼紙或自拍而往上移，底部要預留同樣的高度，內文才不會壓過去 */
  const stkBottom=stkPos!=="tl"&&stkPos!=="tr";
  const liftRoom=(hasStickerLayout&&stkBottom)?Math.round(W*stkSize*stkRatio())+Math.round(30*F):0;
  const topRoom=pad+Math.round(96*F), botRoom=pad+Math.round(160*F)+liftRoom;
  const room=H-topRoom-botRoom;

  let vs=Math.round(54*FT),vl;
  const cV=LT(c.v||""),cR=LT(c.r||""),cB=LT(c.b||BL()[0]);
  while(true){ctx.font=`600 ${vs}px ${serif}`;vl=wrap(ctx,QO()+cV+QC(),iw);
    if(vl.length<=6||vs<=Math.round(30*F))break;vs-=Math.round(3*F);}

  const bodyTxt=LT(merge(c.w,p,c));
  const fixed=vs*.9+vl.length*vs*1.55+Math.round(62*F)+Math.round(84*F);
  let bs=Math.round(40*FB),bl;
  while(true){ctx.font=`${bs}px ${sans}`;bl=wrap(ctx,bodyTxt,iw);
    if(fixed+bl.length*bs*1.74<=room||bs<=Math.round(24*F))break;bs-=Math.round(2*F);}

  const total=fixed+bl.length*bs*1.74;
  let y=topRoom+Math.max(0,(room-total)/2);

  /* --- 經文 --- */
  ctx.fillStyle=accent;ctx.font=`600 ${vs}px ${serif}`;
  y+=vs*.9;vl.forEach(l=>{ctx.fillText(l,W/2,y);y+=vs*1.55;});

  /* --- 出處 --- */
  ctx.font=`${refSz}px ${sans}`;ctx.fillStyle=sub;
  ctx.fillText(cR,W/2,y);y+=Math.round(62*F);

  /* --- 分隔飾 --- */
  ctx.fillStyle=gold;
  ctx.beginPath();ctx.arc(W/2,y,Math.round(5*F),0,7);ctx.fill();
  ctx.strokeStyle=gold;ctx.lineWidth=2.5*F;
  ctx.beginPath();ctx.moveTo(W/2-Math.round(52*F),y);ctx.lineTo(W/2-Math.round(16*F),y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2+Math.round(16*F),y);ctx.lineTo(W/2+Math.round(52*F),y);ctx.stroke();
  y+=Math.round(84*F);

  /* --- 內文 --- */
  ctx.textAlign="left";ctx.fillStyle=ink;ctx.font=`${bs}px ${sans}`;
  bl.forEach(l=>{ctx.fillText(l,pad,y);y+=bs*1.74;});

  /* --- 祝福與署名（近底部；自拍或貼相片時上移讓開） --- */
  const hasSticker=photoImg&&photoMode==="sticker"&&!suppressSticker;
  const stkDown=hasSticker&&stkPos!=="tl"&&stkPos!=="tr";
  const lift=(stkDown&&(stkPos==="bc"||(hasSticker&&stkSize>=0.55)))?Math.round(W*stkSize*stkRatio())+Math.round(20*F):0;
  /* 自拍圓框在右下角，祝福語與署名就靠左排，彼此讓開 */
  const selfR=Math.round(Math.min(W,H)*0.115), selfPad=Math.round(W*.078);
  /* 圓框或相片貼紙佔住一角時，祝福語與署名就排到另一邊，彼此讓開 */
  const stkW=Math.round(W*stkSize);
  const wideStk=hasSticker&&stkSize>=0.55;   /* 太寬就沒有側邊空間了 */
  const sideR=(!!selfieLayout&&!hasSticker)||(stkDown&&stkPos==="br"&&!wideStk);
  const sideL=stkDown&&stkPos==="bl"&&!wideStk;
  const sideMode=sideR||sideL;
  const rightEdge=sideR?(selfieLayout&&!hasSticker?W-selfPad-selfR*2:W-pad-stkW)-Math.round(24*F):W-pad;
  const leftStart=sideL?(pad+stkW+Math.round(24*F)):pad;
  const cxT=sideMode?(leftStart+rightEdge)/2:W/2;
  const maxT=sideMode?(rightEdge-leftStart):iw;
  const fitFont=(txt,size,weight,fam)=>{let z=size;
    while(z>Math.round(16*F)){ctx.font=`${weight} ${z}px ${fam}`;
      if(ctx.measureText(txt).width<=maxT)break;z-=Math.round(2*F);}
    ctx.font=`${weight} ${z}px ${fam}`;return z;};
  ctx.textAlign="center";ctx.fillStyle=accent;
  const blTxt=cB;
  fitFont(blTxt,blSz,"600",serif);
  ctx.fillText(blTxt,cxT,H-pad*.72-Math.round(96*F)-lift);
  const sig=LT(cSigner(c));
  if(sig){
    const sigTxt=sig+(isEN()?"":"　敬上");
    ctx.fillStyle=subDeep;fitFont(sigTxt,sigSz,"600",sans);
    ctx.fillText(sigTxt,cxT,H-pad*.72-Math.round(30*F)-lift);
  }

  /* --- 相片貼紙（右下角，拍立得風格） --- */
  if(hasSticker){
    const sw=Math.round(W*stkSize), sh=Math.round(sw*stkRatio());
    const top=stkPos==="tl"||stkPos==="tr";
    const bx=(stkPos==="bl"||stkPos==="tl")?pad-Math.round(4*F)
            :(stkPos==="bc")?Math.round((W-sw)/2)
            :W-pad-sw+Math.round(4*F);
    const by=top?pad+Math.round(70*F):H-pad-sh+Math.round(4*F);
    ctx.save();
    ctx.translate(bx+sw/2,by+sh/2);ctx.rotate((stkShape==="w"?-1.4:-3)*Math.PI/180);
    ctx.shadowColor="rgba(0,0,0,.30)";ctx.shadowBlur=Math.round(24*F);ctx.shadowOffsetY=Math.round(9*F);
    /* 直式保留拍立得的下白邊；橫式與方形四邊等寬，比例才不會被切掉 */
    const fr=Math.round(10*F), pb=(stkShape==="p")?Math.round(26*F):fr;
    rr(ctx,-sw/2,-sh/2,sw,sh,Math.round(10*F));ctx.fillStyle="#FDFBF6";ctx.fill();
    ctx.shadowColor="transparent";
    const iw2=sw-fr*2, ih2=sh-fr-pb;
    ctx.save();rr(ctx,-sw/2+fr,-sh/2+fr,iw2,ih2,Math.round(4*F));ctx.clip();
    coverDraw(ctx,photoImg,-sw/2+fr,-sh/2+fr,iw2,ih2);ctx.restore();
    ctx.restore();
  }
}

function drawSelfie(cx,vid,W,H,F){
  if(!vid||!vid.videoWidth)return;
  const pad=Math.round(W*.078);
  const R=Math.round(Math.min(W,H)*0.115);          // 圓形半徑
  const cxx=W-pad-R+Math.round(4*F), cyy=H-pad-R+Math.round(4*F);
  // 陰影底
  cx.save();
  cx.shadowColor="rgba(0,0,0,.28)";cx.shadowBlur=Math.round(22*F);cx.shadowOffsetY=Math.round(8*F);
  cx.beginPath();cx.arc(cxx,cyy,R,0,7);cx.fillStyle="#000";cx.fill();
  cx.restore();
  // 圓形裁切 + 鏡像貼上相機畫面（cover 置中裁切）
  cx.save();
  cx.beginPath();cx.arc(cxx,cyy,R,0,7);cx.clip();
  const vw=vid.videoWidth, vh=vid.videoHeight, side=Math.min(vw,vh);
  const sx=(vw-side)/2, sy=(vh-side)/2;
  cx.translate(cxx,cyy);cx.scale(-1,1);                // 鏡像（自拍鏡像感）
  cx.drawImage(vid, sx,sy,side,side, -R,-R,R*2,R*2);
  cx.restore();
  // 外環
  cx.beginPath();cx.arc(cxx,cyy,R,0,7);
  cx.lineWidth=Math.max(3,W*.006);cx.strokeStyle="#F4EFE3";cx.stroke();
  cx.beginPath();cx.arc(cxx,cyy,R+Math.round(4*F),0,7);
  cx.lineWidth=Math.max(2,W*.003);cx.strokeStyle="rgba(184,122,34,.85)";cx.stroke();
}

let __mcGain=null;
async function musicRec(){
  if(mr&&mr.state==="recording"){mr.stop();return;}
  if(!pending){toast("請先選一張卡片");return;}
  if(!bgmBlob){toast("請先選一首背景音樂");return;}
  if(!canVideo()){toast("這台裝置不支援自動合成影片");return;}
  const c=pendCard(), p=S.people.find(x=>x.id===pending.pid);
  let ac=null,bgmEl=null,bgmURL=null,audioStream=null;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    try{await ac.resume();}catch(_){}
    bgmURL=URL.createObjectURL(bgmBlob);
    bgmEl=new Audio();bgmEl.src=bgmURL;bgmEl.loop=false;bgmEl.crossOrigin="anonymous";
    const src=ac.createMediaElementSource(bgmEl);
    const gain=ac.createGain();gain.gain.value=1;__mcGain=gain;
    const dst=ac.createMediaStreamDestination();
    src.connect(gain).connect(dst);
    audioStream=dst.stream;
  }catch(e){toast("無法讀取這首音樂，請換一首");return;}

  const[W,H]=SIZES[curSize]||SIZES.p;
  const base=document.createElement("canvas");drawCard(base,c,p,W,H);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;
  const cx=cv.getContext("2d");const t0=performance.now();
  const loop=()=>{
    const el=(performance.now()-t0)/1000;
    cx.drawImage(base,0,0);
    const gx=W*(0.12+0.76*(((el/16)%2>1)?2-(el/16)%2:(el/16)%2));
    const rg=cx.createRadialGradient(gx,H*.12,10,gx,H*.12,W*.55);
    rg.addColorStop(0,"rgba(255,255,255,.10)");rg.addColorStop(1,"rgba(255,255,255,0)");
    cx.fillStyle=rg;cx.fillRect(0,0,W,H);
    recAnim=requestAnimationFrame(loop);
  };loop();
  const lb=document.getElementById("liveBox");
  if(lb){
    cv.style.cssText="width:100%;max-width:300px;border-radius:14px;display:block;margin:0 auto;box-shadow:0 6px 20px rgba(0,0,0,.14)";
    lb.innerHTML="";lb.appendChild(cv);lb.style.display="";
    const sw=document.getElementById("selfieWrap");if(sw)sw.style.display="none";
  }
  const vs=cv.captureStream(24);
  const stream=new MediaStream([...vs.getVideoTracks(),...audioStream.getAudioTracks()]);
  const mime=vidMime();
  try{mr=new MediaRecorder(stream,Object.assign(mime?{mimeType:mime}:{},{videoBitsPerSecond:2200000}));}
  catch(e){cancelAnimationFrame(recAnim);toast("這台裝置不支援自動合成影片");return;}

  chunks=[];recSec=0;
  mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
  mr.onstop=async()=>{
    clearInterval(recTimer);cancelAnimationFrame(recAnim);
    const lb0=document.getElementById("liveBox");
    if(lb0){lb0.innerHTML="";lb0.style.display="none";}
    try{if(bgmEl){bgmEl.pause();bgmEl.src="";}}catch(_){}
    try{if(bgmURL)URL.revokeObjectURL(bgmURL);}catch(_){}
    try{if(ac)ac.close();}catch(_){}
    const type=mr.mimeType||mime||"video/webm";
    let blob=new Blob(chunks,{type});
    blob=await fixVideoBlob(blob,type);
    await putRec({id:uid(),ts:Date.now(),blob,mime:blob.type||type,kind:"video",dur:recSec,pid:pending.pid,
      sceneId:pending.sid,sceneName:pendName(),cardIdx:pending.i,
      v:c.v,r:c.r,w:merge(c.w,p,c),t:c.t,b:c.b});
    if(pending.pid)markCared(pending.pid,pendName());
    mr=null;await vRec();toast("影片做好了！可以分享到 LINE");
    setTimeout(()=>{const el=[...document.querySelectorAll(".sec-t")].find(x=>x.textContent.indexOf("已完成的作品")>=0);if(el)el.scrollIntoView({behavior:"smooth",block:"start"});},250);
  };
  mr.start(1000);
  try{await bgmEl.play();}catch(e){}
  bgmEl.onended=()=>{if(mr&&mr.state==="recording")mr.stop();};
  /* 指定長度時，結尾兩秒淡出後自動收尾 */
  const lim=mcLen>0?mcLen:8*60;
  if(mcLen>0){
    setTimeout(()=>{try{__mcGain&&__mcGain.gain.linearRampToValueAtTime(0,ac.currentTime+1.8);}catch(_){}},Math.max(0,(lim-2))*1000);
  }
  setTimeout(()=>{if(mr&&mr.state==="recording")mr.stop();},lim*1000);
  const bt=$("#recBtn");if(bt){bt.textContent="停止並完成";bt.classList.add("danger");bt.setAttribute("onclick","musicRec()");}
  const st=$("#recSt");if(st)st.innerHTML='<span class="rec-dot" style="display:inline-block;vertical-align:middle;margin-right:8px"></span>音樂卡片製作中…　♪';
  recTimer=setInterval(()=>{recSec++;const e=$("#recTm");
    if(e)e.textContent=String(Math.floor(recSec/60)).padStart(2,"0")+":"+String(recSec%60).padStart(2,"0");},1000);
}

async function expFull(){

function dataURLtoBlob(u){
  const i=u.indexOf(",");const mime=(u.slice(5,i).split(";")[0])||"application/octet-stream";
  const b=atob(u.slice(i+1)),a=new Uint8Array(b.length);
  for(let k=0;k<b.length;k++)a[k]=b.charCodeAt(k);
  return new Blob([a],{type:mime});
}
function validBackup(o){
  if(!o||typeof o!=="object")return false;

function impJSON(inp){
  const f=inp.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=async()=>{
    let o;
    try{o=JSON.parse(rd.result);}catch(e){toast("檔案格式不正確");return;}
    if(!validBackup(o)){toast("檔案格式不正確");return;}
    const full=!!o.__full;
    const cnt=full?(o.recs||[]).length:0;
    if(!confirm(LT("將覆蓋目前的資料，確定還原？")+(full&&cnt?("\n"+LT("這份備份包含")+" "+cnt+" "+LT("個作品，會一併還原。")):"")))return;
    const data=full?o.S:o;
    S=migrate(Object.assign({},DEF,data,{set:Object.assign({},DEF.set,data.set||{})}));
    save();
    if(full&&cnt){
      try{
        for(const r of o.recs){
          if(!r||!r.data)continue;
          await putRec(Object.assign({},r,{data:undefined,blob:dataURLtoBlob(r.data)}));
        }
      }catch(e){logErr("impFull",e);}
    }
    render();toast("已還原");
  };
  rd.readAsText(f);
}

/* ================= 自動更新 =================
   每次改版：index.html 的 APP_VER、version.json、sw.js 的 CACHE 版號要一起跳。
   App 開啟時與每次切回前景時（最多每 5 分鐘一次）向伺服器問一次版本，
   有新版就在使用者不忙的時候自動換版；正在錄影或打字時只提示，不打斷。 */
const APP_VER="3.6.0";
let __lastChk=0,__upd=false;
function appBusy(){
  if(mr&&mr.state==="recording")return true;
  const sh=document.getElementById("sheet");
  if(sh&&sh.classList.contains("on"))return true;
  const a=document.activeElement;
  if(a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA"||a.tagName==="SELECT"))return true;
  const st=document.getElementById("stage");
  if(st&&st.classList.contains("on"))return true;

}
function updBanner(){
  if(document.getElementById("updBar"))return;
  const d=document.createElement("div");
  d.id="updBar";
  d.style.cssText="position:fixed;left:12px;right:12px;bottom:calc(var(--navh,72px) + 12px);z-index:9999;"+
    "background:var(--accent,#1F4B45);color:#fff;border-radius:14px;padding:13px 16px;"+
    "font-size:calc(16px*var(--fs));text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.22)";
  d.textContent=LT("有新版本，點一下更新");
  d.onclick=()=>doUpdate();
  document.body.appendChild(d);
}
function doUpdate(){
  const go=()=>setTimeout(()=>location.reload(true),400);
  try{
    if(window.caches)caches.keys().then(ks=>Promise.all(ks.map(k=>caches.delete(k)))).then(go);
    else go();
  }catch(e){go();}
  if("serviceWorker" in navigator){
    navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>{try{r.update();}catch(_){}}));
  }
}
async function checkUpdate(){
  const now=Date.now();
  if(__upd||now-__lastChk<5*60*1000)return;
  __lastChk=now;
  try{
    const r=await fetch("version.json?t="+now,{cache:"no-store"});
    if(!r.ok)return;
    const j=await r.json();
    if(!j||!j.version||j.version===APP_VER)return;
    __upd=true;
    if(appBusy()){updBanner();return;}
    toast("正在更新到最新版…");
    doUpdate();
  }catch(e){}
}
function forceUpdate(){
  if("serviceWorker" in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()));
  if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)));
  setTimeout(()=>location.reload(true),700);
}

const NAME_TOKEN="◇";
function xzPrompt(){
  const t=(xz.title||"").trim();
  return `收卡人稱呼：${xz.name?NAME_TOKEN+t:"（未填，請用「親愛的弟兄姊妹」）"}\n`

    +(xz.name?`\n注意：稱呼請原封不動使用「${NAME_TOKEN}${t}」這個符號，不要自行改寫或替換。`:"");
}
function xzParse(text){
  const t=String(text||"");
  let v="",r="",w="";
  const mv=t.match(/VERSE[｜|:：]\s*([\s\S]*?)(?:\n|$)/);
  const mr=t.match(/REF[｜|:：]\s*([\s\S]*?)(?:\n|$)/);
  const mw=t.match(/WORD[｜|:：]\s*([\s\S]*)$/);
  if(mv)v=mv[1].trim().replace(/^[「『]|[」』]$/g,"");
  if(mr)r=mr[1].trim();
  if(mw)w=mw[1].trim();
  if(!v&&!w){ // 後備：模型沒照格式，就整段當問候
    w=t.trim();
  }
  return {v,r,w};
}

/* 問一次 AI小智，回 {out, why}——寫祝福與改一改共用（照 321互動聖經 的作法） */
async function aiOnce(sys,ask){
  if(S.set.ai===0)return {out:"",why:LT("AI小智目前是關閉的，可到「設定 → AI小智」開啟")};
  const ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  const timer=ctrl?setTimeout(()=>{try{ctrl.abort();}catch(_){}},35000):null;
  let out="",why="";
  try{
    if(navigator.onLine===false)throw new Error("offline");
    const r=await fetch(XZ_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
      signal:ctrl?ctrl.signal:undefined,
      body:JSON.stringify({model:XZ_MODEL,max_tokens:1000,system:sys,
        messages:[{role:"user",content:ask}]})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const d=await r.json();
    out=(d.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("\n").trim();
    if(!out)why=LT("回覆是空的");
  }catch(e){
    why=(e&&e.name==="AbortError")?LT("等候得有點久，請稍後再試")
       :(e&&e.message==="offline")?LT("目前沒有網路")
       :((e&&e.message)||"network");
  }finally{if(timer)clearTimeout(timer);}
  return {out:out?out.replace(/[*#>`]/g,"").replace(/^「|」$/g,"").trim():"",why:why};
}

  const GXD = {"keys": ["adult", "teen", "kid", "seeker", "elder", "single_parent", "single", "parent", "couple", "pastor"], "icon": {"adult": "🧑", "teen": "🧒", "kid": "🧸", "seeker": "🌱", "elder": "👴", "single_parent": "👩‍👧", "single": "🙋", "parent": "👨‍👩‍👧", "couple": "💑", "pastor": "⛪"}, "names": {"adult": "成人", "teen": "青少年", "kid": "兒童", "seeker": "慕道友", "elder": "長輩", "single_parent": "單親", "single": "單身", "parent": "父母", "couple": "夫妻", "pastor": "牧者"}, "hints": {"adult": "有深度，貼近工作、家庭與關係", "teen": "幽默風趣、不說教，用你的世界來比喻", "kid": "非常簡單好懂，像在聽故事", "seeker": "還沒信主也聽得懂，不說教，給實際的幫助", "elder": "尊敬溫和、慢慢說，句子清楚好懂", "single_parent": "先接住你的辛苦，給做得到的小步驟與盼望", "single": "真誠平等，不催婚，談身分、等待與使命", "parent": "貼近養兒育女的日常：溝通、管教、陪伴與禱告", "couple": "夫妻同行：溝通、饒恕、同心與一起禱告", "pastor": "同工口吻：牧養、講道預備、團隊與不倦怠"}, "lenNames": {"brief": "簡要", "mid": "適中", "full": "詳細"}, "len": {"brief": " 回答長度：簡要。整段回答控制在 3～5 句話（約 150 字內）：直接給核心答案、一句關鍵經文或一個比喻，最後一句禱告或一個小步驟。不用表格、不列長清單。", "full": " 回答長度：詳細。請完整、有條理地回答（約 800～1200 字）：說明經文脈絡、關鍵字詞的意思、相關經文對照、清楚的321應用、這星期可以操練的具體步驟，最後以禱告結束。可用簡短小標題。"}, "aud": {"adult": {"sys": " 回答對象：成年人。請用成熟、沉穩而溫暖的口吻，可以有適度的深度：點出經文脈絡與關鍵字詞的意思，連結工作、婚姻、教養、人際與屬靈爭戰，最後帶出一個這星期就能操練的具體步驟。", "write": "\n讀者是成年人：口吻成熟、溫暖、真誠。", "style": "風格：沉穩清楚；其中一兩題帶出生命應用。", "res": ["再讀一遍這章，細細品味，下次會更好。", "不錯！這章的信息已經進到你裡面了。", "太棒了！經文的話已經住在你心裡。"], "q": ["這段經文讓我看見神是怎樣的一位神？", "這段經文照出我裡面什麼樣的舊人有己？", "若讓耶穌在這件事上作王，我會怎麼做？", "這段經文中，耶穌給我看見什麼樣的榜樣？", "聖靈要藉這段話引導我今天走哪一步？", "這裡的人為什麼會失敗？根源是驕傲還是恐懼？", "這段經文如何幫助我操練無己的生命？", "我可以把這段經文用在與誰的關係上？", "這段經文與主禱文「願你的國降臨」有什麼關聯？", "請用一個比喻幫我明白這段經文的核心。"], "fu": [["💍", "婚姻", "請針對你剛才的回答，說明怎麼把它應用在夫妻關係與婚姻裡，並給我一個這個星期可以做的具體小步驟。"], ["👨‍👩‍👧", "家庭", "請針對你剛才的回答，說明怎麼把它應用在家庭與教養孩子（或與父母相處）上，並給我一個這個星期可以做的具體小步驟。"], ["💼", "職場", "請針對你剛才的回答，說明怎麼把它應用在工作與職場上（同事、主管、壓力、誠信），並給我一個這個星期可以做的具體小步驟。"], ["🏡", "日常", "請針對你剛才的回答，說明怎麼把它應用在日常生活的小事上（時間、金錢、習慣），並給我一個這個星期可以做的具體小步驟。"], ["💭", "內心", "請針對你剛才的回答，說明怎麼把它應用在面對內心的情緒與軟弱上（焦慮、憤怒、驕傲），並給我一個這個星期可以做的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "teen": {"sys": " 回答對象：青少年（約12–18歲）。請用幽默風趣、輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關     });

  async function hymnFetch(s) {
    const tries = songBase[s.f] != null ? [songBase[s.f]] : ['', 'music/'];
    let why = '';
    for (const b of tries) {
      try {
        const r = await fetch(SITE + b + encodeURIComponent(s.f), { mode: 'cors' });
        if (!r.ok) { why = 'HTTP ' + r.status; continue; }
        const blob = await r.blob();

        songBase[s.f] = b;
        return blob;

    }
    throw new Error(why || 'fail');

  /* ── 離開 App 再回來（或被系統重載）時接回原位：相機（10 分鐘內、且不在內嵌視窗）→ AI 配樂 → AI 生圖（12 小時內） ── */
  function resumeBoot() {
    let o = null, mode = '';
    if (!isFramed()) { o = lsTake('cam'); if (o && o.item && Date.now() - o.ts <= 10 * 60 * 1000) mode = 'cam'; else o = null; }
    if (!mode) { o = lsTake('mu'); if (o && o.item && Date.now() - o.ts <= 12 * 3600 * 1000) mode = 'mu'; else o = null; }
    if (!mode) { o = lsTake('ai'); if (o && o.item && Date.now() - o.ts <= 12 * 3600 * 1000) mode = 'ai'; else o = null; }
    if (!mode) return;
    let tries = 0;
    const iv = setInterval(() => {
      tries++;
      let ready = false;
      try { ready = !!(D && D.txt && S); } catch (e) { ready = false; }
      if (!ready) { if (tries > 40) clearInterval(iv); return; }

  /* ── iOS 分段 MP4 重新封裝（mx_*，照抄互動聖經，勿改）── */
function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }

}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }

function mx_parseTfhd(b,mx_box){

  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){

function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;

function mx_remux(bytes){

        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;
        }
      });
    });
  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};

    const newTraks=[];

      const tkc=mx_children(b,tk);

  out.set(ftypBuf,p);p+=ftypBuf.length;
  out.set(moovNew,p);p+=moovNew.length;
  out.set(mdatHead,p);p+=16;

  async function toggleRec() {
    if (recOn()) { recStopNow(); return; }
    if (!item) return;
    hymnStop(); stopTTS();
    if (recMode === 's' && (!selfieStream || !selfieStream.active)) {
      try { selfieStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false }); }
      catch (e) { recMode = 'c'; camFail(e); paint(); }
      if (recMode === 's') { paint(); attachSelfie(); await new Promise(r => setTimeout(r, 500)); }
    }
    let mic;
    try { mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
    catch (e) {
      try { mic = await navigator.mediaDevices.getUserMedia({ audio: true }); }

    }

    let ac = null, bgmEl = null, bgmURL = null, audioStream = mic, micGain = null, bgmGain = null;
    try {
      ac = new (window.AudioContext || window.webkitAudioContext)();
      try { await ac.resume(); } catch (_) {}
      const dst = ac.createMediaStreamDestination();
      micGain = ac.createGain(); micGain.gain.value = 0.0001;
      ac.createMediaStreamSource(mic).connect(micGain).connect(dst);
      if (bgmBlob) {
        bgmURL = URL.createObjectURL(bgmBlob);

        bgmGain = ac.createGain(); bgmGain.gain.value = 0.0001;

    }

      mic.getTracks().forEach(t => t.stop());

      try { if (bgmEl) { bgmEl.pause(); bgmEl.src = ''; } } catch (_) {}
      try { if (bgmURL) URL.revokeObjectURL(bgmURL); } catch (_) {}
      try { if (ac) ac.close(); } catch (_) {}
      const type = mr.mimeType || mime || (kind === 'video' ? 'video/webm' : 'audio/webm');
      await finishRec(new Blob(chunks, { type }), type, kind);

    await new Promise(r => setTimeout(r, 380));

    mr.start(1000);

    if (bgmEl) { try { await bgmEl.play(); } catch (_) {} fadeIn(bgmGain, ac, st().vol, 0.9); }

    chunks = []; recSec = 0;
    mr.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
    mr.onstop = async () => {
      clearInterval(recTimer); cancelAnimationFrame(recAnim); curFade = null; recFading = false;
      try { if (bgmEl) { bgmEl.pause(); bgmEl.src = ''; } } catch (_) {}
      try { if (bgmURL) URL.revokeObjectURL(bgmURL); } catch (_) {}
      try { if (ac) ac.close(); } catch (_) {}
      const type = mr.mimeType || mime || 'video/webm';
      await finishRec(new Blob(chunks, { type }), type, 'video');
    };

      const left = bgmEl.duration - bgmEl.currentTime;
      if (left <= BGM_FADEOUT && recOn()) fadeOutStop(mcGain, ac, Math.max(.5, left));
    };

    setTimeout(() => { if (!recFading && recOn()) fadeOutStop(mcGain, ac, BGM_FADEOUT); }, Math.max(0, lim - BGM_FADEOUT) * 1000);
    setTimeout(() => { if (recOn()) mr.stop(); }, lim * 1000 + 300);

adius:6px;flex:0 0 auto;margin-top:3px; display:grid;place-items:center;font-size:13px;color:#fff}\n.gxsmask .chk.on .box,#gxuBox .chk.on .box,#gxuPanel .chk.on .box{background:var(--pine);border-color:var(--pine)}\n.gxsmask .chk.on .t,#gxuBox .chk.on .t,#gxuPanel .chk.on .t{color:var(--dusk);text-decoration:line-through}\n.gxsmask .chk .t,#gxuBox .chk .t,#gxuPanel .chk .t{flex:1;font-size:15px;line-height:1.7}\n.gxsmask .note,#gxuBox .note,#gxuPanel .note{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card); color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical}\n.gxsmask .hr,#gxuBox .hr,#gxuPanel .hr{height:1px;background:var(--line);margin:22px 0}\n.gxsmask .btn.danger,#gxuBox .btn.danger,#gxuPanel .btn.danger{color:var(--clay);border-color:var(--clay)}\n.gxsmask .btn.xs2,#gxuBox .btn.xs2,#gxuPanel .btn.xs2{font-size:12.5px;padding:6px 11px}\n\n#gxuFab{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);width:46px;height:46px;border-radius:50%;border:0;background:#1F4D3D;color:#fff;font-size:21px;z-index:95;box-shadow:0 3px 12px rgba(0,0,0,.28);opacity:.94;display:grid;place-items:center;cursor:pointer;padding:0}\n#gxuFab.hasSel{outline:3px solid #D4A65B;animation:gxuPulse 1.2s ease-in-out 3}\n@keyframes gxuPulse{50%{transform:scale(1.12)}}\nhtml[data-gxs=\"1\"] #gxuFab{display:none}\n#gxuPanel,#gxuBox{position:fixed;inset:0;z-index:185;display:none}\n#gxuPanel.on,#gxuBox.on{display:flex}\n#gxuPanel{background:rgba(10,16,14,.5);align-items:flex-end;justify-content:center}\n#gxuPanel .gxuc{background:#F7F8F4;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px rgba(0,0,0,.25)}\n#gxuPanel h4{margin:0 0 8px;font-family:var(--serif);font-size:18px}\n#gxuPanel textarea{min-height:120px;resize:vertical}\n#gxuPanel .row{margin-top:10px}\n#gxuBox{background:var(--paper);flex-direction:column;overflow:hidden}\n#gxuBox .gxuh{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top,0px)) 12px 8px;border-bottom:1px solid var(--line);background:var(--paper)}\n#gxuBox .gxuh b{flex:1;font-family:var(--serif);font-size:17px}\n#gxuBox .gxuh button{width:40px;height:40px;border:0;background:transparent;font-size:18px;color:var(--ink);border-radius:10px;cursor:pointer}\n#gxuBox .gxuv{flex:1;overflow:auto;padding:4px 16px calc(24px + env(safe-area-inset-bottom,0px));max-width:720px;width:100%;margin:0 auto}\n#gxuToast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:#12181B;color:#EEF0EB;padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:400;opacity:0;transition:.2s;pointer-events:none;max-width:86vw;text-align:center}\n#gxuToast.on{opacity:1}\n";

let lastSel = '', lastAt = 0, selT = 0;
function mountFab() {
  injectCss();
  if (!CFG.fab || $1('#gxuFab')) return;
  const f = document.createElement('button'); f.id = 'gxuFab'; f.type = 'button'; f.textContent = '🖼';
  f.setAttribute('aria-label', 'Card studio');
  f.onclick = openPanel;
  document.body.appendChild(f);
  document.addEventListener('selectionchange', () => {
    let s = ''; try { s = String(window.getSelection ? window.getSelection() : '').replace(/\s+/g, ' ').trim(); } catch (e) {}
    if (s.length >= 2 && s.length <= 1500) { lastSel = s; lastAt = Date.now(); f.classList.add('hasSel'); }
    else { clearTimeout(selT); selT = setTimeout(() => { if (Date.now() - lastAt > 1800) f.classList.remove('hasSel'); }, 2200); }
  });
}
function openPanel() {
  curL = langNow();
  let p = $1('#gxuPanel');
  if (!p) { p = document.createElement('div'); p.id = 'gxuPanel'; document.body.appendChild(p); p.addEventListener('click', e => { if (e.target === p) p.classList.remove('on'); }); }
  const pre = (Date.now() - lastAt < 90000) ? lastSel : '';
  p.innerHTML = '<div class="gxuc"><h4>🖼 ' + tt('美圖工作室', 'Card studio') + '</h4>' +
    '<p class="hint">' + tt('在畫面上選取一段話再按這顆鈕，會自動帶進來；也可以自己貼上或輸入。', 'Select some text on the page, then tap this button — it fills in here. You can also paste or type your own.') + '</p>' +
    '<textarea id="gxuIn" placeholder="' + tt('想做成美圖的話…', 'The words for your card…') + '"></textarea>' +
    '<div class="row"><button class="btn pri" id="gxuMk">🖼 ' + tt('做成美圖', 'Make a card') + '</button><button class="btn" id="gxuWk">📂 ' + tt('我的作品', 'My creations') + '</button><button class="btn" id="gxuCl">' + tt('關閉', 'Close') + '</button></div></div>';
  p.classList.add('on');
  const ta = $1('#gxuIn'); ta.value = pre;
  $1('#gxuCl').onclick = () => p.classList.remove('on');
  $1('#gxuWk').onclick = () => { p.classList.remove('on'); openWorks(); };
  $1('#gxuMk').onclick = () => {
    const t = ta.value.trim();
    if (!t) { toastMsg(tt('先選取或貼上一段話', 'Select or paste some text first')); return; }
    p.classList.remove('on');
    lastSel = ''; API.open({ text: t, ref: CFG.bz, plain: true });
  };
  try { if (curL === 'sc') scWalk(p); } catch (e) {}
}
/* ── 小智回答下方的「做成美圖」 ── */
function txtOf(el) { const c = el.cloneNode(true); c.querySelectorAll('[data-gxu],button').forEach(x => x.remove()); return (c.innerText || c.textContent || '').trim(); }
function mountAnswers() {
  if (!CFG.ans) return;
  const A = CFG.ans; let t = 0;
  const scan = () => {
    document.querySelectorAll(A.sel).forEach(el => {
      if (el.querySelector('[data-gxu]')) return;
      const body = A.body === ':self' ? el : el.querySelector(A.body); if (!body) return;
      const txt = txtOf(body); if (txt.length < 8) return;
      const act = (A.act && el.querySelector(A.act)) || el;
      const b = document.createElement('button');
      b.type = 'button'; b.setAttribute('data-gxu', '1'); b.className = A.btn || 'msg-act';
      b.textContent = '🖼 ' + tt('做成美圖', 'Card');
      b.onclick = e => {
        e.stopPropagation();
        let q = '';
        const qq = el.querySelector('.msg-q'); if (qq) q = qq.innerText || '';
        if (!q) { let p = el.previousElementSibling; while (p && !q) { if (p.matches && p.matches(A.user || '.msg.user')) q = p.innerText || ''; p = p.previousElementSibling; } }
        API.answer(txtOf(body), q);
      };
      act.appendChild(b);
    });
  };
  new MutationObserver(() => { clearTimeout(t); t = setTimeout(scan, 250); }).observe(document.body, { childList: true, subtree: true });
  scan();
}
const API = {
  ready: () => true, cfg: CFG,
  open(o) { const g = ensure(); return g.open(o); },
  answer(text, q) { const g = ensure(); return g.fromAnswer(text, q); },
  works: openWorks, panel: openPanel,
  state: () => STATE
};
window.GXU = API;
const start = () => { try { mountFab(); mountAnswers(); injectCss(); } catch (e) {} };
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();
