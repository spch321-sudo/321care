<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<title>321愛的關懷 ｜ 國度321空中團契</title>
<meta name="description" content="按場景分享合適的經文與祝福，記錄生日與紀念日，陪伴每一位弟兄姊妹成為得勝者。">
<meta property="og:title" content="321愛的關懷">
<meta property="og:description" content="讓每一位弟兄姊妹，在對的時候收到一句對的話。">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_TW">
<meta name="theme-color" content="#1F4B45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321愛的關懷">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta property="og:image" content="og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<style>
:root{
  --ink:#16211F; --ink2:#41544F; --ink3:#6B7E79;
  --pine:#1F4B45; --pine-d:#153631; --pine-l:#2E6A61;
  --gold:#B87A22; --gold-l:#E8C97A;
  --paper:#FAF6EE; --card:#FFFFFF; --mist:#E9F0EC; --line:#DCD5C7;
  --red:#A93B26; --amber:#B8791F; --green:#2E7D5B;
  --fs:1; --r:18px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --serif:"Noto Serif TC","Songti TC","STSong","PMingLiU","新細明體",serif;
  --sans:"PingFang TC","Noto Sans TC","Microsoft JhengHei","微軟正黑體",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--sans); background:var(--paper); color:var(--ink);
  font-size:calc(19px*var(--fs)); line-height:1.75; overscroll-behavior-y:none;
  -webkit-text-size-adjust:100%;
}
body.dark{--paper:#121A18;--card:#1B2523;--ink:#F0EDE4;--ink2:#C3CFC9;--ink3:#93A29C;--mist:#22302C;--line:#33433E;--gold-l:#E8C97A}
#app{padding-bottom:calc(96px + var(--safe-b))}

/* ---------- 頂欄 ---------- */
.top{position:sticky;top:0;z-index:40;background:var(--pine);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px}
.top h1{margin:0;font-family:var(--serif);font-size:calc(23px*var(--fs));font-weight:600;letter-spacing:.06em}
.top .sub{font-size:calc(13px*var(--fs));opacity:.78;letter-spacing:.14em;margin-top:2px}
.top .grp{font-size:calc(13px*var(--fs));opacity:.9;margin-top:4px}

/* ---------- 通用 ---------- */
.wrap{padding:16px 14px 8px}
.sec-t{font-family:var(--serif);font-size:calc(20px*var(--fs));font-weight:600;margin:22px 2px 10px;
  display:flex;align-items:center;gap:9px;color:var(--ink)}
.sec-t::before{content:"";width:5px;height:1.05em;background:var(--gold);border-radius:3px;flex:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.muted{color:var(--ink3);font-size:calc(16px*var(--fs))}
.empty{text-align:center;padding:34px 18px;color:var(--ink3)}
.empty b{display:block;font-family:var(--serif);font-size:calc(19px*var(--fs));color:var(--ink2);margin-bottom:6px}
button{font-family:inherit;font-size:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:56px;padding:0 20px;border-radius:15px;border:2px solid var(--pine);
  background:var(--pine);color:#fff;font-weight:600;font-size:calc(18px*var(--fs));line-height:1.25;text-align:center;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--pine);}
body.dark .btn.ghost{color:var(--gold-l);border-color:var(--gold-l)}
.btn.gold{background:var(--gold);border-color:var(--gold)}
.btn.sm{min-height:46px;padding:0 15px;font-size:calc(16px*var(--fs));border-radius:12px}
.btn.wide{width:100%}
.btn.danger{background:var(--red);border-color:var(--red)}
.row{display:flex;gap:9px;flex-wrap:wrap}
.row.tight{gap:7px}
input,select,textarea{width:100%;font-family:inherit;font-size:calc(18px*var(--fs));
  padding:13px 14px;border:2px solid var(--line);border-radius:13px;background:var(--card);color:var(--ink);min-height:52px}
textarea{line-height:1.7;resize:vertical}
input:focus,select,textarea:focus{outline:3px solid var(--gold-l);outline-offset:1px}
label.f{display:block;margin:12px 0 5px;font-size:calc(16px*var(--fs));font-weight:600;color:var(--ink2)}
.hint{font-size:calc(14px*var(--fs));color:var(--ink3);line-height:1.6;margin-top:5px}

/* ---------- 底部導覽 ---------- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--card);border-top:1px solid var(--line);padding-bottom:var(--safe-b)}
.nav button{background:none;border:0;padding:9px 2px 8px;color:var(--ink3);display:flex;flex-direction:column;
  align-items:center;gap:3px;font-size:calc(13px*var(--fs));font-weight:600}
.nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--pine)}
body.dark .nav button.on{color:var(--gold-l)}
.nav button.on svg{stroke-width:2.4}

/* ---------- 今日 ---------- */
.hero{margin:14px;padding:20px 18px;border-radius:22px;color:#fff;
  background:linear-gradient(150deg,#1F4B45 0%,#2E6A61 55%,#3E8073 100%);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-42px;top:-42px;width:170px;height:170px;border-radius:50%;
  background:radial-gradient(circle,rgba(232,201,122,.42),transparent 68%)}
.hero .d{font-size:calc(15px*var(--fs));opacity:.82;letter-spacing:.1em}
.hero .v{font-family:var(--serif);font-size:calc(21px*var(--fs));line-height:1.7;margin:9px 0 6px;position:relative;z-index:1}
.hero .r{font-size:calc(14px*var(--fs));opacity:.8}
.pill{display:inline-block;padding:3px 11px;border-radius:999px;font-size:calc(13px*var(--fs));font-weight:700}
.pill.red{background:#F6DED8;color:var(--red)} .pill.amber{background:#F7EBD3;color:#8A5A14}
.pill.green{background:#DCEDE4;color:var(--green)} .pill.gold{background:#F6ECD6;color:#8A5A14}
body.dark .pill.red{background:#3A211B}body.dark .pill.amber{background:#382D18}body.dark .pill.green{background:#1D3329}body.dark .pill.gold{background:#382D18}

.prow{display:flex;align-items:center;gap:12px;padding:13px 14px;background:var(--card);
  border:1px solid var(--line);border-radius:15px;margin-bottom:9px}
.prow .av{width:48px;height:48px;border-radius:14px;background:var(--mist);color:var(--pine);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);
  font-size:calc(20px*var(--fs));font-weight:700;flex:none}
body.dark .prow .av{color:var(--gold-l)}
.prow .nm{font-weight:700;font-size:calc(18px*var(--fs))}
.prow .mt{font-size:calc(14px*var(--fs));color:var(--ink3);margin-top:1px}
.prow .go{margin-left:auto;flex:none}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.dot.red{background:var(--red)}.dot.amber{background:var(--amber)}.dot.green{background:var(--green)}

/* ---------- 卡片場景 ---------- */
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 14px 12px;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:10px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);
  color:var(--ink2);font-weight:600;font-size:calc(16px*var(--fs));white-space:nowrap;line-height:1.3}
.chip.on{background:var(--pine);border-color:var(--pine);color:#fff}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px}
.scene{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 13px;text-align:left}
.scene b{display:block;font-family:var(--serif);font-size:calc(18px*var(--fs));font-weight:600}
.scene span{display:block;font-size:calc(13px*var(--fs));color:var(--ink3);margin-top:3px}

.vcard{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px}
.vcard .vs{background:var(--mist);padding:18px 17px;border-bottom:1px solid var(--line)}
.vcard .vt{font-family:var(--serif);font-size:calc(21px*var(--fs));line-height:1.85;color:var(--pine-d)}
body.dark .vcard .vt{color:var(--gold-l)}
.vcard .vr{margin-top:8px;font-size:calc(14px*var(--fs));color:var(--ink3);letter-spacing:.06em}
.vcard .vb{padding:16px 17px;white-space:pre-wrap;line-height:1.85}
.vcard .v3{margin:0 17px 14px;padding:11px 13px;background:#F6ECD6;border-left:4px solid var(--gold);
  border-radius:0 10px 10px 0;font-size:calc(15px*var(--fs));color:#6E4A0F;line-height:1.65}
body.dark .vcard .v3{background:#312918;color:var(--gold-l)}
.vcard .va{padding:0 17px 16px;display:flex;gap:8px;flex-wrap:wrap}

/* ---------- 彈出層 ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(10,18,16,.55);display:none;align-items:flex-end}
.sheet.on{display:flex}
.sheet>div{background:var(--paper);width:100%;max-height:94vh;overflow-y:auto;border-radius:24px 24px 0 0;
  padding:18px 16px calc(28px + var(--safe-b));-webkit-overflow-scrolling:touch}
.sh-h{display:flex;align-items:center;margin-bottom:6px}
.sh-h b{font-family:var(--serif);font-size:calc(21px*var(--fs))}
.sh-h button{margin-left:auto;background:none;border:0;color:var(--ink3);font-size:calc(28px*var(--fs));line-height:1;padding:4px 8px}
.grab{width:44px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 12px}

/* ---------- 播放（有聲卡片） ---------- */
#stage{position:fixed;inset:0;z-index:95;background:#0E1917;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:26px;text-align:center}
#stage.on{display:flex}
#stage .sv{font-family:var(--serif);color:#F3EEE2;font-size:clamp(21px,5.4vw,34px);line-height:2;max-width:760px}
#stage .sv p{opacity:0;transform:translateY(14px);transition:all .8s ease;margin:.55em 0}
#stage .sv p.show{opacity:1;transform:none}
#stage .sr{color:var(--gold-l);margin-top:20px;font-size:clamp(14px,3.4vw,18px);letter-spacing:.12em;opacity:0;transition:opacity .8s}
#stage .sr.show{opacity:1}
#stage video{background:#000}
#stage .x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;background:rgba(255,255,255,.12);
  color:#fff;border:0;border-radius:50%;width:48px;height:48px;font-size:26px;line-height:1}
#stage .tip{position:absolute;bottom:calc(22px + var(--safe-b));left:20px;right:20px;color:#8FA39D;font-size:14px;line-height:1.6}

.toast{position:fixed;left:50%;bottom:calc(110px + var(--safe-b));transform:translateX(-50%) translateY(16px);
  background:var(--pine-d);color:#fff;padding:13px 22px;border-radius:999px;z-index:120;opacity:0;
  transition:all .3s;pointer-events:none;font-size:calc(16px*var(--fs));max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

.rec-dot{width:14px;height:14px;border-radius:50%;background:var(--red);animation:bp 1.1s infinite}
@keyframes bp{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.tag{display:inline-block;padding:2px 9px;border-radius:8px;background:var(--mist);color:var(--pine);
  font-size:calc(13px*var(--fs));font-weight:700;margin-right:5px}
body.dark .tag{color:var(--gold-l)}
hr.sep{border:0;border-top:1px solid var(--line);margin:16px 0}
.fam{display:flex;gap:7px;margin-bottom:7px}
.fam input:first-child{flex:0 0 34%}
.fam button{flex:none;width:52px;border:2px solid var(--line);background:var(--card);border-radius:12px;color:var(--red);font-size:22px}
.tplbar{display:flex;gap:9px;overflow-x:auto;padding:2px 0 6px;-webkit-overflow-scrolling:touch}
.tplbar::-webkit-scrollbar{display:none}
.tpl{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;padding:0;border:0;background:none;width:74px}
.tpl .sw{width:70px;height:70px;border-radius:16px;border:2px solid var(--line);box-shadow:inset 0 -8px 18px rgba(0,0,0,.06)}
.tpl.on .sw{border-color:var(--pine);box-shadow:0 0 0 3px var(--gold-l)}
body.dark .tpl.on .sw{border-color:var(--gold-l)}
.tpl span:last-child{font-size:calc(13px*var(--fs));color:var(--ink2);font-weight:600;white-space:nowrap}
.tpl.on span:last-child{color:var(--pine)}
body.dark .tpl.on span:last-child{color:var(--gold-l)}
.tpl .sw.brd-classic{background:var(--mist);border:2px solid var(--pine);box-shadow:inset 0 0 0 4px var(--card),inset 0 0 0 5px var(--gold-l)}
.tpl .sw.brd-corner{background:var(--mist);border:0;position:relative}
.tpl .sw.brd-corner::before,.tpl .sw.brd-corner::after{content:"";position:absolute;width:20px;height:20px}
.tpl .sw.brd-corner::before{top:6px;left:6px;border-top:3px solid var(--gold);border-left:3px solid var(--gold)}
.tpl .sw.brd-corner::after{bottom:6px;right:6px;border-bottom:3px solid var(--gold);border-right:3px solid var(--gold)}
.tpl .sw.brd-inline{background:var(--mist);box-shadow:inset 0 0 0 6px var(--card),inset 0 0 0 7px var(--pine)}
.tpl .sw.brd-dots{background:var(--mist);border:3px dotted var(--pine)}
.tpl .sw.brd-ornate{background:var(--mist);border:2px solid var(--pine);position:relative}
.tpl .sw.brd-ornate::before,.tpl .sw.brd-ornate::after{content:"";position:absolute;width:14px;height:14px}
.tpl .sw.brd-ornate::before{top:8px;left:8px;border-top:2px solid var(--gold);border-left:2px solid var(--gold)}
.tpl .sw.brd-ornate::after{bottom:8px;right:8px;border-bottom:2px solid var(--gold);border-right:2px solid var(--gold)}
.tpl .sw.brd-none{background:repeating-linear-gradient(45deg,var(--mist),var(--mist) 6px,var(--card) 6px,var(--card) 12px)}
canvas#cv{width:100%;border-radius:16px;border:1px solid var(--line);display:block}

.cprev{margin:12px 0 4px;min-height:60px}
.hlist{max-height:56vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
.hrow{display:flex;align-items:center;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.hrow:last-child{border-bottom:none}
.hmeta{flex:1;min-width:120px}
.hrow .ht{font-weight:700;font-size:calc(15px*var(--fs))}
.hrow .hs{font-size:calc(12px*var(--fs));color:var(--ink3)}
.pxgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-height:140px}
.pxcell{position:relative;padding:0;border:2px solid transparent;border-radius:10px;overflow:hidden;
  background:var(--mist);cursor:pointer;aspect-ratio:3/4}
.pxcell img{width:100%;height:100%;object-fit:cover;display:block}
.pxcell span{position:absolute;left:0;right:0;bottom:0;padding:12px 5px 3px;font-size:9.5px;line-height:1.3;
  color:#fff;text-align:left;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;
  background:linear-gradient(to bottom,rgba(0,0,0,0),rgba(0,0,0,.66))}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <h1 id="appTitle">321愛的關懷</h1>
    <div class="sub" id="appSub">先生命 · 再關係 · 後事工</div>
    <div class="grp" id="topGrp"></div>
  </div>
  <main id="view" role="main"></main>
</div>

<nav class="nav" id="nav" role="navigation" aria-label="主要導覽"></nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT"><div><div class="grab"></div><div class="sh-h"><b id="shT"></b><button onclick="closeSheet()">×</button></div><div id="shB"></div></div></div>

<div id="stage">
  <button class="x" onclick="stopStage()">×</button>
  <video id="stageVid" playsinline controls style="display:none;max-width:100%;max-height:78vh;border-radius:14px"></video>
  <div class="sv" id="stageV"></div>
  <div class="sr" id="stageR"></div>
  <div class="tip" id="stageTip"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<audio id="player" playsinline></audio>
<script>
/* ============ 經文卡片庫（和合本）｜每場景 10 張 ============ */
const SCENES=[
{id:"birth",n:"生日祝福",k:"例行",d:"數算日子的恩典",cards:[
 {v:"求你指教我們怎樣數算自己的日子，好叫我們得著智慧的心。",r:"詩篇 90:12",
  w:"{稱呼}生日快樂！\n又走過一年，回頭看，處處都是神的手在扶持。\n日子不是我們自己撐過來的，是神一天一天量給我們的恩典。\n願新的一歲，您在主裡更加喜樂、更加穩妥。"},
 {v:"我們不致消滅，是出於耶和華諸般的慈愛；是因他的憐憫不致斷絕。每早晨，這都是新的；你的誠實極其廣大！",r:"耶利米哀歌 3:22-23",
  w:"{稱呼}生日蒙福！\n過去這一年若有疲乏、若有眼淚，神都看見了。\n祂的憐憫每早晨都是新的，從來沒有一天短缺過。\n願您在新的一年，天天經歷這份不斷絕的慈愛。"},
 {v:"我未成形的體質，你的眼早已看見了；你所定的日子，我尚未度一日，你都寫在你的冊上了。",r:"詩篇 139:16",
  w:"{稱呼}生日平安！\n在您還沒出生以前，神就已經認識您、揀選您、為您預備了道路。\n您的存在不是偶然，是天父親自的心意。\n願您這一年，活出神為您所寫的那一頁。"},
 {v:"耶和華賜福給你，保護你。",r:"民數記 6:24",
  w:"{稱呼}生日快樂！\n這是最古老、也最溫暖的一句祝福。\n願神今年賜福給您，也親自保護您所走的每一步。\n很高興有您成為我們當中的一員。"},
 {v:"你一生的年日必蒙保守。",r:"詩篇 128 意譯（參 詩 91:16）",
  w:"{稱呼}生日蒙恩！\n年紀增添，不是老去，是被神保守著又走了一程。\n願您的身體健壯、心裡平安，日子越過越有滋味。\n生日快樂！"},
 {v:"你要以耶和華為樂，他就將你心裡所求的賜給你。",r:"詩篇 37:4",
  w:"{稱呼}生日快樂！\n願您新的一歲，最深的滿足不在別的，就在主自己。\n以祂為樂的人，心裡不缺乏。\n祝您這一年喜樂滿溢！"},
 {v:"這是耶和華所定的日子，我們在其中要高興歡喜！",r:"詩篇 118:24",
  w:"{稱呼}生日快樂！\n今天是為您而定的日子，值得好好歡喜。\n謝謝神把您帶到這個世界，也帶進我們的生命裡。\n願您今天被滿滿的愛圍繞。"},
 {v:"我要一生一世住在耶和華的殿中，瞻仰他的榮美。",r:"詩篇 27:4",
  w:"{稱呼}生日蒙福！\n願您這一生最想要的，就是與主更親近。\n一年一年地與祂同行，是最有福的人生。\n生日快樂，願主的榮美常在您眼前。"},
 {v:"你們要嘗嘗主恩的滋味，便知道他是美善；投靠他的人有福了！",r:"詩篇 34:8",
  w:"{稱呼}生日快樂！\n過去一年您嘗過的恩典，都是真的。\n新的一年，願您繼續嘗到主的美善，成為投靠祂的有福之人。\n為您獻上滿滿的祝福！"},
 {v:"你們白白地得來，也要白白地捨去。",r:"馬太福音 10:8",
  w:"{稱呼}生日蒙恩！\n這些年您領受了神的恩典，也把恩典分給了許多人。\n願您新的一歲，繼續作別人的祝福。\n您的存在，就是我們的禮物。生日快樂！"}]},

{id:"anniv",n:"結婚紀念",k:"例行",d:"三股合成的繩子",cards:[
 {v:"有人攻勝孤身一人，若有二人便能敵擋他；三股合成的繩子不容易折斷。",r:"傳道書 4:12",
  w:"{稱呼}與{配偶}結婚紀念快樂！\n兩個人能走這麼多年，靠的不只是感情，是中間那一股——主自己。\n願這條三股的繩子越纏越緊，越走越有力。"},
 {v:"你們作丈夫的，要愛你們的妻子，正如基督愛教會，為教會捨己。",r:"以弗所書 5:25",
  w:"{稱呼}、{配偶}，結婚週年蒙福！\n愛不是感覺好的時候才付出，是像主一樣，先捨己。\n這些年彼此的忍耐與饒恕，主都記念。\n願你們的家，繼續成為別人看得見的見證。"},
 {v:"愛情，眾水不能息滅，大水也不能淹沒。",r:"雅歌 8:7",
  w:"{稱呼}與{配偶}結婚紀念日蒙恩！\n風浪走過了，水淹不熄的，才是真愛情。\n願你們回頭看見神的保守，往前看見更美的年日。"},
 {v:"神配合的，人不可分開。",r:"馬太福音 19:6",
  w:"{稱呼}、{配偶}，週年快樂！\n你們的結合是神親自配合的，這是何等的祝福。\n願你們一生守住這份約，讓神的同在充滿你們的家。"},
 {v:"二人成為一體。",r:"創世記 2:24",
  w:"{稱呼}與{配偶}結婚紀念快樂！\n成為一體，是一輩子的功課，也是一輩子的恩典。\n願你們越來越同心，越來越明白彼此。\n為你們獻上祝福的禱告。"},
 {v:"愛是恆久忍耐，又有恩慈……凡事包容，凡事相信，凡事盼望，凡事忍耐。",r:"哥林多前書 13:4,7",
  w:"{稱呼}、{配偶}，週年蒙福！\n這段經文你們一定聽過很多次，但真正活出來，是一生的功課。\n謝謝你們用歲月，把它活成了真的。\n願愛在你們中間長闊高深。"},
 {v:"願你的泉源蒙福！要喜悅你幼年所娶的妻。",r:"箴言 5:18",
  w:"{稱呼}、{配偶}，結婚紀念快樂！\n願你們的愛情像活水的泉源，不枯乾、不變味。\n多年之後，仍然為彼此喜悅。\n這是神給婚姻最美的祝福。"},
 {v:"看哪，弟兄和睦同居是何等地善，何等地美！",r:"詩篇 133:1",
  w:"{稱呼}與{配偶}週年蒙恩！\n和睦同居是善、是美，也是需要天天選擇的。\n謝謝你們讓家成為一個有愛、有主的地方。\n祝你們結婚紀念快樂！"},
 {v:"至於我和我家，我們必定事奉耶和華。",r:"約書亞記 24:15",
  w:"{稱呼}、{配偶}，結婚紀念快樂！\n你們一起立下的這個心志，是全家最寶貴的基業。\n願你們的家世世代代事奉主。\n為你們獻上感恩與祝福。"},
 {v:"耶和華必成全關乎我的事；耶和華啊，你的慈愛永遠長存！",r:"詩篇 138:8",
  w:"{稱呼}與{配偶}週年蒙福！\n走過的每一步，都有神在成全。\n未走的路，祂也必負責到底。\n願你們手牽手，繼續數算祂永遠長存的慈愛。"}]},

{id:"weekly",n:"每週問安",k:"例行",d:"平安的問候",cards:[
 {v:"這是耶和華所定的日子，我們在其中要高興歡喜！",r:"詩篇 118:24",
  w:"{稱呼}平安！\n新的一週開始了，今天是主定的日子。\n不管手上有多少事，先讓心安在主面前。\n我為您禱告，願您這週有力量、有喜樂。"},
 {v:"願耶和華賜福給你，保護你。願耶和華使他的臉光照你，賜恩給你。願耶和華向你仰臉，賜你平安。",r:"民數記 6:24-26",
  w:"{稱呼}平安！\n把這段古老的祝福送給您和{家人}。\n願神的臉光照您的家，願祂的平安覆庇您所走的每一步。"},
 {v:"我每逢想念你們，就感謝我的神。",r:"腓立比書 1:3",
  w:"{稱呼}平安！\n今天想到您，就為您感謝神。\n沒有特別的事，只是想讓您知道：有人記得您，也在為您禱告。"},
 {v:"你們要靠主常常喜樂。我再說，你們要喜樂。",r:"腓立比書 4:4",
  w:"{稱呼}平安！\n新的一週，願喜樂成為您的力量。\n喜樂不是因為事事順利，是因為主與我們同在。\n祝您這週被主的喜樂充滿。"},
 {v:"耶和華是我的牧者，我必不致缺乏。",r:"詩篇 23:1",
  w:"{稱呼}平安！\n這一週有牧人走在前面，您什麼都不缺。\n把擔子交給祂，安心地過這七天。\n我在為您守望。"},
 {v:"要常常喜樂，不住地禱告，凡事謝恩。",r:"帖撒羅尼迦前書 5:16-18",
  w:"{稱呼}平安！\n這三句話，是一週最好的節奏：喜樂、禱告、謝恩。\n願您這週活出這樣的節奏，心裡安穩。\n主與您同在。"},
 {v:"你的日子如何，你的力量也必如何。",r:"申命記 33:25",
  w:"{稱呼}平安！\n新的一週不必先擔心撐不撐得住。\n神的應許是：日子如何，力量就如何，剛剛好夠用。\n願您這週一天一天地經歷夠用的恩典。"},
 {v:"應當一無罣慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。",r:"腓立比書 4:6",
  w:"{稱呼}平安！\n這一週若有掛心的事，一件一件告訴神就好。\n祂在聽，也在動工。\n願出人意外的平安，保守您的心。"},
 {v:"你要專心仰賴耶和華，不可倚靠自己的聰明。",r:"箴言 3:5",
  w:"{稱呼}平安！\n新的一週，願您做每個決定以前，先仰望主。\n祂會指引，比我們自己想的更周全。\n祝您這週有清楚的引導。"},
 {v:"我的心哪，你要稱頌耶和華！凡在我裡面的，也要稱頌他的聖名！",r:"詩篇 103:1",
  w:"{稱呼}平安！\n一週的開始，先讓心向主歡呼。\n數算恩典的人，日子會過得特別有力量。\n願您這週充滿感恩與讚美。"}]},

{id:"sunday",n:"主日邀請",k:"例行",d:"一同進殿",cards:[
 {v:"人對我說：我們往耶和華的殿去，我就歡喜。",r:"詩篇 122:1",
  w:"{稱呼}平安！\n這個主日，我們一起去神的家好嗎？\n不用準備什麼，人來就好，主要見的是您這個人。\n我在那裡等您。"},
 {v:"你們不可停止聚會，好像那些停止慣了的人，倒要彼此勸勉。",r:"希伯來書 10:25",
  w:"{稱呼}平安！\n信仰不是一個人走的路，是一群人彼此扶持著走。\n這週我們一起聚會，彼此加加油。\n有需要接送，請告訴我。"},
 {v:"在你的院宇住一日，勝似在別處住千日。",r:"詩篇 84:10",
  w:"{稱呼}平安！\n世上再忙，一週留一天給神，心就穩了。\n本週主日誠摯地邀請您一同來敬拜。"},
 {v:"因為無論在哪裡，有兩三個人奉我的名聚會，那裡就有我在他們中間。",r:"馬太福音 18:20",
  w:"{稱呼}平安！\n我們聚會，主就在中間，這是何等寶貴的應許。\n這個主日，來一起經歷祂的同在。\n您的位子，我幫您留著。"},
 {v:"當用詩章、頌詞、靈歌，彼此對說，口唱心和地讚美主。",r:"以弗所書 5:19",
  w:"{稱呼}平安！\n一起唱詩敬拜的時候，心會特別得著安慰。\n這個主日，來和大家一起口唱心和地讚美主。\n很想念與您一同敬拜的時光。"},
 {v:"我們既有這許多的見證人，如同雲彩圍著我們……就當存心忍耐，奔那擺在我們前頭的路程。",r:"希伯來書 12:1",
  w:"{稱呼}平安！\n信仰的路不孤單，有一群同奔的弟兄姊妹。\n這個主日回到我們中間，一起往前跑。\n我們都在等您。"},
 {v:"你們親近神，神就必親近你們。",r:"雅各書 4:8",
  w:"{稱呼}平安！\n親近神的方法很簡單，就從回到祂的家開始。\n這個主日，一起來親近主。\n祂也在等著親近您。"},
 {v:"耶穌說：復活在我，生命也在我。信我的人雖然死了，也必復活。",r:"約翰福音 11:25",
  w:"{稱呼}平安！\n主日我們一起來領受生命的話語。\n世上的話越聽越累，神的話越聽越有力。\n本週來聚會，補充屬天的力量。"},
 {v:"你們要休息，要知道我是神！",r:"詩篇 46:10",
  w:"{稱呼}平安！\n主日就是神給我們安息的禮物。\n忙了一週，來停一停，重新認識這位掌權的神。\n主日見！"},
 {v:"看哪，我站在門外叩門，若有聽見我聲音就開門的，我要進到他那裡去。",r:"啟示錄 3:20",
  w:"{稱呼}平安！\n無論離開多久，主的叩門聲一直都在。\n這個主日，把門打開，回到祂面前。\n我陪您一起回家。"}]},

{id:"festival",n:"節期問候",k:"例行",d:"佳節蒙恩",cards:[
 {v:"我的心哪，你要稱頌耶和華，不可忘記他的一切恩惠！",r:"詩篇 103:2",
  w:"{稱呼}佳節平安！\n節日團圓的時候，最適合一起數算神的恩惠。\n願您與{家人}在歡聚中，也一同感謝那位賜恩的主。"},
 {v:"道成了肉身，住在我們中間，充充滿滿的有恩典有真理。",r:"約翰福音 1:14",
  w:"{稱呼}聖誕蒙福！\n神沒有站在遠處喊我們，祂親自走進我們中間。\n願這份「與我們同在」的愛，今年住進您的家。"},
 {v:"耶和華說：我知道我向你們所懷的意念是賜平安的意念，不是降災禍的意念，要叫你們末後有指望。",r:"耶利米書 29:11",
  w:"{稱呼}新年蒙恩！\n舊的一年無論如何，都已經交在神手中。\n新的一年，神向您所存的是平安的意念。\n願您與{家人}在新的年日滿有盼望。"},
 {v:"在至高之處榮耀歸與神！在地上平安歸與他所喜悅的人！",r:"路加福音 2:14",
  w:"{稱呼}聖誕快樂！\n天使報的第一個信息，就是平安。\n願這聖誕，平安臨到您和{家人}，喜樂充滿您的家。"},
 {v:"你們要以感謝進入他的門，以讚美進入他的院。",r:"詩篇 100:4",
  w:"{稱呼}佳節平安！\n過節最好的方式，就是帶著一顆感恩的心。\n願您與{家人}歡聚，也一同向主獻上感謝。\n節期蒙福！"},
 {v:"神愛世人，甚至將他的獨生子賜給他們，叫一切信他的，不致滅亡，反得永生。",r:"約翰福音 3:16",
  w:"{稱呼}聖誕蒙恩！\n聖誕的核心只有一件事：神愛您。\n這份愛，兩千年前送來，今天仍然為您預備。\n願您這聖誕，被主的愛深深觸摸。"},
 {v:"一年的年歲頭，直到年終，耶和華─你神的眼目時常看顧那地。",r:"申命記 11:12",
  w:"{稱呼}新年平安！\n從年頭到年尾，神的眼目從未離開您。\n新的一年，願您在祂的看顧中，步步蒙恩。\n新年快樂！"},
 {v:"你以恩典為年歲的冠冕；你的路徑都滴下脂油。",r:"詩篇 65:11",
  w:"{稱呼}新年蒙福！\n願新的一年，處處滴下神的恩典。\n無論走到哪裡，都有主的豐盛跟隨您。\n祝您與{家人}新年蒙恩、身體健壯。"},
 {v:"當紀念安息日，守為聖日。",r:"出埃及記 20:8",
  w:"{稱呼}佳節平安！\n節日是休息，也是紀念神恩的時候。\n願您在忙碌之中，也留一點安靜給主。\n祝您佳節愉快、心裡飽足。"},
 {v:"凡我所吩咐你的，你要記念遵行，好叫你和你的子孫永遠得福。",r:"申命記 12:28",
  w:"{稱呼}佳節蒙恩！\n團圓的時刻，是把信仰傳給下一代最好的時機。\n願您的家，代代蒙福、代代事奉主。\n節期平安！"}]},

{id:"sick",n:"疾病軟弱",k:"特別",d:"耶和華是醫治你的",cards:[
 {v:"他病重在榻，耶和華必扶持他；他在病中，你必給他鋪床。",r:"詩篇 41:3",
  w:"{稱呼}平安！\n聽說您身體不適，我心裡掛念。\n病榻上有一位比誰都靠近的主，祂親自為您鋪床。\n您只管好好休息，其餘的交給祂。我會持續為您禱告。"},
 {v:"我的恩典夠你用的，因為我的能力是在人的軟弱上顯得完全。",r:"哥林多後書 12:9",
  w:"{稱呼}平安！\n軟弱的時候不必逞強，也不必自責。\n神沒有說「你要夠強」，祂說「我的恩典夠你用」。\n願您在病中反而更深地經歷祂的能力。"},
 {v:"因為我耶和華是醫治你的。",r:"出埃及記 15:26",
  w:"{稱呼}平安！\n今天為您的身體向主祈求。\n祂的名就叫「醫治你的耶和華」，這是祂的名，也是祂的本性。\n願主的醫治臨到您，一天比一天好起來。"},
 {v:"他被鞭傷，我們得醫治。",r:"以賽亞書 53:5",
  w:"{稱呼}平安！\n主在十字架上，已經為您的軟弱付了代價。\n醫治不是遙遠的盼望，是祂已經成就的恩典。\n願您安心倚靠，等候身體復原。"},
 {v:"我要使你痊癒，醫好你的傷痕。這是耶和華說的。",r:"耶利米書 30:17",
  w:"{稱呼}平安！\n這是神親口的應許，不是人的安慰話。\n身體的傷、心裡的傷，祂都要醫治。\n願您在祂的話語中得著力量與盼望。"},
 {v:"你們中間有病了的呢，他就該請教會的長老來；他們可以奉主的名用油抹他，為他禱告。",r:"雅各書 5:14",
  w:"{稱呼}平安！\n生病的時候不要一個人扛，這是聖經教我們的。\n讓弟兄姊妹一起為您禱告，是神所喜悅的。\n我們都願意陪您走這一段，隨時開口。"},
 {v:"耶和華是我的力量，是我的盾牌；我心裡倚靠他就得幫助。",r:"詩篇 28:7",
  w:"{稱呼}平安！\n身體軟弱的時候，最需要一個可倚靠的。\n主是您的力量，也是您的盾牌。\n願您在病中，心裡有從主而來的踏實與幫助。"},
 {v:"你不要害怕，因為我與你同在……我必堅固你，我必幫助你。",r:"以賽亞書 41:10",
  w:"{稱呼}平安！\n面對病痛難免害怕，這很正常。\n但您不是獨自面對，神說祂與您同在、必堅固您。\n願這句話今天成為您的枕頭，讓您安然。"},
 {v:"我雖然行過死蔭的幽谷，也不怕遭害，因為你與我同在。",r:"詩篇 23:4",
  w:"{稱呼}平安！\n再深的幽谷，都是要「行過」的，不是住下的。\n牧人就在您身邊，一步都不會離開。\n願您在病中經歷祂真實的同在。"},
 {v:"你所遭遇的是人所能受的。神是信實的，必不叫你們受試探過於所能受的。",r:"哥林多前書 10:13",
  w:"{稱呼}平安！\n神量給您的，祂知道您承受得住。\n祂也必在其中開一條出路。\n願您在軟弱中，看見神一路的信實。撐住，我們與您同在。"}]},

{id:"surgery",n:"住院手術",k:"特別",d:"不要害怕，我與你同在",cards:[
 {v:"你不要害怕，因為我與你同在；不要驚惶，因為我是你的神。我必堅固你，我必幫助你；我必用我公義的右手扶持你。",r:"以賽亞書 41:10",
  w:"{稱呼}平安！\n手術前的心情一定不容易，這很正常。\n但請記得，進手術室的時候，有一雙手比醫生的手更穩，會一路扶持您。\n我們全團契都在為您和{家人}禱告。"},
 {v:"我雖然行過死蔭的幽谷，也不怕遭害，因為你與我同在；你的杖，你的竿，都安慰我。",r:"詩篇 23:4",
  w:"{稱呼}平安！\n幽谷是要「行過」的，不是要住下的。\n牧人不會讓羊自己走，祂就在您身邊。\n願您和{家人}都得著從上頭來的平安。"},
 {v:"保護你的必不打盹；保護以色列的，也不打盹也不睡覺。",r:"詩篇 121:3-4",
  w:"{稱呼}平安！\n夜裡睡不著的時候，請記得：有一位整夜不打盹的主守著您。\n您可以放心睡，祂替您醒著。\n願恢復的過程順利平安。"},
 {v:"你將你的事交託耶和華，你所謀的，就必成立。",r:"箴言 16:3",
  w:"{稱呼}平安！\n手術的一切，交在最有智慧、最慈愛的神手中。\n祂會帶領醫生的手，也會看顧您的身體。\n您只管安心，我們替您禱告。"},
 {v:"耶和華必醫治他，在病中，你必給他鋪床。",r:"詩篇 41:3",
  w:"{稱呼}平安！\n病床上有主親自的看顧。\n手術是過程，復原是神的工作。\n願您這一關順利度過，一天比一天好起來。"},
 {v:"我的肉體和我的心腸衰殘；但神是我心裡的力量，又是我的福分，直到永遠。",r:"詩篇 73:26",
  w:"{稱呼}平安！\n身體會軟弱，但神是您心裡不變的力量。\n無論身體如何，祂都是您永遠的福分。\n願您在病中，心裡有主的剛強。"},
 {v:"我將這些事告訴你們，是要叫你們在我裡面有平安。在世上你們有苦難；但你們可以放心，我已經勝了世界。",r:"約翰福音 16:33",
  w:"{稱呼}平安！\n苦難是真的，但主已經得勝，這也是真的。\n願祂的平安，在手術前後一直保守您的心。\n放心，祂已經走在您前面。"},
 {v:"我要安然躺下睡覺，因為獨有你─耶和華使我安然居住。",r:"詩篇 4:8",
  w:"{稱呼}平安！\n手術前的夜晚，願您能安然入睡。\n把明天交給神，今晚安穩地休息。\n是主使您安然居住，不是您自己。祂顧念您。"},
 {v:"應當一無罣慮……神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。",r:"腓立比書 4:6-7",
  w:"{稱呼}平安！\n擔心的事，一件一件告訴神。\n手術順利、麻醉平安、復原快速——都可以交託給祂。\n願出人意外的平安，此刻就臨到您。"},
 {v:"耶和華必保護你，免受一切的災害；他要保護你的性命。",r:"詩篇 121:7",
  w:"{稱呼}平安！\n把您的性命交在保護者的手中。\n這場手術，有神親自看守。\n我們在外面為您守望，等您平安出來。願主與您同在。"}]},

{id:"grief",n:"喪親安慰",k:"特別",d:"與哀哭的人同哭",cards:[
 {v:"神要擦去他們一切的眼淚；不再有死亡，也不再有悲哀、哭號、疼痛，因為以前的事都過去了。",r:"啟示錄 21:4",
  w:"{稱呼}，我心裡與您同悲。\n不急著說道理，也不急著堅強，該哭就哭。\n只是願您知道，有一天神要親手擦去這些眼淚，那一天是真的。\n這段日子，我會陪著您。"},
 {v:"論到睡了的人，我們不願意弟兄們不知道，恐怕你們憂傷，像那些沒有指望的人一樣。",r:"帖撒羅尼迦前書 4:13",
  w:"{稱呼}平安。\n我們的憂傷是真的，但我們的憂傷裡有指望。\n在主裡的離別，不是永別，是先走一步。\n願主的安慰，在最安靜的時刻臨到您。"},
 {v:"耶和華靠近傷心的人，拯救靈性痛悔的人。",r:"詩篇 34:18",
  w:"{稱呼}，這些日子辛苦了。\n您可能覺得神很遠，其實聖經說，祂在您最傷心的時候靠得最近。\n不必勉強自己好起來，慢慢來，我們都在。"},
 {v:"哀慟的人有福了！因為他們必得安慰。",r:"馬太福音 5:4",
  w:"{稱呼}，願主親自安慰您。\n主沒有叫我們不許哀慟，祂應許哀慟的人「必得安慰」。\n眼淚不是軟弱，是愛的痕跡。\n讓神在您流淚的時候，把安慰帶來。"},
 {v:"流淚撒種的，必歡呼收割！",r:"詩篇 126:5",
  w:"{稱呼}平安。\n此刻是流淚的季節，這很不容易。\n但神應許，這些眼淚不會白流，將來必有歡呼。\n願您在悲傷中，仍然抓住這個盼望。"},
 {v:"我必不撇下你們為孤兒，我必到你們這裡來。",r:"約翰福音 14:18",
  w:"{稱呼}，最深的失落，是覺得被留下、被丟下。\n但主應許：祂必不撇下您。\n祂會親自來，補您心裡那個空缺。\n這段路，您並不孤單。"},
 {v:"我的心哪，你為何憂悶？……應當仰望神，因我還要稱讚他。",r:"詩篇 42:11",
  w:"{稱呼}平安。\n悲傷的時候，連禱告都沒有力氣，這很正常。\n就試著像詩人一樣，對自己的心輕輕說一句：仰望神。\n慢慢來，主在等您，也在托著您。"},
 {v:"至於我，我知道我的救贖主活著。",r:"約伯記 19:25",
  w:"{稱呼}，在最痛的時刻，還能抓住的，就是這一句。\n我們所信的主活著，祂勝過了死亡。\n有一天必有重逢，這不是安慰的話，是真實的盼望。\n我陪您一起等那一天。"},
 {v:"你們心裡不要憂愁；你們信神，也當信我。在我父的家裡有許多住處。",r:"約翰福音 14:1-2",
  w:"{稱呼}平安。\n所愛的人，是搬到了父家更美的住處。\n那裡沒有眼淚，沒有疼痛，有主親自的迎接。\n願這個確據，在您最想念的時候給您安慰。"},
 {v:"我留下平安給你們……你們心裡不要憂愁，也不要膽怯。",r:"約翰福音 14:27",
  w:"{稱呼}，願主的平安臨到您。\n這份平安，不是要您假裝沒事，是在破碎中仍然托住您。\n您不需要一個人撐，我們都在您身邊。\n主的平安與您同在。"}]},

{id:"down",n:"憂鬱灰心",k:"特別",d:"應當仰望神",cards:[
 {v:"我的心哪，你為何憂悶？為何在我裡面煩躁？應當仰望神，因我還要稱讚他。他是我臉上的光榮，是我的神。",r:"詩篇 42:11",
  w:"{稱呼}平安。\n連寫詩篇的人都有憂悶的時候，您不孤單，也不是信心不夠。\n他做的事，是對自己的心說話：「應當仰望神。」\n今天不必馬上好起來，先抬一下頭就好。"},
 {v:"但那等候耶和華的必從新得力。他們必如鷹展翅上騰；他們奔跑卻不困倦，行走卻不疲乏。",r:"以賽亞書 40:31",
  w:"{稱呼}平安。\n沒力氣的時候，神給的方法不是「再撐一下」，是「等候」。\n鷹不是拼命拍翅膀才飛得高，是順著風。\n願您安靜等候，重新得力。"},
 {v:"一宿雖然有哭泣，早晨便必歡呼。",r:"詩篇 30:5",
  w:"{稱呼}平安。\n黑夜再長，也長不過神的早晨。\n今天若很難，就只過今天，不必連明天的重擔一起扛。\n我在為您禱告，也隨時可以聽您說。"},
 {v:"耶和華靠近傷心的人，拯救靈性痛悔的人。",r:"詩篇 34:18",
  w:"{稱呼}平安。\n心裡最沉的時候，覺得神好遠。\n但真相是：祂靠得最近。\n您不需要先好起來才配得神的靠近，祂此刻就在您身邊。"},
 {v:"你們要將一切的憂慮卸給神，因為他顧念你們。",r:"彼得前書 5:7",
  w:"{稱呼}平安。\n心裡的重擔，不必自己扛著。\n「卸」這個字，是要真的放下來。\n神顧念您，比您顧念自己還深。願您今天輕省一點。"},
 {v:"神啊，求你為我造清潔的心，使我裡面重新有正直的靈。",r:"詩篇 51:10",
  w:"{稱呼}平安。\n當裡面又亂又暗的時候，可以求神「造」一顆新的心。\n祂做的不是修補，是重新創造。\n願您在祂手中，重新有力量、有盼望。"},
 {v:"神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。",r:"腓立比書 4:7",
  w:"{稱呼}平安。\n有時候心煩到自己都控制不住，這不是您的錯。\n神的平安，是「保守」的力量，會替您守住心。\n願這份平安，此刻悄悄地臨到您。"},
 {v:"壓傷的蘆葦，他不折斷；將殘的燈火，他不吹滅。",r:"以賽亞書 42:3",
  w:"{稱呼}平安。\n您現在也許覺得自己像將殘的燈火。\n但神不會吹滅您，祂會小心地把您扶起來。\n在祂眼中，您依然寶貴。慢慢來，我陪著您。"},
 {v:"你們必曉得真理，真理必叫你們得以自由。",r:"約翰福音 8:32",
  w:"{稱呼}平安。\n心裡的黑暗常會說謊：說您不夠好、說沒有盼望。\n但那些不是真理。真理是——神愛您，且沒有放棄您。\n願真理帶您走出來，得著自由。"},
 {v:"這病不至於死，乃是為神的榮耀。",r:"約翰福音 11:4",
  w:"{稱呼}平安。\n現在這段低谷，不是終點，也不是您的定義。\n神能使它成為將來安慰別人的力量。\n請務必好好照顧自己，需要時找專業的人幫忙。您值得被好好對待。"}]},

{id:"fear",n:"焦慮懼怕",k:"特別",d:"出人意外的平安",cards:[
 {v:"應當一無罣慮，只要凡事藉著禱告、祈求，和感謝，將你們所要的告訴神。神所賜、出人意外的平安必在基督耶穌裡保守你們的心懷意念。",r:"腓立比書 4:6-7",
  w:"{稱呼}平安！\n擔心的事，一件一件說給神聽就好，不必自己在心裡反覆演練。\n祂給的平安，常常在事情還沒解決以前就先來了。\n願這份平安今晚就臨到您。"},
 {v:"你們要將一切的憂慮卸給神，因為他顧念你們。",r:"彼得前書 5:7",
  w:"{稱呼}平安！\n「卸」這個字很傳神——像卸下背上的重擔，是要真的放下來。\n不必背著禱告，禱告完就放下。\n神顧念您，比您顧念自己還多。"},
 {v:"我留下平安給你們；我將我的平安賜給你們。我所賜的，不像世人所賜的。你們心裡不要憂愁，也不要膽怯。",r:"約翰福音 14:27",
  w:"{稱呼}平安！\n世上的平安要條件——事情順了才平安。\n主的平安不一樣，環境還沒變，心可以先安。\n願您今天就領受這份不一樣的平安。"},
 {v:"我尋求耶和華，他就應允我，救我脫離了一切的恐懼。",r:"詩篇 34:4",
  w:"{稱呼}平安！\n恐懼來的時候，不必硬壓它，把它帶到神面前。\n尋求祂的人，祂應許要救我們脫離一切恐懼。\n願您今天經歷這份釋放。"},
 {v:"我幾時懼怕，就倚靠你。",r:"詩篇 56:3",
  w:"{稱呼}平安！\n這句禱告很短，卻很有力。\n不必等到不怕了才倚靠神，是「幾時懼怕，就倚靠」。\n害怕的時候，就把手伸給主。祂會牽住您。"},
 {v:"神賜給我們，不是膽怯的心，乃是剛強、仁愛、謹守的心。",r:"提摩太後書 1:7",
  w:"{稱呼}平安！\n膽怯不是神給您的，那是可以放下的重擔。\n神給您的，是剛強、仁愛、謹守。\n願您今天穿上這顆心，勝過懼怕。"},
 {v:"我將耶和華常擺在我面前，因他在我右邊，我便不致搖動。",r:"詩篇 16:8",
  w:"{稱呼}平安！\n焦慮常是因為眼睛盯著問題。\n試著把神擺在面前——祂就在您右邊，您必不搖動。\n願您今天的目光，回到那穩妥的主身上。"},
 {v:"耶和華是我的亮光，是我的拯救，我還怕誰呢？",r:"詩篇 27:1",
  w:"{稱呼}平安！\n當有主作亮光、作拯救，還有什麼好怕的？\n黑暗最怕光，恐懼最怕神的同在。\n願主的光今天照進您心裡，驅散一切的怕。"},
 {v:"你們心裡不要憂愁，也不要膽怯。",r:"約翰福音 14:27",
  w:"{稱呼}平安！\n這是主親口對門徒說的話，今天也對您說。\n祂知道您在怕什麼，也知道怎麼安您的心。\n願您今晚睡得安穩，明天有力量。"},
 {v:"耶和華必在你前面行；他必與你同在，必不撇下你，也不丟棄你。不要懼怕，也不要驚惶。",r:"申命記 31:8",
  w:"{稱呼}平安！\n您不是在獨自面對前面的未知。\n神走在前面開路，又在旁邊陪伴。\n願您把懼怕交給祂，安心走下一步。祂必不撇下您。"}]},

{id:"money",n:"經濟缺乏",k:"特別",d:"必使一切所需用的都充足",cards:[
 {v:"我的神必照他榮耀的豐富，在基督耶穌裡，使你們一切所需用的都充足。",r:"腓立比書 4:19",
  w:"{稱呼}平安！\n經濟的壓力最磨人，因為它天天提醒您。\n但供應您的不是薪水，是神；祂照的是「祂榮耀的豐富」，不是您戶頭的餘額。\n有具體的需要，請不要客氣告訴我。"},
 {v:"我從前年幼，現在年老，卻未見過義人被棄，也未見過他的後裔討飯。",r:"詩篇 37:25",
  w:"{稱呼}平安！\n這是一位走完一生的人所作的見證：神從來沒有丟下祂的兒女。\n現在的難處是真的，神的信實也是真的。\n我們一起走過這一段。"},
 {v:"你們要先求他的國和他的義，這些東西都要加給你們了。",r:"馬太福音 6:33",
  w:"{稱呼}平安！\n越缺乏的時候，越容易把神擠到後面去。\n但主說的次序沒有改：先求神的國，其餘的祂負責加給。\n願您在這段日子，反而更深地經歷祂的供應。"},
 {v:"你看那天上的飛鳥，也不種，也不收……你們的天父尚且養活牠。你們不比飛鳥貴重得多嗎？",r:"馬太福音 6:26",
  w:"{稱呼}平安！\n連小鳥神都天天餵養，何況是祂寶貝的兒女。\n您在祂眼中，比飛鳥貴重太多了。\n願您在憂心的時候，抬頭看看那位養活萬物的天父。"},
 {v:"耶和華是我的牧者，我必不致缺乏。",r:"詩篇 23:1",
  w:"{稱呼}平安！\n有牧人的羊，不會被丟著不管。\n「必不致缺乏」不是我們的能力，是牧人的承諾。\n願您在缺乏中，經歷那位牧者實在的看顧。"},
 {v:"少有財寶，敬畏耶和華，強如多有財寶，煩亂不安。",r:"箴言 15:16",
  w:"{稱呼}平安！\n手頭緊的日子，容易覺得低人一等，其實不然。\n有主同在的少，勝過沒有主的多。\n願您在難處中，仍然守住這份看不見卻真實的富足。"},
 {v:"人若賺得全世界，賠上自己的生命，有甚麼益處呢？",r:"馬太福音 16:26",
  w:"{稱呼}平安！\n錢很重要，但不是最重要的。\n這段日子雖然辛苦，卻可能讓您看清什麼才是真正的財富。\n願神供應您的需要，也保守您的心不被錢綁住。"},
 {v:"我知道怎樣處卑賤，也知道怎樣處豐富……我靠著那加給我力量的，凡事都能做。",r:"腓立比書 4:12-13",
  w:"{稱呼}平安！\n保羅也有缺乏的時候，但他學會了一個祕訣：靠主。\n環境會起落，那加力量的主不變。\n願您也學會這祕訣，在任何光景都站立得穩。"},
 {v:"當將你的重擔卸給耶和華，他必撫養你。",r:"詩篇 55:22",
  w:"{稱呼}平安！\n這個重擔，不必您一個人扛。\n卸給神，祂應許要撫養您。\n若有實際的需要，請告訴我，弟兄姊妹一家人，本該互相扶持。"},
 {v:"耶和華以勒（意思是：耶和華必預備）。",r:"創世記 22:14",
  w:"{稱呼}平安！\n亞伯拉罕在最走投無路的時候，經歷神的預備。\n「耶和華以勒」——神必預備，這是祂的名。\n願您在山窮水盡處，看見祂親自開的路。"}]},

{id:"work",n:"職場壓力",k:"特別",d:"像是給主做的",cards:[
 {v:"無論做甚麼，都要從心裡做，像是給主做的，不是給人做的。",r:"歌羅西書 3:23",
  w:"{稱呼}平安！\n工作最累的往往不是事情，是人的眼光與評價。\n若換一個對象——做給主看——心就輕省很多。\n願您在職場上作光作鹽，也保守自己的心。"},
 {v:"凡勞苦擔重擔的人可以到我這裡來，我就使你們得安息。",r:"馬太福音 11:28",
  w:"{稱呼}平安！\n主沒有說「你去把重擔放下」，祂說「你到我這裡來」。\n安息不是事情變少，是人到了主面前。\n這週請務必留一點時間給自己、給神。"},
 {v:"你所做的，要交託耶和華，你所謀的，就必成立。",r:"箴言 16:3",
  w:"{稱呼}平安！\n計畫可以做，但結果交給神。\n把手上的專案一件一件交託出去，您會發現肩膀鬆了。\n為您的工作與同事關係禱告。"},
 {v:"你手若有行善的力量，不可推辭，就當向那應得的人施行。",r:"箴言 3:27",
  w:"{稱呼}平安！\n職場也是禾場，您的認真與善良，別人都看在眼裡。\n不必大聲宣揚信仰，好好做事、善待人，就是見證。\n願神使用您，成為職場裡的一道光。"},
 {v:"殷勤不可懶惰。要心裡火熱，常常服事主。",r:"羅馬書 12:11",
  w:"{稱呼}平安！\n把每天的工作，當作服事主的一部分。\n這樣再平凡的事，都有了永恆的意義。\n願您在崗位上，既盡責又不失喜樂。"},
 {v:"他們必坐在自己葡萄樹下和無花果樹下，無人驚嚇。",r:"彌迦書 4:4",
  w:"{稱呼}平安！\n願您的職場，成為一個可以安穩的地方。\n就算外面有競爭有壓力，神能給您內心的安定。\n把驚嚇交給主，安然坐在祂為您預備的位置上。"},
 {v:"我們曉得萬事都互相效力，叫愛神的人得益處。",r:"羅馬書 8:28",
  w:"{稱呼}平安！\n職場上有些事看不懂、也不公平。\n但神能讓萬事——包括委屈與挫折——都效力於您的益處。\n願您在難處中，仍然信靠這位掌權的主。"},
 {v:"耶和華所賜的福使人富足，並不加上憂慮。",r:"箴言 10:22",
  w:"{稱呼}平安！\n世上的成功常常伴著焦慮，神所賜的福不是。\n願您追求的，是有神同在的那種富足與平安。\n工作是為了生活，不是被生活追著跑。保重身體。"},
 {v:"你當剛強壯膽……因為耶和華─你的神必與你同在。",r:"約書亞記 1:9",
  w:"{稱呼}平安！\n面對難搞的案子或難相處的人，需要勇氣。\n這勇氣不必自己擠出來，是因為神與您同在。\n願您帶著這份底氣，走進每一天的挑戰。"},
 {v:"應當一無罣慮……將你們所要的告訴神。",r:"腓立比書 4:6",
  w:"{稱呼}平安！\n下班之後，把工作留在辦公室，把煩惱交給神。\n您不必二十四小時待命，神在替您守夜。\n願您今晚能真正休息，明天再有力量。"}]},

{id:"job",n:"失業轉職",k:"特別",d:"我必在曠野開道路",cards:[
 {v:"當將你的事交託耶和華，並倚靠他，他就必成全。",r:"詩篇 37:5",
  w:"{稱呼}平安！\n這段等候的日子最不容易，因為看不見下一步。\n但交託不是放棄，是把主導權交回給那位看得見全局的主。\n我為您的下一份工作禱告，也留意合適的機會。"},
 {v:"看哪，我要做一件新事；如今要發現，你們豈不知道嗎？我必在曠野開道路，在沙漠開江河。",r:"以賽亞書 43:19",
  w:"{稱呼}平安！\n神開路的地方，常常是我們看起來最沒有路的曠野。\n這段空白不是浪費，是祂在做新事。\n願您很快看見那條路。"},
 {v:"我們曉得萬事都互相效力，叫愛神的人得益處。",r:"羅馬書 8:28",
  w:"{稱呼}平安！\n現在這一步看起來像退，將來會發現是轉。\n神不浪費任何一段經歷，包括這一段。\n有任何需要，請隨時告訴我。"},
 {v:"耶和華必在你前面行……不要懼怕，也不要驚惶。",r:"申命記 31:8",
  w:"{稱呼}平安！\n面對前途未定，難免焦慮，這很正常。\n但神走在前面，路是祂開的，不是您一個人找的。\n願您把焦慮交給祂，踏實地走每一步。"},
 {v:"你要休息，要知道我是神。",r:"詩篇 46:10",
  w:"{稱呼}平安！\n這段沒有工作的日子，也可以是一段安靜親近神的日子。\n不必急著證明什麼，先讓心安下來。\n神的時間到了，門就會開。您的價值，不由工作決定。"},
 {v:"因為出於神的話，沒有一句不帶能力的。",r:"路加福音 1:37",
  w:"{稱呼}平安！\n人看是難處，在神沒有難成的事。\n祂為您預備的，可能超過您現在能想像的。\n願您在等候中，仍然抱著盼望，因為祂的話帶著能力。"},
 {v:"你手所辦的一切事都要盡力去做。",r:"傳道書 9:10",
  w:"{稱呼}平安！\n投履歷、面試、學新技能——把每一步都盡力做好。\n盡人事，然後把結果交託給神。\n願神使您手所辦的蒙福，開出合適的門。"},
 {v:"我知道我向你們所懷的意念是賜平安的意念……要叫你們末後有指望。",r:"耶利米書 29:11",
  w:"{稱呼}平安！\n現在也許看不清方向，但神的計畫從未改變。\n祂向您所懷的，是平安、是盼望。\n願您在轉換的季節，抓住祂為您預備的美好未來。"},
 {v:"我靠著那加給我力量的，凡事都能做。",r:"腓立比書 4:13",
  w:"{稱呼}平安！\n重新開始需要力氣，而這力氣是主加的。\n不是您夠強，是那位加力量的主夠強。\n願您在新的起點，靠著祂站立得穩、勇敢向前。"},
 {v:"耶和華─你的神在你手裡所辦的一切事上必賜福與你。",r:"申命記 15:10",
  w:"{稱呼}平安！\n願神在您新的工作、新的機會上賜福。\n這段等候，將來回頭看，會看見都是恩典。\n我持續為您禱告，也一起留意好的機會。"}]},

{id:"couple",n:"夫妻關係",k:"特別",d:"謙卑帶動謙卑",cards:[
 {v:"凡事不可結黨，不可貪圖虛浮的榮耀；只要存心謙卑，各人看別人比自己強。",r:"腓立比書 2:3",
  w:"{稱呼}平安。\n夫妻之間的僵局，多半不是誰對誰錯，是兩個人都想贏。\n有一方先謙卑下來，局就活了。\n願主先軟化您的心，再軟化對方的心。"},
 {v:"並要以恩慈相待，存憐憫的心，彼此饒恕，正如神在基督裡饒恕了你們一樣。",r:"以弗所書 4:32",
  w:"{稱呼}平安。\n饒恕不是說「你沒有錯」，是說「我不再讓這件事綁住我們」。\n主怎麼饒恕我們，我們就怎麼饒恕枕邊人。\n我為您和{配偶}的關係禱告。"},
 {v:"回答柔和，使怒消退；言語暴戾，觸動怒氣。",r:"箴言 15:1",
  w:"{稱呼}平安。\n很多時候不是內容有問題，是語氣。\n下一次要開口以前，先在心裡對主說一句話，再對他說一句話。\n願您的家充滿柔和的言語。"},
 {v:"愛是恆久忍耐，又有恩慈；愛是不嫉妒……不輕易發怒，不計算人的惡。",r:"哥林多前書 13:4-5",
  w:"{稱呼}平安。\n「不計算人的惡」是婚姻裡最難、也最需要的一句。\n願您學會把舊帳交給神，不再翻出來。\n愛，是選擇一次又一次地重新開始。"},
 {v:"二人成為一體。既然如此，夫妻不再是兩個人，乃是一體的了。",r:"馬太福音 19:6",
  w:"{稱呼}平安。\n吵架的時候容易把對方當敵人，其實你們是一體。\n傷了對方，也是傷了自己。\n願神提醒你們：你們是同一隊的，一起面對問題，不是互相對抗。"},
 {v:"若是能行，總要盡力與眾人和睦。",r:"羅馬書 12:18",
  w:"{稱呼}平安。\n「盡力」——和睦不會自己發生，是需要努力的。\n先做那個願意先跨一步的人，不吃虧。\n願您在婚姻裡，成為帶來和睦的那一位。"},
 {v:"我心裡柔和謙卑，你們當負我的軛，學我的樣式。",r:"馬太福音 11:29",
  w:"{稱呼}平安。\n柔和謙卑，是主自己的樣式，也是婚姻的解藥。\n驕傲讓兩個人越走越遠，謙卑讓兩顆心越靠越近。\n願您向主學這功課，家就有出路。"},
 {v:"用和平彼此聯絡，竭力保守聖靈所賜合而為一的心。",r:"以弗所書 4:3",
  w:"{稱呼}平安。\n合一不是自然來的，是要「竭力保守」的。\n這需要兩個人都不放棄。\n願您和{配偶}都願意為這個家再努力，主必幫助你們。"},
 {v:"愛裡沒有懼怕；愛既完全，就把懼怕除去。",r:"約翰一書 4:18",
  w:"{稱呼}平安。\n很多爭執底下，其實藏著怕——怕不被愛、怕被否定。\n願主完全的愛，先充滿您，讓您有安全感去愛對方。\n先被主愛夠了，才有力氣去愛人。"},
 {v:"耶和華必成全關乎我的事。",r:"詩篇 138:8",
  w:"{稱呼}平安。\n有些婚姻的難處，靠自己實在解不開。\n但神能成全，祂能改變人，也能修復關係。\n不要放棄，把這段關係交在祂手中，繼續禱告等候。"}]},

{id:"child",n:"親子教養",k:"特別",d:"兒女是耶和華的產業",cards:[
 {v:"教養孩童，使他走當行的道，就是到老他也不偏離。",r:"箴言 22:6",
  w:"{稱呼}平安！\n孩子現在的樣子，不是最後的樣子。\n您撒下的每一顆種子，神都記得，時候到了會長出來。\n願您在教養上有智慧，也有安息。"},
 {v:"你們作父親的，不要惹兒女的氣，只要照著主的教訓和警戒養育他們。",r:"以弗所書 6:4",
  w:"{稱呼}平安！\n管教與傷害之間，只隔著一個情緒。\n願主保守您在最生氣的那一刻，仍記得孩子是神託付的產業。\n我為您和{家人}禱告。"},
 {v:"兒女是耶和華所賜的產業；所懷的胎是他所給的賞賜。",r:"詩篇 127:3",
  w:"{稱呼}平安！\n孩子是「賞賜」，不是「任務」。\n累的時候，求主讓您重新用喜悅的眼光看他們。\n願您的家有笑聲，也有主的同在。"},
 {v:"要以恩慈相待，存憐憫的心，彼此饒恕。",r:"以弗所書 4:32",
  w:"{稱呼}平安！\n孩子會犯錯，我們也會。\n家最寶貴的，不是沒有錯，是有饒恕與重新開始。\n願恩慈成為您家中的空氣，讓孩子在其中安心長大。"},
 {v:"這些話……也要殷勤教訓你的兒女。無論你坐在家裡，行在路上，躺下，起來，都要談論。",r:"申命記 6:6-7",
  w:"{稱呼}平安！\n信仰的傳承，不在正式的說教，在生活的點滴。\n孩子看您怎麼活，比聽您怎麼說更深。\n願您的日常，就是給孩子最好的信仰課。"},
 {v:"你們雖然不好，尚且知道拿好東西給兒女，何況你們在天上的父，豈不更把好東西給求他的人嗎？",r:"馬太福音 7:11",
  w:"{稱呼}平安！\n您這麼愛孩子，天父愛您更深。\n把孩子交在這位比您更會疼他們的天父手中吧。\n願您在教養的重擔中，先領受天父的愛。"},
 {v:"愛是恆久忍耐，又有恩慈。",r:"哥林多前書 13:4",
  w:"{稱呼}平安！\n教養最需要的，就是這句話裡的「忍耐」。\n孩子的成長沒有捷徑，需要一次又一次的等待。\n願主加給您夠用的忍耐與恩慈。您做得很好了。"},
 {v:"少年人哪，你在幼年時當快樂……卻要知道，為這一切的事，神必審問你。",r:"傳道書 11:9",
  w:"{稱呼}平安！\n讓孩子快樂長大，也帶他認識那位掌管一生的神。\n這兩件事並不衝突。\n願您的孩子，既有無憂的童年，也有敬畏神的心。"},
 {v:"我沒有比這個更大的喜樂，就是聽見我的兒女們按真理而行。",r:"約翰三書 1:4",
  w:"{稱呼}平安！\n做父母最深的盼望，不過如此。\n願您的兒女，將來走在真理中，成為您的喜樂與冠冕。\n您現在的付出，都在為那一天鋪路。"},
 {v:"我與我家必定事奉耶和華。",r:"約書亞記 24:15",
  w:"{稱呼}平安！\n您為孩子能做的最好的事，就是立定這個心志。\n一個事奉神的家，是給孩子最穩的根。\n願您的家世代蒙福，兒女都認識主。"}]},

{id:"exam",n:"考試升學",k:"特別",d:"剛強壯膽",cards:[
 {v:"你當剛強壯膽！不要懼怕，也不要驚惶；因為你無論往哪裡去，耶和華─你的神必與你同在。",r:"約書亞記 1:9",
  w:"{稱呼}加油！\n該讀的都讀了，剩下的交給神。\n進考場的時候，記得您不是一個人進去的。\n我和團契的弟兄姊妹都在為您禱告。"},
 {v:"你要專心仰賴耶和華，不可倚靠自己的聰明，在你一切所行的事上都要認定他，他必指引你的路。",r:"箴言 3:5-6",
  w:"{稱呼}平安！\n選擇比努力更需要智慧，而智慧從神來。\n把志願、把前途都攤在主面前，祂會指引。\n願您有清楚的引導與平安的心。"},
 {v:"這四個少年人，神在各樣文字學問上賜給他們聰明知識。",r:"但以理書 1:17",
  w:"{稱呼}加油！\n但以理他們在異鄉讀書，神親自加添聰明智慧。\n這位神今天一樣為您預備。\n願您考試順利、身體健壯、心裡平安。"},
 {v:"敬畏耶和華是智慧的開端。",r:"箴言 9:10",
  w:"{稱呼}平安！\n真正的聰明，從敬畏神開始。\n把神放在第一位的人，祂也顧念他一切的事。\n願您在讀書與考試中，先尋求神，其餘的祂負責。"},
 {v:"若有缺少智慧的，應當求那厚賜與眾人、也不斥責人的神，主就必賜給他。",r:"雅各書 1:5",
  w:"{稱呼}平安！\n讀不懂、記不住的時候，就開口求神。\n祂厚賜智慧，不會嫌您問得多。\n願您在需要的時候，領受從上頭來的清明與力量。"},
 {v:"凡事都不可虧欠人，唯有彼此相愛。",r:"羅馬書 13:8",
  w:"{稱呼}加油！\n無論結果如何，願您守住誠實與正直。\n用對的方法得來的，才走得穩、睡得安。\n神看重的是您的品格，勝過您的分數。"},
 {v:"我靠著那加給我力量的，凡事都能做。",r:"腓立比書 4:13",
  w:"{稱呼}加油！\n熬夜、壓力、緊張——這些日子不容易。\n但您不是靠自己撐，是靠那加力量的主。\n願您有體力、有專注、有平安，好好應戰。"},
 {v:"應當一無罣慮……將你們所要的告訴神。",r:"腓立比書 4:6",
  w:"{稱呼}平安！\n考前的焦慮，一句一句告訴神就好。\n把成績交託出去，反而能專心把該做的做好。\n願出人意外的平安，在考場中保守您的心。"},
 {v:"耶和華賜智慧；知識和聰明都由他口而出。",r:"箴言 2:6",
  w:"{稱呼}加油！\n所有的知識，源頭都在神。\n讀書時求祂賜下領悟，考試時求祂賜下想起。\n願您平時的努力，在關鍵時刻都被神喚醒。"},
 {v:"你將你的事交託耶和華，你所謀的，就必成立。",r:"箴言 16:3",
  w:"{稱呼}加油！\n您的升學、您的未來，交在最好的手中。\n盡力預備，然後安心交託。\n願神為您開最合適的門，帶您走最蒙福的路。"}]},

{id:"baby",n:"新生兒滿月",k:"特別",d:"受造奇妙可畏",cards:[
 {v:"我的肺腑是你所造的；我在母腹中，你已覆庇我。我要稱謝你，因我受造，奇妙可畏。",r:"詩篇 139:13-14",
  w:"恭喜{稱呼}！新生命臨到您的家，真是大喜的事。\n這個小小的人，是神親手做的工。\n願主保守媽媽的身體，也保守寶寶平安長大。"},
 {v:"我祈求為要得這孩子；耶和華已將我所求的賜給我了。",r:"撒母耳記上 1:27",
  w:"恭喜{稱呼}！\n禱告求來的孩子，也要一生歸給主。\n願這孩子從小認識神，成為家族的祝福。\n我們一同為他祝福禱告。"},
 {v:"你兒女圍繞你的桌子，好像橄欖栽子。",r:"詩篇 128:3",
  w:"恭喜{稱呼}與{配偶}！\n願您的家如同一棵結實纍纍的橄欖樹，兒女圍繞、滿有喜樂。\n照顧新生兒很辛苦，記得也要照顧自己，需要幫忙請開口。"},
 {v:"耶穌說：讓小孩子到我這裡來，不要禁止他們，因為在神國的正是這樣的人。",r:"路加福音 18:16",
  w:"恭喜{稱呼}！\n這孩子的一生，願都在主的懷抱裡。\n從滿月就把他抱到主面前，是給他最好的開始。\n願主看顧他成長的每一步。"},
 {v:"看哪，兒女是耶和華所賜的產業。",r:"詩篇 127:3",
  w:"恭喜{稱呼}添了新成員！\n孩子是神給的產業，不是我們的所有物。\n願您帶著感恩與敬畏，養育這份從天而來的賞賜。\n祝寶寶健康、全家平安。"},
 {v:"孩子漸漸長大，強健起來，充滿智慧，又有神的恩在他身上。",r:"路加福音 2:40",
  w:"恭喜{稱呼}！\n這是聖經描述主耶穌小時候的樣子。\n願您的寶寶也這樣長大——強健、有智慧、神的恩常在他身上。\n為這個新生命獻上滿滿祝福。"},
 {v:"一宿雖然有哭泣，早晨便必歡呼。",r:"詩篇 30:5",
  w:"恭喜{稱呼}！\n新手爸媽的夜晚不好過，這句話送給您。\n熬過這一段，回頭都是甜的。\n願主加添您體力，也讓寶寶好眠、好帶。您辛苦了。"},
 {v:"耶和華賜福給你，保護你。",r:"民數記 6:24",
  w:"恭喜{稱呼}滿月之喜！\n把最古老的祝福，送給這個最新的生命。\n願神從今賜福給寶寶，一生保護他。\n祝全家喜樂、寶寶平安長大。"},
 {v:"婦人焦急的時候就不再記念那苦楚，因為歡喜世上生了一個人。",r:"約翰福音 16:21",
  w:"恭喜{稱呼}！\n懷胎的辛苦、生產的痛，如今都化成懷中的喜樂。\n這份喜樂，是神所賜的。\n願您在照顧寶寶的日子裡，天天被這喜樂托住。"},
 {v:"因為在神沒有一件不能的事。",r:"路加福音 1:37",
  w:"恭喜{稱呼}迎接新生命！\n每個孩子的誕生，都是神創造大能的見證。\n願這孩子的一生，也成為神作為的舞台。\n祝寶寶健康、爸媽有智慧、全家蒙恩。"}]},

{id:"move",n:"遷居新職",k:"特別",d:"你出你入，耶和華保護你",cards:[
 {v:"你出你入，耶和華要保護你，從今時直到永遠。",r:"詩篇 121:8",
  w:"{稱呼}平安！\n恭喜有新的開始。\n無論搬到哪裡，神的保護不會留在舊地址。\n願您很快安頓下來，也在新環境找到屬靈的家。"},
 {v:"至於我和我家，我們必定事奉耶和華。",r:"約書亞記 24:15",
  w:"恭喜{稱呼}喬遷之喜！\n願這個新家最重要的擺設，是主的同在。\n願您與{家人}在此蒙福、蒙保守，成為鄰舍的祝福。"},
 {v:"耶和華必在你前面行；他必與你同在，必不撇下你，也不丟棄你。不要懼怕，也不要驚惶。",r:"申命記 31:8",
  w:"{稱呼}平安！\n新的環境總會有些忐忑，這很正常。\n但神不是在後面推您，是在前面替您開路。\n為您的新階段獻上祝福的禱告。"},
 {v:"若不是耶和華建造房屋，建造的人就枉然勞力。",r:"詩篇 127:1",
  w:"恭喜{稱呼}！\n新家要有神來建造，才會真正穩固。\n願您把這個家的根基，立在主的身上。\n祝您安居樂業、闔家平安。"},
 {v:"你要以耶和華為樂，他就將你心裡所求的賜給你。",r:"詩篇 37:4",
  w:"{稱呼}平安！\n新工作、新環境，願您帶著喜樂踏進去。\n以神為樂的人，走到哪裡都不缺喜樂。\n祝您在新崗位上蒙福、有好的同事與際遇。"},
 {v:"我要領你進迦南地……使你們得那地為業。",r:"出埃及記 6:8 意譯",
  w:"恭喜{稱呼}！\n每一次的搬遷與轉換，都是神帶您進入新的預備之地。\n願這個新地方，成為神為您預備的祝福之地。\n祝您安頓順利、萬事亨通。"},
 {v:"耶和華，我的力量啊，我愛你！耶和華是我的巖石，我的山寨，我的救主。",r:"詩篇 18:1-2",
  w:"{稱呼}平安！\n環境會變，房子會換，但神是永不改變的山寨。\n願您無論搬到哪、換什麼工作，都以祂為最穩的倚靠。\n祝您新階段一切順利。"},
 {v:"這是我們列祖所應許之地……你們要進去得那地為業。",r:"民數記 意譯",
  w:"恭喜{稱呼}的新開始！\n往前走總是需要一點勇氣，因為未知。\n但神應許：祂會與您同去。\n願您帶著信心，在新的地方看見祂的預備。"},
 {v:"你的日子如何，你的力量也必如何。",r:"申命記 33:25",
  w:"{稱呼}平安！\n新工作要適應、要學習，難免疲累。\n神應許：日子如何，力量就如何。\n願您一天一天地經歷夠用的恩典，慢慢站穩腳步。"},
 {v:"你們要靠著主，倚賴他的大能大力作剛強的人。",r:"以弗所書 6:10",
  w:"{稱呼}平安！\n新環境的挑戰，靠主的大能就能面對。\n不必自己一個人硬撐。\n願您在新的地方，靠著主剛強站立，開創美好的新篇章。"}]},

{id:"return",n:"久未聚會",k:"特別",d:"父親跑去抱他",cards:[
 {v:"相離還遠，他父親看見，就動了慈心，跑去抱著他的頸項，連連與他親嘴。",r:"路加福音 15:20",
  w:"{稱呼}平安！\n好一陣子沒見到您了，心裡很掛念。\n沒有要責備的意思，只是想讓您知道——這裡的門一直開著。\n什麼時候回來都好，我們很想您。"},
 {v:"我曾提你的名召你，你是屬我的。",r:"以賽亞書 43:1",
  w:"{稱呼}平安！\n無論離開多久、走得多遠，神稱呼您的方式沒有變過。\n祂記得您的名字。\n有什麼難處或委屈，隨時可以跟我說。"},
 {v:"他使我的靈魂甦醒，為自己的名引導我走義路。",r:"詩篇 23:3",
  w:"{稱呼}平安！\n羊走遠了，牧人不會放棄，會去找。\n如果這陣子心裡疲乏、對信仰冷淡，那也不是世界末日。\n我陪您慢慢走回來。"},
 {v:"我實在告訴你們，一個罪人悔改，在神的使者面前也是這樣為他歡喜。",r:"路加福音 15:10",
  w:"{稱呼}平安！\n您一回頭，天上就歡喜。\n神從來不是在門口等著算帳，是等著擁抱。\n不管過了多久，回家永遠不嫌晚。我們都在。"},
 {v:"我總不撇下你，也不丟棄你。",r:"希伯來書 13:5",
  w:"{稱呼}平安！\n就算這段日子您覺得離神很遠，神從未離開您。\n祂的應許是：總不撇下、總不丟棄。\n想到您，就為您禱告。有機會，回來坐坐。"},
 {v:"你們要嘗嘗主恩的滋味，便知道他是美善。",r:"詩篇 34:8",
  w:"{稱呼}平安！\n還記得剛信主時，那份單純的喜樂嗎？\n那份恩典的滋味，隨時都能再嚐。\n什麼時候想回來，我陪您一起，重新親近主。"},
 {v:"耶和華靠近傷心的人。",r:"詩篇 34:18",
  w:"{稱呼}平安！\n有時候人會離開聚會，是因為心裡受了傷。\n如果是這樣，我很抱歉，也很想聽您說。\n神靠近傷心的人，我也願意陪在您身邊。"},
 {v:"看哪，我站在門外叩門。",r:"啟示錄 3:20",
  w:"{稱呼}平安！\n這麼久沒聯絡，還是很想念您。\n主的叩門聲一直都在，我的關心也在。\n不必有壓力，就是單純想跟您問聲好。"},
 {v:"我的羊聽我的聲音，我也認識他們，他們也跟著我。",r:"約翰福音 10:27",
  w:"{稱呼}平安！\n您是牧人認得的那隻羊，這身分不會因為久沒聚會而改變。\n祂的聲音，您心裡其實還聽得見。\n想您了，盼望能再相聚。"},
 {v:"耶和華是有憐憫，有恩典的神，不輕易發怒，且有豐盛的慈愛。",r:"詩篇 103:8",
  w:"{稱呼}平安！\n回到神面前，不會被責備，只會被慈愛迎接。\n這位神，滿有憐憫與恩典。\n無論如何，您在我們心中一直有位置。歡迎回家。"}]},

{id:"repent",n:"罪疚悔改",k:"特別",d:"必要赦免我們的罪",cards:[
 {v:"我們若認自己的罪，神是信實的，是公義的，必要赦免我們的罪，洗淨我們一切的不義。",r:"約翰一書 1:9",
  w:"{稱呼}平安。\n認罪不是為了讓神消氣，是為了讓自己重新自由。\n祂的赦免不是勉強的，是「必要」的——因為祂信實。\n過去的已經過去，抬起頭來。"},
 {v:"神啊，求你為我造清潔的心，使我裡面重新有正直的靈。",r:"詩篇 51:10",
  w:"{稱呼}平安。\n大衛跌得那麼重，仍然求神「造」一顆新的心。\n神做的不是修補，是重造。\n願您在主面前得著新的心、新的力量。"},
 {v:"你們的罪雖像硃紅，必變成雪白；雖紅如丹顏，必白如羊毛。",r:"以賽亞書 1:18",
  w:"{稱呼}平安。\n有些過犯，我們自己饒不了自己。\n但神說得很清楚：硃紅可以變雪白。\n祂已經處理完的事，不要再拿出來懲罰自己。"},
 {v:"東離西有多遠，他叫我們的過犯離我們也有多遠。",r:"詩篇 103:12",
  w:"{稱呼}平安。\n神赦免的時候，是把罪丟到再也找不回來的地方。\n您卻常常自己把它撿回來重看，別再這樣了。\n神都放下了，您也可以放下。"},
 {v:"如今，那些在基督耶穌裡的就不定罪了。",r:"羅馬書 8:1",
  w:"{稱呼}平安。\n在基督裡，定罪的聲音已經沒有權柄了。\n那些控告您、讓您抬不起頭的話，不是出於神。\n願您領受這份不再被定罪的自由。"},
 {v:"憂傷痛悔的心，神必不輕看。",r:"詩篇 51:17",
  w:"{稱呼}平安。\n您願意在神面前痛悔，這本身就蒙祂悅納。\n神不輕看一顆願意回轉的心。\n過去無法改變，但從今天起，可以重新開始。"},
 {v:"主耶和華─以色列的聖者曾如此說：你們得救在乎歸回安息；你們得力在乎平靜安穩。",r:"以賽亞書 30:15",
  w:"{稱呼}平安。\n不必用更多的努力去贖回過去。\n神說的是「歸回、安息」——回到祂面前，安息在祂的赦免裡。\n願您放下自責，重新在祂裡面得力。"},
 {v:"他必轉回憐恤我們，將我們的罪孽踏在腳下，又將我們的一切罪投於深海。",r:"彌迦書 7:19",
  w:"{稱呼}平安。\n神把我們的罪投進深海，不是淺灘。\n那是撈不回來的深度。\n祂要的不是您一直懊悔，是您重新自由地愛祂、跟隨祂。"},
 {v:"耶穌就對她說：我也不定你的罪。去吧，從此不要再犯罪了。",r:"約翰福音 8:11",
  w:"{稱呼}平安。\n主對那個被眾人指責的人，說的是這句話。\n祂也對您說：我不定你的罪。\n領受這份恩典，然後帶著新的力量，往前走。"},
 {v:"因為主所愛的，他必管教……凡管教的事，後來卻為那經練過的人結出平安的果子。",r:"希伯來書 12:6,11",
  w:"{稱呼}平安。\n神管教，是因為愛，不是要毀掉您。\n這段經歷雖然痛，卻要為您結出平安的果子。\n願您在其中被塑造，成為更貼近祂的人。"}]},

{id:"serve",n:"服事疲乏",k:"特別",d:"行善不可喪志",cards:[
 {v:"我們行善，不可喪志，若不灰心，到了時候就要收成。",r:"加拉太書 6:9",
  w:"{稱呼}平安！\n您默默做的那些事，人不一定看見，主全都記得。\n收成有時候會遲，但不會不來。\n請務必也讓自己休息，別把自己燒乾了。"},
 {v:"疲乏的，他賜能力；軟弱的，他加力量。",r:"以賽亞書 40:29",
  w:"{稱呼}平安！\n服事久了會累，這不是屬靈出問題，是人本來就有限。\n來到主面前補充，不是軟弱，是智慧。\n願主親自加添您力量。"},
 {v:"你們務要堅固，不可搖動，常常竭力多做主工；因為知道，你們的勞苦在主裡面不是徒然的。",r:"哥林多前書 15:58",
  w:"{稱呼}平安！\n謝謝您這段時間的擺上。\n在主裡的勞苦，沒有一分是白費的。\n願您在服事中重新得著喜樂。"},
 {v:"你們來，同我暗暗地到曠野地方去歇一歇。",r:"馬可福音 6:31",
  w:"{稱呼}平安！\n這是主親自對忙碌的門徒說的話。\n祂看重您這個人，勝過您完成的工。\n先歇一歇，是被主允許、甚至被主邀請的。好好休息。"},
 {v:"這一切都是這位聖靈所運行、隨己意分給各人的。",r:"哥林多前書 12:11",
  w:"{稱呼}平安！\n服事的果效，是聖靈做成的，不是您一個人扛的。\n不必把全部的重量都放在自己肩上。\n願您學會與神同工，而不是替神工作。"},
 {v:"擔子是輕省的。",r:"馬太福音 11:30",
  w:"{稱呼}平安！\n如果服事讓您喘不過氣，也許有些不屬於您的擔子，該放下了。\n主的軛是容易的，擔子是輕省的。\n願您回到與主同負一軛的輕省裡。"},
 {v:"求你使我們早早飽得你的慈愛，好叫我們一生一世歡呼喜樂。",r:"詩篇 90:14",
  w:"{稱呼}平安！\n服事會枯乾，是因為給出去的多、領受的少。\n願您每天先飽得主的慈愛，再去服事別人。\n先被主愛滿，服事才有源源不絕的喜樂。"},
 {v:"仰望為我們信心創始成終的耶穌。",r:"希伯來書 12:2",
  w:"{稱呼}平安！\n服事久了，容易把眼睛放在果效、放在人身上，就累了。\n把焦點移回耶穌，力量就回來了。\n願您在疲乏中，重新單單仰望祂。"},
 {v:"當將你的重擔卸給耶和華，他必撫養你。",r:"詩篇 55:22",
  w:"{稱呼}平安！\n服事的重擔，也可以卸給主。\n祂不只用您做工，更要親自撫養您。\n願您在給予中，也記得回來被神餵養。"},
 {v:"那美好的仗我已經打過了，當跑的路我已經跑盡了，所信的道我已經守住了。",r:"提摩太後書 4:7",
  w:"{稱呼}平安！\n有一天，這句話也會是您的見證。\n現在的每一步擺上，都在寫這個結局。\n願您跑得穩、跑得久，也跑得喜樂。謝謝您的忠心。"}]},

{id:"elder",n:"年長孤單",k:"特別",d:"直到髮白，我仍懷抱",cards:[
 {v:"直到你們年老，我仍這樣；直到你們髮白，我仍懷搋。我已造作，也必保抱；我必懷抱，也必拯救。",r:"以賽亞書 46:4",
  w:"{稱呼}平安！\n年紀漸長，身邊的人少了，但有一位從您年輕抱到現在，還要繼續抱著您。\n您在神眼中，一天也沒有變得不重要。\n我會常常來看您。"},
 {v:"我年老的時候，求你不要丟棄我！我力氣衰弱的時候，求你不要離棄我！",r:"詩篇 71:9",
  w:"{稱呼}平安！\n這句禱告，神從來沒有拒絕過。\n身體會衰弱，神的看顧不會。\n今天特別想到您，為您的身體與心情禱告。"},
 {v:"他們年老的時候仍要結果子，要滿了汁漿而常發青。",r:"詩篇 92:14",
  w:"{稱呼}平安！\n神從來沒有讓人退休。\n您這些年走過的路、禱告的膝蓋，就是最寶貴的果子。\n願您老年的日子滿有滋潤與喜樂。"},
 {v:"白髮是榮耀的冠冕，在公義的道上必能得著。",r:"箴言 16:31",
  w:"{稱呼}平安！\n您的白髮，是走過歲月、忠心跟主的印記，是尊貴的冠冕。\n年長不是被淘汰，是被神加冠。\n願您帶著這份尊榮，安享每一天。"},
 {v:"我的心哪，你要稱頌耶和華！不可忘記他的一切恩惠。",r:"詩篇 103:2",
  w:"{稱呼}平安！\n一個人的時候，就數算神的恩惠吧。\n這一生走來，處處都是祂的手。\n願回憶不是孤單，而是與主一同回顧的甜美時光。"},
 {v:"我的肉體和我的心腸衰殘；但神是我心裡的力量，又是我的福分，直到永遠。",r:"詩篇 73:26",
  w:"{稱呼}平安！\n身體會衰退，這是每個人都要面對的。\n但神是您心裡永不衰退的力量與福分。\n願您在身體的軟弱中，經歷心裡被主充滿的剛強。"},
 {v:"你們要休息，要知道我是神。",r:"詩篇 46:10",
  w:"{稱呼}平安！\n忙了大半輩子，現在是安息的季節。\n不必再證明什麼，好好享受與主同在的安靜。\n願您的晚年，充滿平安與從容。"},
 {v:"耶和華靠近凡求告他的，就是誠心求告他的一切人。",r:"詩篇 145:18",
  w:"{稱呼}平安！\n就算一個人在家，您從不孤單。\n只要開口禱告，神就在您身邊，比誰都近。\n願您的家，因著祂的同在，成為最溫暖的地方。"},
 {v:"求你叫我早晨得聽你慈愛之言，因我倚靠你。",r:"詩篇 143:8",
  w:"{稱呼}平安！\n願您每天早晨睜開眼，第一個想到的就是主的慈愛。\n新的一天，有主陪伴，就不孤單。\n我也常常記念您，願您日日蒙恩。"},
 {v:"我留下平安給你們……你們心裡不要憂愁，也不要膽怯。",r:"約翰福音 14:27",
  w:"{稱呼}平安！\n年紀大了，難免會擔心這、擔心那。\n把這些都交給主，祂留下的平安夠您用。\n願您安穩度日，不憂愁、不膽怯。有需要，我隨時來。"}]},

{id:"travel",n:"遠行差傳",k:"特別",d:"直到地極作見證",cards:[
 {v:"耶和華要保護你，免受一切的災害；他要保護你的性命。你出你入，耶和華要保護你，從今時直到永遠。",r:"詩篇 121:7-8",
  w:"{稱呼}一路平安！\n願主的天使在您前面開路，保守您出入平安。\n我們在家為您守望，等您平安回來。"},
 {v:"我就常與你們同在，直到世界的末了。",r:"馬太福音 28:20",
  w:"{稱呼}平安！\n您去的地方再遠，主的同在都先到了。\n願您這趟行程有力量、有果效、有平安。\n我們持續為您禱告。"},
 {v:"但聖靈降臨在你們身上，你們就必得著能力……直到地極，作我的見證。",r:"使徒行傳 1:8",
  w:"{稱呼}平安！\n差派您的是主，供應您的也是主。\n願聖靈的能力與您同行，所到之處都留下基督的香氣。"},
 {v:"你或向左或向右，你必聽見後邊有聲音說：這是正路，要行在其間。",r:"以賽亞書 30:21",
  w:"{稱呼}平安！\n在陌生的地方，方向感容易亂。\n但有主在後引導，您不會迷路。\n願您這趟旅程，每一步都行在祂的引導中。"},
 {v:"你們要去，使萬民作我的門徒。",r:"馬太福音 28:19",
  w:"{稱呼}平安！\n這是主給每個門徒的大使命，如今您正走在其中。\n您的腳蹤，何等佳美。\n願神使用這趟差傳，成為別人生命的祝福。"},
 {v:"因他要為你吩咐他的使者，在你行的一切道路上保護你。",r:"詩篇 91:11",
  w:"{稱呼}一路平安！\n神已經為您差派使者，一路護送。\n無論交通、天氣、身體，都有祂看顧。\n願您平安去、平安回，滿載恩典而歸。"},
 {v:"你們要休息，要知道我是神。",r:"詩篇 46:10",
  w:"{稱呼}平安！\n出遠門也記得留點時間安息，別把行程排太滿。\n在異地與神獨處，常有意外的恩典。\n願您這趟旅程，身心都得著滋潤。"},
 {v:"我靠著那加給我力量的，凡事都能做。",r:"腓立比書 4:13",
  w:"{稱呼}平安！\n長途的舟車勞頓、水土不服，都不容易。\n願那加力量的主，托住您的身體與精神。\n祝您行程順利、事奉有力、平安歸來。"},
 {v:"你所行的路，靠主必蒙引導。",r:"箴言 3:6 意譯",
  w:"{稱呼}一路平安！\n把行程、把安全、把一切未知，都交在主手中。\n祂會引導您所行的每一條路。\n我們在後方為您禱告，等候您的好消息。"},
 {v:"願賜平安的神親自使你們全然成聖。",r:"帖撒羅尼迦前書 5:23",
  w:"{稱呼}平安！\n願賜平安的神，親自與您同行這段路。\n無論走多遠，祂的平安都不會離開您。\n祝您旅途蒙恩、身心平安、滿有主的同在。"}]},

{id:"thanks",n:"感恩慶賀",k:"特別",d:"耶和華為我們行了大事",cards:[
 {v:"凡事謝恩，因為這是神在基督耶穌裡向你們所定的旨意。",r:"帖撒羅尼迦前書 5:18",
  w:"{稱呼}恭喜！\n聽到這個好消息，真為您高興。\n記得在歡喜的時候，也把榮耀歸給那位成就的神。\n願喜樂加倍、恩典加倍！"},
 {v:"耶和華果然為我們行了大事，我們就歡喜。",r:"詩篇 126:3",
  w:"{稱呼}恭喜！\n這是神為您行的大事，值得好好慶祝。\n願您和{家人}一同歡喜，也一同數算恩典。"},
 {v:"各樣美善的恩賜和各樣全備的賞賜都是從上頭來的，從眾光之父那裡降下來的。",r:"雅各書 1:17",
  w:"{稱呼}恭喜！\n每一件好事的背後，都有一位默默預備的天父。\n為您獻上感謝與祝福，願恩典繼續。"},
 {v:"我的心哪，你要稱頌耶和華，不可忘記他的一切恩惠！",r:"詩篇 103:2",
  w:"{稱呼}恭喜！\n在最開心的時刻，一起來數算神的恩惠。\n祂的恩典，值得我們一遍又一遍地紀念。\n願您的喜樂，成為讚美神的理由。"},
 {v:"你要稱謝耶和華，因他本為善；他的慈愛永遠長存！",r:"詩篇 118:1",
  w:"{稱呼}恭喜！\n好事臨到，最自然的回應就是感謝。\n神本為善，祂的慈愛永遠長存。\n願您帶著感恩的心，享受這份喜樂。同賀！"},
 {v:"你所做的一切事上都要認定他，他必指引你的路。",r:"箴言 3:6",
  w:"{稱呼}恭喜！\n這份成果，是您的努力，也是神的帶領。\n願您在歡慶之餘，繼續把每一步都交給祂。\n祝福您，未來的路更加蒙恩。"},
 {v:"當向耶和華唱新歌！因為他行過奇妙的事。",r:"詩篇 98:1",
  w:"{稱呼}恭喜！\n這樣的好消息，值得為神唱一首新歌。\n祂在您身上行了奇妙的事。\n願您的感恩化成讚美，喜樂化成見證。同喜同賀！"},
 {v:"神能照著運行在我們心裡的大力，充充足足地成就一切，超過我們所求所想的。",r:"以弗所書 3:20",
  w:"{稱呼}恭喜！\n神成就的，往往超過我們敢求敢想的。\n這份喜事，就是祂豐盛的證明。\n願您繼續經歷這位超乎所求所想的神。恭喜您！"},
 {v:"你要以耶和華為樂，他就將你心裡所求的賜給你。",r:"詩篇 37:4",
  w:"{稱呼}恭喜！\n您心裡所求的，神垂聽了、也成就了。\n願您在喜樂中，更深地愛這位聽禱告的主。\n同賀您的喜事，願恩上加恩！"},
 {v:"這都是耶和華所做的，在我們眼中看為希奇。",r:"詩篇 118:23",
  w:"{稱呼}恭喜！\n回頭看，會發現這一切都太奇妙，是神親手做的。\n願您把這份榮耀單單歸給祂。\n真心為您高興，恭喜恭喜！"}]},

{id:"newborn",n:"信主受洗",k:"特別",d:"舊事已過都變成新的",cards:[
 {v:"若有人在基督裡，他就是新造的人，舊事已過，都變成新的了。",r:"哥林多後書 5:17",
  w:"恭喜{稱呼}！\n今天是您屬靈的生日，天上正在歡喜。\n舊的都過去了，從今天起，您有一個全新的身分。\n我會陪您一起走這條路。"},
 {v:"所以，我們藉著洗禮歸入死，和他一同埋葬，原是叫我們一舉一動有新生的樣式。",r:"羅馬書 6:4",
  w:"恭喜{稱呼}受洗歸入主名！\n下水是與主同死，出水是與主同活。\n願您從今以後，一舉一動都有新生的樣式。"},
 {v:"我已經與基督同釘十字架，現在活著的不再是我，乃是基督在我裡面活著。",r:"加拉太書 2:20",
  w:"恭喜{稱呼}！\n信主不是多了一個宗教，是換了一位作主的。\n願您天天經歷「不再是我，乃是基督」的自由。\n歡迎加入神的家！"},
 {v:"從此凡接待他的，就是信他名的人，他就賜他們權柄作神的兒女。",r:"約翰福音 1:12",
  w:"恭喜{稱呼}！\n從今天起，您有一個新身分——神的兒女。\n這是全世界最尊貴的身分。\n願您常常記得：您是被天父深愛的孩子。"},
 {v:"看哪，父賜給我們是何等的慈愛，使我們得稱為神的兒女。",r:"約翰一書 3:1",
  w:"恭喜{稱呼}！\n您受洗，不是因為您夠好，是因為神的愛夠深。\n這份慈愛，從今以後一生跟隨您。\n歡迎回到父的家，我們是一家人了！"},
 {v:"我來了，是要叫人得生命，並且得的更豐盛。",r:"約翰福音 10:10",
  w:"恭喜{稱呼}！\n跟隨主，不是變得很多規矩，是得著更豐盛的生命。\n願您這一生，越來越嚐到與主同行的甘甜。\n為您的新生命歡喜快樂！"},
 {v:"你們要嘗嘗主恩的滋味，便知道他是美善。",r:"詩篇 34:8",
  w:"恭喜{稱呼}受洗！\n接下來的信仰路，就是一步一步嚐主恩的過程。\n願您親自經歷祂的真實與美善。\n有任何問題，隨時來找我，我陪您一起成長。"},
 {v:"那靠著主剛強壯膽的，主必顧念他。",r:"詩篇 意譯",
  w:"恭喜{稱呼}！\n新的信仰旅程，有時會遇到不明白、不容易。\n但主必顧念您、扶持您，不會讓您獨自面對。\n願您在主裡剛強，一天比一天更認識祂。"},
 {v:"你們立志行事都是神在你們心裡運行，為要成就他的美意。",r:"腓立比書 2:13",
  w:"恭喜{稱呼}！\n您能來到主面前受洗，本身就是神在您心裡動的工。\n不是您找到神，是神先尋見了您。\n願祂繼續在您裡面動工，成就祂在您身上的美意。"},
 {v:"耶和華必成全關乎我的事。",r:"詩篇 138:8",
  w:"恭喜{稱呼}受洗歸主！\n從今天開始的這條路，神必負責帶您走到底。\n您只管跟隨，祂必成全。\n真心恭喜您，歡迎成為神家中的一員！"}]}
];

  w:"Peace to you, {稱呼}.\nNights can feel very long, but a night is still a night — it is not forever.\nGod has not left the room, even when you cannot feel him.\nMay morning come, and may joy come with it."},
 {v:"He gives power to the weak. He increases the strength of him who has no might.",r:"Isaiah 40:29",
  w:"{稱呼}, no need to explain yourself to me.\nYou have been strong for a long time; it's all right to be empty for a while.\nGod does not ask the weary to try harder — he gives them strength.\nI'm praying for you today."}]},

{id:"fear",n:"Anxiety and Fear",k:"Special",d:"The peace that surpasses understanding",cards:[
 {v:"In nothing be anxious, but in everything, by prayer and petition with thanksgiving, let your requests be made known to God.",r:"Philippians 4:6",
  w:"Peace to you, {稱呼}.\nAnxiety usually means we are carrying tomorrow on top of today.\nYou may hand it over — not once, but as many times as it comes back.\nMay his peace stand guard over your heart tonight."},
 {v:"For God didn't give us a spirit of fear, but of power, love, and self-control.",r:"2 Timothy 1:7",
  w:"{稱呼}, thinking of you.\nFear tells a loud story, but it is not the true one.\nWhat God has put in you is strength, love and a steady mind.\nMay you sleep well and wake lighter."},
 {v:"Cast all your worries on him, because he cares for you.",r:"1 Peter 5:7",
  w:"Peace to you, {稱呼}.\nYou are allowed to put it down. He is not too busy, and you are not too much.\nHe cares for you — not for your performance, for you.\nI'll be praying with you."}]},

{id:"money",n:"Financial Need",k:"Special",d:"He will supply every need",cards:[
 {v:"My God will supply every need of yours according to his riches in glory in Christ Jesus.",r:"Philippians 4:19",
  w:"{稱呼}, I've been praying about your situation.\nGod's supply is measured by his riches, not by our shortfall.\nHe has never once been late, though he is often later than we would like.\nMay you see his provision, and soon."},
 {v:"Therefore don't be anxious for tomorrow, for tomorrow will be anxious for itself.",r:"Matthew 6:34",
  w:"Peace to you, {稱呼}.\nOne day's trouble is enough for one day; you do not have to solve next month tonight.\nThe One who feeds the birds knows your name and your numbers.\nMay he open a way ahead of you."},
 {v:"The LORD is my shepherd; I shall lack nothing.",r:"Psalm 23:1",
  w:"{稱呼}, thinking of you.\nA shepherd's job is to see that the sheep lacks nothing — that responsibility is his, not yours.\nHold on; do not be ashamed to let others walk with you.\nMay the Lord provide, and provide generously."}]},

{id:"work",n:"Pressure at Work",k:"Special",d:"As working for the Lord",cards:[
 {v:"Whatever you do, work heartily, as for the Lord, and not for men.",r:"Colossians 3:23",
  w:"Peace to you, {稱呼}.\nWhen the recognition doesn't come, it helps to remember who you are really working for.\nThe Lord sees the effort nobody else counted.\nMay he give you strength and clear-headedness this week."},
 {v:"Come to me, all you who labor and are heavily burdened, and I will give you rest.",r:"Matthew 11:28",
  w:"{稱呼}, I hear work has been heavy.\nYou are a person before you are a role — please don't forget to rest.\nBring the tiredness to him; he is not asking you to be endless.\nPraying for you today."},
 {v:"Commit your deeds to the LORD, and your plans shall succeed.",r:"Proverbs 16:3",
  w:"Peace to you, {稱呼}.\nDo your part faithfully, and let God carry the outcomes.\nWhat you cannot control was never yours to carry.\nMay he settle your heart and steady your steps."}]},

{id:"job",n:"Job Loss and Transition",k:"Special",d:"I will make a way in the wilderness",cards:[
 {v:"Behold, I will do a new thing. I will even make a way in the wilderness.",r:"Isaiah 43:19",
  w:"{稱呼}, I've been praying for you in this season.\nA closed door is hard, and it is not the same thing as an ending.\nGod makes roads in places where no road has ever been.\nMay the next door open at exactly the right time."},
 {v:"I know the thoughts that I think toward you, thoughts of peace, and not of evil, to give you hope and a future.",r:"Jeremiah 29:11",
  w:"Peace to you, {稱呼}.\nWaiting is uncomfortable, but it is not wasted; God is at work where you cannot see.\nYour worth was never attached to a job title.\nMay he lead you clearly and provide along the way."},
 {v:"The steps of a man are established by the LORD.",r:"Psalm 37:23",
  w:"{稱呼}, thinking of you.\nYou may not see the whole road, but the next step is enough.\nHe has been ordering your steps all along, including this one.\nI'm praying, and please let me know how it goes."}]},

{id:"couple",n:"Marriage",k:"Special",d:"Humility draws out humility",cards:[
 {v:"Doing nothing through rivalry or through conceit, but in humility, each counting others better than himself.",r:"Philippians 2:3",
  w:"Peace to you, {稱呼}.\nIn marriage, pride answering pride leaves two people wounded; humility answering humility leaves two people home.\nThe one who yields first is not the loser — he or she is the one who ends the war.\nMay God give you both a soft heart this week."},
 {v:"Be kind to one another, tenderhearted, forgiving each other, just as God also in Christ forgave you.",r:"Ephesians 4:32",
  w:"{稱呼}, praying for your home.\nWe forgive not because the other has earned it, but because we ourselves have been forgiven so much.\nOne kind sentence today can undo a long silence.\nMay the Lord restore what has been strained."},
 {v:"Above all things be earnest in your love among yourselves, for love covers a multitude of sins.",r:"1 Peter 4:8",
  w:"Peace to you, {稱呼}.\nBeing right matters far less than staying close.\nDon't let a small thing cost you a great relationship.\nMay love cover much, and may your home be at peace."}]},

{id:"child",n:"Parenting",k:"Special",d:"Children are a heritage from the LORD",cards:[
 {v:"Behold, children are a heritage of the LORD. The fruit of the womb is his reward.",r:"Psalm 127:3",
  w:"Peace to you, {稱呼}.\nChildren are entrusted to us, not owned by us — which means we may hand the worry back to the Owner.\nYou are doing better than you think.\nMay God give you wisdom and a steady, patient heart."},
 {v:"Train up a child in the way he should go, and when he is old he will not depart from it.",r:"Proverbs 22:6",
  w:"{稱呼}, thinking of you and your family.\nWhat children absorb is rarely the lecture; it is the life they watch.\nSeeds planted now may take years to show — keep planting.\nMay the Lord keep your children in his hand."},
 {v:"Fathers, don't provoke your children to wrath, but nurture them in the discipline and instruction of the Lord.",r:"Ephesians 6:4",
  w:"Peace to you, {稱呼}.\nWinning an argument with a child usually costs more than it gains.\nRelationship first, and correction after — that order changes everything.\nPraying for grace and patience over your home."}]},

{id:"exam",n:"Exams and Study",k:"Special",d:"Be strong and courageous",cards:[
 {v:"Be strong and courageous. Don't be afraid, neither be dismayed; for the LORD your God is with you wherever you go.",r:"Joshua 1:9",
  w:"{稱呼}, praying for you as the exams come.\nDo the work you can do, and let God take care of what you cannot.\nA score is a number; it is not a verdict on who you are.\nMay you be calm, clear and rested."},
 {v:"Commit your way to the LORD. Trust also in him, and he will do this.",r:"Psalm 37:5",
  w:"Peace to you, {稱呼}.\nPrepare with all your heart, then hand the result over with open hands.\nGod knows the road he is preparing for you.\nMay you sleep well the night before and think clearly the day of."},
 {v:"I can do all things through Christ, who strengthens me.",r:"Philippians 4:13",
  w:"{稱呼}, cheering you on!\nStrength for this is not something you have to manufacture — it is supplied.\nGo in, do your best, and leave the rest with him.\nWe're praying for you."}]},

{id:"baby",n:"New Baby",k:"Special",d:"Fearfully and wonderfully made",cards:[
 {v:"I will give thanks to you, for I am fearfully and wonderfully made.",r:"Psalm 139:14",
  w:"Congratulations, {稱呼}!\nA new life has arrived, and every part of this little one was knit together by God himself.\nMay your home be full of the good kind of noise.\nRest when you can — and welcome to the sweetest exhaustion there is."},
 {v:"Behold, children are a heritage of the LORD.",r:"Psalm 127:3",
  w:"Congratulations, {稱呼}!\nWhat a gift has been entrusted to you.\nMay this child grow up strong, healthy, and knowing whose he is.\nWe rejoice with you and pray for you."},
 {v:"The LORD bless you, and keep you.",r:"Numbers 6:24",
  w:"Congratulations, {稱呼}!\nThis is the oldest and warmest blessing there is, and today it is for your family.\nMay God bless and keep this little one, and keep the two of you as well.\nSo glad for your good news."}]},

{id:"move",n:"Moving or a New Post",k:"Special",d:"The LORD will keep your going out and coming in",cards:[
 {v:"The LORD will keep your going out and your coming in, from this time forward, and forever more.",r:"Psalm 121:8",
  w:"Congratulations on the move, {稱呼}!\nAddresses change; the One who keeps you does not.\nMay this new place become a home quickly, and a blessing to the neighbours.\nWishing you a smooth settling in."},
 {v:"As for me and my house, we will serve the LORD.",r:"Joshua 24:15",
  w:"Blessings on your new home, {稱呼}!\nA house is walls; a home is who reigns inside it.\nMay the Lord be honoured at your table and in your rooms.\nPraying for peace and joy in this new season."},
 {v:"Unless the LORD builds the house, they who build it labor in vain.",r:"Psalm 127:1",
  w:"Congratulations, {稱呼}!\nMay this new beginning be built by his hand and not by anxious effort.\nAll the best with the new work and the new routines.\nWe'll be praying as you settle."}]},

{id:"return",n:"Long Absence from Fellowship",k:"Special",d:"His father ran and embraced him",cards:[
 {v:"But while he was still far off, his father saw him, and was moved with compassion, and ran, and fell on his neck, and kissed him.",r:"Luke 15:20",
  w:"{稱呼}, it has been a while, and I've been thinking of you.\nThere is no lecture waiting here — only a door that was never locked.\nThe Father was watching the road long before you thought about coming back.\nWhenever you're ready, we would love to see you."},
 {v:"Come to me, all you who labor and are heavily burdened, and I will give you rest.",r:"Matthew 11:28",
  w:"Peace to you, {稱呼}.\nI'm not writing to ask where you've been; I'm writing because you are missed.\nIf life has been hard, that is exactly the reason to come, not to stay away.\nCome as you are — that's the only way any of us come."},
 {v:"He restores my soul.",r:"Psalm 23:3",
  w:"{稱呼}, just thinking of you today.\nNo need to explain anything; the shepherd's work is restoring, not scolding.\nWhenever you want to talk, I'm here.\nMay the Lord meet you right where you are."}]},

{id:"repent",n:"Guilt and Repentance",k:"Special",d:"He is faithful to forgive",cards:[
 {v:"If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness.",r:"1 John 1:9",
  w:"{稱呼}, please hear this gently.\nForgiveness does not wait for you to feel worthy — it waits only for honesty.\nHe is faithful, and the cleansing is complete, not partial.\nDon't stay in the shadows; come home."},
 {v:"There is therefore now no condemnation to those who are in Christ Jesus.",r:"Romans 8:1",
  w:"Peace to you, {稱呼}.\nConviction draws us toward God; condemnation drives us away — learn to tell the two apart.\nWhat Christ has settled, no accusing voice can reopen.\nMay you rest in what he has already finished."},
 {v:"Create in me a clean heart, O God. Renew a right spirit within me.",r:"Psalm 51:10",
  w:"{稱呼}, praying for you.\nDavid did not begin by fixing himself; he asked God to make the heart new.\nThat prayer has never been refused.\nMay you walk out of this lighter than you came in."}]},

{id:"serve",n:"Weary in Serving",k:"Special",d:"Do not grow weary in doing good",cards:[
 {v:"Let's not be weary in doing good, for we will reap in due season, if we don't give up.",r:"Galatians 6:9",
  w:"{稱呼}, thank you for all you carry.\nMuch of what you do is unseen — but not unseen by him.\nDon't measure the harvest by today; the season has not turned yet.\nRest properly, and keep going."},
 {v:"Come away by yourselves to a deserted place, and rest awhile.",r:"Mark 6:31",
  w:"Peace to you, {稱呼}.\nEven Jesus called his workers away to rest — so rest is not a failure of devotion.\nA servant who is empty cannot pour.\nPlease take the break; the ministry will still be there."},
 {v:"Those who wait for the LORD will renew their strength. They will mount up with wings like eagles.",r:"Isaiah 40:31",
  w:"{稱呼}, I've been praying for you.\nStrength that comes from waiting lasts longer than strength squeezed out of ourselves.\nLet him refill you before you serve again.\nThank you for your faithfulness."}]},

{id:"elder",n:"Loneliness in Later Years",k:"Special",d:"Even to your old age I will carry you",cards:[
 {v:"Even to old age I am he, and even to gray hairs I will carry you. I have made, and I will bear. Yes, I will carry, and will deliver.",r:"Isaiah 46:4",
  w:"Peace to you, {稱呼}.\nThe God who carried you as a child is carrying you still — that has not changed with the years.\nYour life has blessed more people than you know.\nMay your days be peaceful and your heart be warm."},
 {v:"They will still produce fruit in old age. They will be full of sap and green.",r:"Psalm 92:14",
  w:"{稱呼}, thinking of you today.\nUsefulness to God does not retire; some of the best fruit comes late.\nYour prayers are doing more work than you realise.\nMay the Lord keep you strong and well."},
 {v:"I have been young, and now am old, yet I have not seen the righteous forsaken.",r:"Psalm 37:25",
  w:"Peace to you, {稱呼}.\nYou have walked with him a long time, and he has never once let go.\nQuiet days are not empty days when he is in them.\nPlease call whenever you'd like company — I would be glad to visit."}]},

{id:"travel",n:"Travel and Mission",k:"Special",d:"Witnesses to the ends of the earth",cards:[
 {v:"You will be witnesses to me... to the uttermost parts of the earth.",r:"Acts 1:8",
  w:"Safe travels, {稱呼}!\nWherever your feet land, you are carrying something worth more than luggage.\nMay God open doors and prepare hearts ahead of you.\nWe'll be praying the whole time you're away."},
 {v:"The LORD will keep your going out and your coming in.",r:"Psalm 121:8",
  w:"Blessings as you go, {稱呼}!\nHe watches both ends of the journey, not only the departure.\nMay you be kept safe, and may you come home with good stories.\nTravel well."},
 {v:"Go into all the world, and preach the Good News to the whole creation.",r:"Mark 16:15",
  w:"{稱呼}, we're sending you off with prayer.\nYou go not as a visitor but as one who is sent.\nMay the Lord give you strength, health and the right words.\nWe'll be holding you up until you return."}]},

{id:"thanks",n:"Thanksgiving and Celebration",k:"Special",d:"The LORD has done great things for us",cards:[
 {v:"The LORD has done great things for us, and we are glad.",r:"Psalm 126:3",
  w:"Congratulations, {稱呼}!\nWhat a joy to see this — and how clearly God's hand is in it.\nMay every bit of the glory go back to him.\nRejoicing with you today!"},
 {v:"Give thanks to the LORD, for he is good, for his loving kindness endures forever.",r:"Psalm 107:1",
  w:"Congratulations, {稱呼}!\nGood news is worth stopping for, and worth thanking him for.\nMay this joy spill over onto everyone around you.\nSo happy for you."},
 {v:"Every good gift and every perfect gift is from above.",r:"James 1:17",
  w:"Congratulations, {稱呼}!\nEverything good that has come to you came down from the Father's hand.\nMay you keep walking humbly and joyfully with him.\nCelebrating with you!"}]},

{id:"newborn",n:"New Believer and Baptism",k:"Special",d:"The old things have passed away",cards:[
 {v:"Therefore if anyone is in Christ, he is a new creation. The old things have passed away. Behold, all things have become new.",r:"2 Corinthians 5:17",
  w:"Congratulations, {稱呼}!\nToday is not a ceremony but a birthday — the beginning of an entirely new life.\nWhatever the past held, it no longer has the final say.\nWelcome to the family; we are so glad you're here."},
 {v:"I came that they may have life, and may have it abundantly.",r:"John 10:10",
  w:"Congratulations, {稱呼}!\nFollowing Jesus is not the adding of rules but the receiving of life.\nMay you taste more of his goodness with every year.\nRejoicing over your new life today!"},
 {v:"Oh taste and see that the LORD is good.",r:"Psalm 34:8",
  w:"Congratulations on your baptism, {稱呼}!\nThe road ahead is simply one long tasting of his goodness.\nAsk me anything at any time — you don't walk this alone.\nSo glad to walk it with you."}]}
];

/* ---- English cards 4–10 · batch 1: routine occasions ---- */
var EN_MORE_1={
birth:[
 {v:"The LORD bless you, and keep you.",r:"Numbers 6:24",
  w:"Happy birthday, {稱呼}!\nThis is the oldest and warmest blessing there is, and today it belongs to you.\nMay God bless you this year and guard every step you take.\nWe are so glad to have you among us."},
 {v:"Your years will not fail. You shall be kept all your days.",r:"Psalm 102:27; 121:7",
  w:"Blessings on your birthday, {稱呼}!\nGrowing older is not wearing out — it is being kept by God through one more stretch of the road.\nMay your body be strong and your heart at rest.\nHappy birthday!"},
 {v:"Also delight yourself in the LORD, and he will give you the desires of your heart.",r:"Psalm 37:4",
  w:"Happy birthday, {稱呼}!\nMay your deepest satisfaction this year be found in nothing less than the Lord himself.\nThose who delight in him never go hungry.\nWishing you a year overflowing with joy."},
 {v:"This is the day that the LORD has made. We will rejoice and be glad in it!",r:"Psalm 118:24",
  w:"Happy birthday, {稱呼}!\nToday was appointed for you, and it is worth celebrating properly.\nThank God for bringing you into this world, and into our lives.\nMay you be surrounded by love today."},
 {v:"One thing I have asked of the LORD, that I will seek after: that I may dwell in the house of the LORD all the days of my life.",r:"Psalm 27:4",
  w:"Blessings on your birthday, {稱呼}!\nMay the one thing you want most this year be nearness to him.\nYear after year walking with God is the most blessed life there is.\nHappy birthday — may his beauty stay before your eyes."},
 {v:"Oh taste and see that the LORD is good. Blessed is the man who takes refuge in him.",r:"Psalm 34:8",
  w:"Happy birthday, {稱呼}!\nEvery bit of grace you tasted last year was real.\nMay you keep tasting his goodness in the year ahead.\nBlessed is the one who takes refuge in him — and that is you."},
 {v:"He who began a good work in you will complete it until the day of Jesus Christ.",r:"Philippians 1:6",
  w:"Happy birthday, {稱呼}!\nGod has not finished what he started in you, and he does not leave work half done.\nWhatever is still unfinished, he will see it through.\nMay this new year carry that good work further."}],

anniv:[
 {v:"Bearing with one another in love, being eager to keep the unity of the Spirit in the bond of peace.",r:"Ephesians 4:2-3",
  w:"Happy anniversary, {稱呼}!\nStaying together is not the absence of friction but the presence of patience.\nEvery time you bore with each other, you were building something durable.\nMay this year be gentler still."},
 {v:"Two are better than one, because they have a good reward for their labor.",r:"Ecclesiastes 4:9",
  w:"Congratulations, {稱呼}!\nWhat you have carried together would have been far heavier carried alone.\nThank God for giving each of you the other.\nWishing you many more years side by side."},
 {v:"Many waters can't quench love, neither can floods drown it.",r:"Song of Solomon 8:7",
  w:"Happy anniversary, {稱呼}!\nYour love has been through weather, and it is still standing.\nThat is not luck; that is grace and faithfulness together.\nMay it deepen with every passing year."},
 {v:"Husbands, love your wives, even as Christ also loved the assembly and gave himself up for her.",r:"Ephesians 5:25",
  w:"Blessings on your anniversary, {稱呼}!\nThe measure of love in a home is not feeling but self-giving.\nWhere Christ's kind of love is practised, both are safe.\nMay your home be a place of rest for one another."},
 {v:"Let marriage be held in honor among all.",r:"Hebrews 13:4",
  w:"Congratulations, {稱呼}!\nA marriage kept faithfully is a quiet sermon the whole church can read.\nThank you for honouring this covenant year after year.\nMay God bless and guard your home."},
 {v:"Unless the LORD builds the house, they who build it labor in vain.",r:"Psalm 127:1",
  w:"Happy anniversary, {稱呼}!\nEvery good thing in your home was built by his hand.\nMay you keep letting him be the builder.\nWishing you peace and joy in this new year together."},
 {v:"He who finds a wife finds a good thing, and obtains favor from the LORD.",r:"Proverbs 18:22",
  w:"Congratulations, {稱呼}!\nThe person beside you is a gift, not an achievement.\nMay you never stop being thankful for each other.\nHappy anniversary from all of us."}],

weekly:[
 {v:"Give thanks in everything, for this is the will of God in Christ Jesus toward you.",r:"1 Thessalonians 5:18",
  w:"Peace to you, {稱呼}!\nStart the week by counting three things you can thank him for.\nGratitude changes the weather inside us before it changes anything outside.\nHave a blessed week."},
 {v:"The LORD is my shepherd; I shall lack nothing.",r:"Psalm 23:1",
  w:"Blessings, {稱呼}!\nWhatever this week requires, the Shepherd has already accounted for it.\nYou do not have to plan for every possibility.\nGo gently, and let him lead."},
 {v:"Trust in the LORD with all your heart, and don't lean on your own understanding.",r:"Proverbs 3:5",
  w:"Peace to you, {稱呼}!\nSome decisions this week won't come clear by thinking harder.\nTrust him with your heart rather than wrestling it out in your head.\nPraying he makes your path plain."},
 {v:"Be anxious for nothing... and the peace of God will guard your hearts.",r:"Philippians 4:6-7",
  w:"Blessings, {稱呼}!\nIf something is already weighing on you this week, hand it over early.\nHis peace is a guard posted at the door of your heart.\nWishing you a settled and steady week."},
 {v:"But those who wait for the LORD will renew their strength.",r:"Isaiah 40:31",
  w:"Peace to you, {稱呼}!\nStrength for this week is renewed, not stockpiled.\nTake time to be quiet with him before the rush begins.\nMay you rise up with fresh energy."},
 {v:"The joy of the LORD is your strength.",r:"Nehemiah 8:10",
  w:"Blessings, {稱呼}!\nJoy is not what is left over after the work; it is what carries you through it.\nMay his joy hold you up all week.\nThinking of you and praying for you."},
 {v:"Let the peace of God rule in your hearts.",r:"Colossians 3:15",
  w:"Peace to you, {稱呼}!\nMay Christ's peace sit on the throne of your heart this week, not the schedule.\nWhen he reigns inside, the outside becomes manageable.\nHave a blessed week."}],

sunday:[
 {v:"One thing I have asked of the LORD... that I may see the LORD's beauty.",r:"Psalm 27:4",
  w:"Peace to you, {稱呼}!\nSunday is not one more obligation in the week; it is the one place we come to see him.\nCome and let your soul catch its breath.\nHope to see you there."},
 {v:"Oh come, let's worship and bow down. Let's kneel before the LORD our Maker.",r:"Psalm 95:6",
  w:"Blessings, {稱呼}!\nThere is something in us that only settles when we bow.\nCome and worship with us this Sunday.\nWe would love to have you."},
 {v:"Serve the LORD with gladness. Come before his presence with singing.",r:"Psalm 100:2",
  w:"Peace to you, {稱呼}!\nCome and sing with us — even if this week has given you little to sing about.\nSometimes the song comes first and the heart follows.\nSee you Sunday."},
 {v:"Man shall not live by bread alone, but by every word that proceeds out of the mouth of God.",r:"Matthew 4:4",
  w:"Blessings, {稱呼}!\nWe feed our bodies faithfully every day; the soul needs feeding too.\nCome and be nourished by his word this Sunday.\nLooking forward to seeing you."},
 {v:"How good and how pleasant it is for brothers to live together in unity!",r:"Psalm 133:1",
  w:"Peace to you, {稱呼}!\nSomething good happens when God's family is in one room.\nYour seat is part of that goodness.\nCome and join us this Sunday."},
 {v:"They continued steadfastly in the apostles' teaching and fellowship, in the breaking of bread and prayer.",r:"Acts 2:42",
  w:"Blessings, {稱呼}!\nThe first church kept coming back — not out of duty, but because life was there.\nCome and share that life with us.\nHope to see you Sunday."},
 {v:"Where two or three are gathered together in my name, there I am in the middle of them.",r:"Matthew 18:20",
  w:"Peace to you, {稱呼}!\nWhen we gather, the Lord himself shows up.\nDon't let anything keep you away from that.\nSee you this Sunday."}],

festival:[
 {v:"The LORD has done great things for us, and we are glad.",r:"Psalm 126:3",
  w:"Season's blessings, {稱呼}!\nLook back over this year and you'll find his fingerprints everywhere.\nMay this season be full of good food and better company.\nThinking of you and your family."},
 {v:"As for me and my house, we will serve the LORD.",r:"Joshua 24:15",
  w:"Blessings for the season, {稱呼}!\nFestive gatherings are a good time to remember who reigns in your home.\nMay your family be united and glad.\nWishing you every blessing."},
 {v:"He satisfies your desire with good things.",r:"Psalm 103:5",
  w:"Season's blessings, {稱呼}!\nMay your table be full and your heart fuller.\nEvery good thing on it came from his hand.\nEnjoy these days with the people you love."},
 {v:"Rejoice in the Lord always! Again I will say, \"Rejoice!\"",r:"Philippians 4:4",
  w:"Blessings, {稱呼}!\nJoy at a festival is easy; joy in the Lord lasts after the decorations come down.\nMay you have both this season.\nThinking of you."},
 {v:"The LORD is good to all. His tender mercies are over all his works.",r:"Psalm 145:9",
  w:"Season's blessings, {稱呼}!\nHis kindness has followed you through every month of this year.\nMay you rest well and be refreshed in these days.\nWarmest wishes to you and yours."},
 {v:"Behold, how good and how pleasant it is for brothers to live together in unity!",r:"Psalm 133:1",
  w:"Blessings for the season, {稱呼}!\nMay old tensions soften and old ties be renewed around your table.\nA reconciled family is the best festival there is.\nPraying peace over your home."},
 {v:"Let the peace of God rule in your hearts... and be thankful.",r:"Colossians 3:15",
  w:"Season's blessings, {稱呼}!\nMay peace and thanksgiving be the two guests who stay longest at your table.\nWishing you a restful and joyful season.\nWith warm regards."}]
};

/* ---- English cards 4–10 · batch 2: suffering and comfort ---- */
var EN_MORE_2={
sick:[

/* ================= 影片修復（fMP4 → 標準 MP4）=================
   iOS Safari 的 MediaRecorder 產出的是「分段 MP4」，而且把影片長度寫成 0。
   LINE、相簿與大多數 App 都讀不出這種檔案，看起來就像「無法分享」。
   下面這段在存檔前把它重新封裝成一般的 MP4（moov + mdat），並補上正確時長。 */
/* fMP4（moof/mdat 分段）→ 一般 MP4（moov+mdat）重新封裝
   iOS Safari 的 MediaRecorder 產出的是分段 MP4，且時長寫成 0，
   LINE、相簿等大多數 App 都吃不下。這支程式把它改寫成標準結構。 */

function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;
  const top=mx_boxes(b,0,b.length);
  const ftyp=mx_one(top,"ftyp");
  const moov=mx_one(top,"moov");
  if(!moov)throw new Error("no moov");
  const moofs=mx_find(top,"moof");
  if(!moofs.length)return null;              /* 不是分段 MP4，不用處理 */

  const mvBoxes=mx_children(b,moov);
  const mvhd=mx_one(mvBoxes,"mvhd");
  const mvTimescale=mx_u32(b,mvhd.body+(b[mvhd.body]===1?20:12));
  const traks=mx_find(mvBoxes,"trak");

  /* 收集每個 track 的所有 sample */
  const tracks={};
  traks.forEach(tk=>{
    const tkhd=mx_one(mx_children(b,tk),"tkhd");
    const v=b[tkhd.body];
    const id=mx_u32(b,tkhd.body+(v===1?20:12));
    tracks[id]={trak:tk,samples:[]};
  });

  moofs.forEach(mf=>{
    const trafs=mx_find(mx_children(b,mf),"traf");
    trafs.forEach(tf=>{
      const tfc=mx_children(b,tf);
      const tfhdBox=mx_one(tfc,"tfhd");
      if(!tfhdBox)return;
      const tfhd=mx_parseTfhd(b,tfhdBox);
      const t=tracks[tfhd.trackId];
      if(!t)return;
      /* 基準位移：預設是 moof 起點（default-base-is-moof） */
      const base=tfhd.hasBase?tfhd.base:mf.start;
      let running=null;
      mx_find(tfc,"trun").forEach(tr=>{
        const flags=mx_u32(b,tr.body)&0xffffff;
        const hasOff=!!(flags&0x1);

          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;

      });

  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};
  let cur=0;
  order.forEach(o=>{
    if(!newOff[o.id])newOff[o.id]=[];
    newOff[o.id][o.i]=cur;cur+=o.size;
