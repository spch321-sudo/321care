const TABS=[["today","今日"],["flock","羊群"],["card","卡片"],["rec","錄製"],["set","設定"]];
let tab="today";
function drawNav(){$("#nav").innerHTML=TABS.map(([k,n])=>
 `<button class="${k===tab?"on":""}" onclick="go('${k}')"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${n}</button>`).join("");}
function go(k){if(tab==="rec"&&k!=="rec"){recSelfie=false;stopSelfie();}tab=k;drawNav();render();window.scrollTo(0,0);}

/* ================= 渲染 ================= */
function render(){
  document.documentElement.style.setProperty("--fs",S.set.fs);
  document.body.classList.toggle("dark",!!S.set.dark);
  $("#topGrp").textContent=[S.set.group,S.set.signer].filter(Boolean).join(" ｜ ");
  ({today:vToday,flock:vFlock,card:vCard,rec:vRec,set:vSet})[tab]();
  localizeAll();
}
function avatar(n){return (n||"？").slice(-2);}
function prow(p,meta,badge){
  return `<div class="prow" onclick="openPerson('${p.id}')">
    <div class="av">${esc(avatar(p.name))}</div>
    <div style="min-width:0;flex:1">
      <div class="nm">${esc(p.name)}${p.title?`<span style="font-weight:400;color:var(--ink3)"> ${esc(p.title)}</span>`:""}</div>
      <div class="mt">${meta||""}</div>
    </div>
    <div class="go">${badge||`<div class="dot ${light(p.id)}"></div>`}</div>
  </div>`;
}

/* ---------- 今日 ---------- */
function vToday(){
  const t=today();
  const dv=SC()[2].cards[t.getDay()%3];
  const soon=[];
  S.people.forEach(p=>{
    const b=daysTo(md(p.bd)); if(b!==null&&b<=30)soon.push({p,d:b,type:"生日",when:md(p.bd)});
    const a=daysTo(md(p.ann)); if(a!==null&&a<=30)soon.push({p,d:a,type:"結婚紀念",when:md(p.ann)});
  });
  soon.sort((x,y)=>x.d-y.d);
  const need=S.people.map(p=>({p,g:gapDays(p.id)})).sort((a,b)=>b.g-a.g);
  const week=need.filter(x=>x.g>=30).slice(0,S.set.quota||5);
  const red=need.filter(x=>x.g>=90).length;

  $("#view").innerHTML=`
  <div class="hero">
    <div class="d">${t.getFullYear()}年${zh(t)}　星期${WD[t.getDay()]}</div>
    <div class="v">「${dv.v}」</div>
    <div class="r">${dv.r}</div>
  </div>
  <div class="wrap">
    <div class="row" style="margin-bottom:4px">
      <span class="pill green">羊群 ${S.people.length} 位</span>
      <span class="pill gold">近月 ${soon.length} 個日子</span>
      ${red?`<span class="pill red">${red} 位逾 90 天未關懷</span>`:""}
    </div>

    <div class="sec-t">近 30 天的日子</div>
    ${soon.length?soon.map(x=>{
      const lbl=x.d===0?"就是今天":x.d===1?"明天":`還有 ${x.d} 天`;
      const ag=x.type==="生日"?ageAt(x.p.bd):null;
      return prow(x.p,`${x.type}　${x.when.replace("-","/")}　${lbl}${ag?`　滿 ${ag} 歲`:""}`,
        `<button class="btn sm gold" onclick="event.stopPropagation();quick('${x.p.id}','${x.type==="生日"?"birth":"anniv"}')">送卡片</button>`);
    }).join(""):`<div class="empty"><b>近一個月沒有特別的日子</b>安靜的日子，正好用來問候平常想不起來的人。</div>`}

    <div class="sec-t">本週建議關懷（${week.length}／${S.set.quota||5}）</div>
    ${week.length?week.map(x=>prow(x.p,x.g>=999?"尚無關懷紀錄":`已 ${x.g} 天沒有問候`,
      `<button class="btn sm" onclick="event.stopPropagation();quick('${x.p.id}','weekly')">問安</button>`)).join("")
     :`<div class="empty"><b>目前都跟上了</b>每一位都在 30 天內關懷過，願主記念您的擺上。</div>`}

    <div class="card" style="background:var(--mist);border:0">
      <div style="font-family:var(--serif);font-size:calc(18px*var(--fs));margin-bottom:6px">關懷的次序</div>
      <div class="muted" style="line-height:1.8">先建立與神的關係，再建立與自己的關係，再建立與人的關係，再建立與事的關係。<br>關懷不是去解決人的問題，是陪伴人回到耶穌面前。</div>
    </div>
  </div>`;
}

/* ---------- 羊群 ---------- */
let flockQ="",flockF="all";
function vFlock(){
  const q=flockQ.trim();
  let list=S.people.filter(p=>!q||[p.name,p.grp,p.note,p.pray,p.spouse].join(" ").includes(q));
  if(flockF!=="all")list=list.filter(p=>(p.tags||[]).includes(flockF));
  list.sort((a,b)=>gapDays(b.id)-gapDays(a.id));
  const F=[["all","全部"],["2","2 屬靈同伴"],["3","3 屬靈父母兒女"],["5","5 五重職份戰友"]];
  $("#view").innerHTML=`
  <div class="wrap" style="padding-bottom:0">
    <input id="q" placeholder="搜尋姓名、小組、備註…" value="${esc(flockQ)}" oninput="flockQ=this.value;vFlock();refocus()">
  </div>
  <div class="chips">${F.map(([k,n])=>`<button class="chip ${flockF===k?"on":""}" onclick="flockF='${k}';vFlock()">${n}</button>`).join("")}</div>
  <div class="wrap" style="padding-top:0">
    <button class="btn wide" onclick="editPerson()">＋ 新增一位弟兄姊妹</button>
    <div class="sec-t">名冊（${list.length}）</div>
    ${list.length?list.map(p=>{
      const g=gapDays(p.id);
      const tg=(p.tags||[]).map(t=>`<span class="tag">${t}</span>`).join("");
      return prow(p,`${tg}${p.grp?esc(p.grp)+"　":""}${g>=999?"尚無關懷紀錄":`上次關懷 ${g} 天前`}`);
    }).join(""):`<div class="empty"><b>還沒有建立名冊</b>先加入三五位最靠近您的人，從 2 開始。</div>`}
  </div>`;
}

function refocus(){const e=$("#q");if(e){e.focus();const n=e.value.length;try{e.setSelectionRange(n,n);}catch(x){}}}

  const st=["慕道","初信","成長","同工","領袖"];
  sheet(id?"編輯資料":"新增弟兄姊妹",`
   <label class="f">姓名</label><input id="f_name" value="${esc(p.name)}" placeholder="例：王大明">
   <label class="f">稱呼</label><select id="f_title">${t.map(x=>`<option value="${esc(x)}" ${x===p.title?"selected":""}>${x||"—"}</option>`).join("")}</select>
   <label class="f">生日（國曆）</label><input id="f_bd" type="date" value="${esc(p.bd)}">
   <div class="hint">提醒以國曆計算。若習慣過農曆，可填在下一欄備註。</div>
   <label class="f">農曆生日（文字備註）</label><input id="f_lunar" value="${esc(p.lunar)}" placeholder="例：農曆八月十五">
   <label class="f">結婚紀念日</label><input id="f_ann" type="date" value="${esc(p.ann)}">
   <label class="f">配偶姓名</label><input id="f_sp" value="${esc(p.spouse)}">
   <label class="f">家人</label><div id="famBox">${(p.fam||[]).map(f=>famRow(f.r,f.n)).join("")}</div>
   <button class="btn ghost sm" onclick="document.getElementById('famBox').insertAdjacentHTML('beforeend',famRow('',''))">＋ 加一位家人</button>
   <label class="f">小組／團契</label><input id="f_grp" value="${esc(p.grp)}" placeholder="例：週三晚間小組">
   <label class="f">屬靈階段</label><select id="f_stage">${st.map(x=>`<option value="${esc(x)}" ${x===p.stage?"selected":""}>${x}</option>`).join("")}</select>
   <label class="f">235 關係</label>
   <div class="row tight">${["2","3","5"].map(x=>`<button class="chip ${(p.tags||[]).includes(x)?"on":""}" onclick="this.classList.toggle('on')" data-tag="${x}">${x} ${({2:"屬靈同伴",3:"屬靈父母兒女",5:"五重職份戰友"})[x]}</button>`).join("")}</div>
   <label class="f">電話</label><input id="f_ph" type="tel" value="${esc(p.phone)}">
   <label class="f">代禱事項</label><textarea id="f_pray" rows="3">${esc(p.pray)}</textarea>
   <label class="f">備註</label><textarea id="f_note" rows="2">${esc(p.note)}</textarea>
   <hr class="sep">
   <button class="btn wide" onclick="savePerson('${id||""}')">儲存</button>
   ${id?`<button class="btn wide ghost" style="margin-top:9px;color:var(--red);border-color:var(--red)" onclick="delPerson('${id}')">刪除這位弟兄姊妹</button>`:""}
  `);
}
function famRow(r,n){return `<div class="fam"><input placeholder="關係" value="${esc(r)}" data-f="r"><input placeholder="姓名" value="${esc(n)}" data-f="n"><button onclick="this.parentNode.remove()">×</button></div>`;}
function savePerson(id){
  const g=s=>{const e=document.getElementById(s);return e?e.value.trim():"";};
  const name=g("f_name");if(!name){toast("請先填寫姓名");return;}
  const fam=[...document.querySelectorAll("#famBox .fam")].map(d=>({r:d.querySelector('[data-f="r"]').value.trim(),n:d.querySelector('[data-f="n"]').value.trim()})).filter(f=>f.n);
  const tags=[...document.querySelectorAll("[data-tag].on")].map(b=>b.dataset.tag);
  const o={id:id||uid(),name,title:g("f_title"),bd:g("f_bd"),lunar:g("f_lunar"),ann:g("f_ann"),spouse:g("f_sp"),
    fam,grp:g("f_grp"),stage:g("f_stage"),tags,phone:g("f_ph"),pray:g("f_pray"),note:g("f_note")};
  if(id){const i=S.people.findIndex(x=>x.id===id);S.people[i]=Object.assign(S.people[i],o);}else S.people.push(o);
  save();closeSheet();render();toast("已儲存");
}
function delPerson(id){
  if(!confirm("確定刪除？關懷紀錄也會一併刪除，此動作無法復原。"))return;
  S.people=S.people.filter(x=>x.id!==id);S.logs=S.logs.filter(x=>x.pid!==id);
  save();closeSheet();render();toast("已刪除");
}

function openPerson(id){
  const p=S.people.find(x=>x.id===id);if(!p)return;
  const logs=S.logs.filter(x=>x.pid===id).sort((a,b)=>b.date.localeCompare(a.date));
  const bd=md(p.bd),an=md(p.ann);
  sheet(p.name+(p.title||""),`
   <div class="row tight" style="margin-bottom:12px">
     <span class="pill ${light(id)==="red"?"red":light(id)==="amber"?"amber":"green"}">${gapDays(id)>=999?"尚無關懷紀錄":`上次關懷 ${gapDays(id)} 天前`}</span>
     ${(p.tags||[]).map(t=>`<span class="pill gold">${t}</span>`).join("")}
   </div>
   <div class="card">
     ${bd?`<div>🎂 生日　${bd.replace("-","/")}${ageAt(p.bd)?`（${ageAt(p.bd)} 歲）`:""}　<span class="muted">${daysTo(bd)===0?"就是今天！":`還有 ${daysTo(bd)} 天`}</span></div>`:""}
     ${p.lunar?`<div class="muted">農曆：${esc(p.lunar)}</div>`:""}
     ${an?`<div style="margin-top:6px">💍 結婚紀念　${an.replace("-","/")}　<span class="muted">${daysTo(an)===0?"就是今天！":`還有 ${daysTo(an)} 天`}</span></div>`:""}
     ${p.spouse?`<div style="margin-top:6px">配偶：${esc(p.spouse)}</div>`:""}
     ${p.fam&&p.fam.length?`<div style="margin-top:6px">家人：${p.fam.map(f=>esc((f.r?f.r+" ":"")+f.n)).join("、")}</div>`:""}
     ${p.grp?`<div style="margin-top:6px" class="muted">${esc(p.grp)}　${esc(p.stage||"")}</div>`:""}
     ${p.phone?`<div style="margin-top:8px"><a class="btn sm ghost" href="tel:${esc(p.phone)}">撥打 ${esc(p.phone)}</a></div>`:""}
   </div>
   ${p.pray?`<div class="card" style="background:var(--mist);border:0"><b style="font-family:var(--serif)">代禱事項</b><div style="white-space:pre-wrap;margin-top:6px">${esc(p.pray)}</div></div>`:""}
   ${p.note?`<div class="card"><b style="font-family:var(--serif)">備註</b><div style="white-space:pre-wrap;margin-top:6px">${esc(p.note)}</div></div>`:""}
   <div class="row">
     <button class="btn" onclick="pickScene('${id}')">選卡片關懷</button>
     <button class="btn ghost" onclick="logForm('${id}')">記一筆關懷</button>
     <button class="btn ghost sm" onclick="editPerson('${id}')">編輯資料</button>
   </div>
   <div class="sec-t">關懷紀錄（${logs.length}）</div>
   ${logs.length?logs.map(l=>`<div class="card" style="padding:13px 15px">
      <div class="muted">${l.date}　${esc(l.way||"")}　${esc(l.scene||"")}</div>
      <div style="margin-top:5px;white-space:pre-wrap">${esc(l.sum||"")}</div>
      ${l.next?`<div class="muted" style="margin-top:5px">下次跟進：${l.next}</div>`:""}
      <button class="btn sm ghost" style="margin-top:9px" onclick="delLog('${l.id}','${id}')">刪除</button>
    </div>`).join(""):`<div class="empty">還沒有紀錄。關懷完按一下「記一筆」，日子久了就是一部恩典史。</div>`}
  `);
}
function logForm(pid){
  const ways=["電話","面對面探訪","訊息","語音卡片","代禱","聚會相見"];
  sheet("記一筆關懷",`
   <label class="f">日期</label><input id="l_d" type="date" value="${iso(today())}">
   <label class="f">方式</label><select id="l_w">${ways.map(w=>`<option value="${esc(w)}">${w}</option>`).join("")}</select>
   <label class="f">主題／場景</label><input id="l_s" placeholder="例：生日祝福、身體不適">
   <label class="f">摘要</label><textarea id="l_m" rows="4" placeholder="談了什麼、有什麼需要代禱"></textarea>
   <label class="f">下次跟進（可留空）</label><input id="l_n" type="date">
   <hr class="sep"><button class="btn wide" onclick="saveLog('${pid}')">儲存紀錄</button>`);
}
function saveLog(pid,quiet){
  const g=s=>{const e=document.getElementById(s);return e?e.value:"";};
  S.logs.push({id:uid(),pid,date:g("l_d")||iso(today()),way:g("l_w"),scene:g("l_s"),sum:g("l_m"),next:g("l_n")});
  save();closeSheet();render();toast("已記錄，願主記念您的擺上");
}
function delLog(lid,pid){S.logs=S.logs.filter(x=>x.id!==lid);save();openPerson(pid);render();}
function markCared(pid,scene){
  S.logs.push({id:uid(),pid,date:iso(today()),way:"語音卡片／訊息",scene:scene||"",sum:"已送出關懷卡片"});
  save();render();toast("已記為今日關懷");
}

let override={};
function ck(sid,i){return sid+"#"+i;}
function getCard(sid,i){
  const base=SC().find(s=>s.id===sid).cards[i];
  const o=override[ck(sid,i)];
  return Object.assign({},base,o||{},{b:(o&&o.b)||BL()[0]});
}
function editCard(sid,i){
  const c=getCard(sid,i),p=S.people.find(x=>x.id===curPid);
  sheet("調整這張卡片",`
   <div class="hint">可用代碼：{稱呼}{姓名}{配偶}{家人}{團體}{署名}，送出時會自動換成真實資料。</div>
   <label class="f">經文</label><textarea id="c_v" rows="3">${esc(c.v)}</textarea>

function wrap(ctx,text,maxW){
  const out=[];
  (text||"").split("\n").forEach(par=>{
    if(!par){out.push("");return;}
    let line="";
    for(const ch of par){
      if(ctx.measureText(line+ch).width>maxW&&line){out.push(line);line=ch;}else line+=ch;
    }
    out.push(line);
  });
  return out;
}

function coverDraw(ctx,img,x,y,w,h){const ir=img.width/img.height,r=w/h;let sw,sh,sx,sy;
  if(ir>r){sh=img.height;sw=sh*r;sx=(img.width-sw)/2;sy=0;}else{sw=img.width;sh=sw/r;sx=0;sy=(img.height-sh)/2;}
  ctx.drawImage(img,sx,sy,sw,sh,x,y,w,h);}
function drawBorder(ctx,W,H,pad,F,T){
  const line=T.frame, line2=T.frame.replace(/[\d.]+\)$/,"0.55)"), gold=T.gold;
  const m=pad*.5;                       // 外框距邊
  const x=m,y=m,w=W-m*2,h=H-m*2, R=Math.round(18*F);
  const B=curBorder;
  if(B==="none")return;
  if(B==="classic"){
    ctx.strokeStyle=line;ctx.lineWidth=Math.max(2,W*.0022);rr(ctx,x,y,w,h,R);ctx.stroke();
    ctx.strokeStyle=line2;ctx.lineWidth=Math.max(1,W*.0009);
    rr(ctx,x+Math.round(9*F),y+Math.round(9*F),w-Math.round(18*F),h-Math.round(18*F),Math.round(12*F));ctx.stroke();
    ctx.fillStyle=gold;[[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(([cx,cy])=>{
      ctx.beginPath();ctx.arc(cx,cy,Math.round(5*F),0,7);ctx.fill();});
  }else if(B==="corner"){
    ctx.strokeStyle=gold;ctx.lineWidth=Math.max(2,W*.003);ctx.lineCap="round";
    const L=Math.round(56*F);
    const seg=(cx,cy,dx,dy)=>{ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+dx*L,cy);
      ctx.moveTo(cx,cy);ctx.lineTo(cx,cy+dy*L);ctx.stroke();};
    seg(x,y,1,1);seg(x+w,y,-1,1);seg(x,y+h,1,-1);seg(x+w,y+h,-1,-1);
    ctx.lineCap="butt";
  }else if(B==="inline"){
    ctx.strokeStyle=line2;ctx.lineWidth=Math.max(1,W*.0013);
    rr(ctx,x+Math.round(6*F),y+Math.round(6*F),w-Math.round(12*F),h-Math.round(12*F),Math.round(14*F));ctx.stroke();
  }else if(B==="dots"){
    ctx.fillStyle=line2;
    const r=Math.max(2,W*.0026), gap=Math.round(26*F);
    const ex=x+Math.round(6*F),ey=y+Math.round(6*F),ew=w-Math.round(12*F),eh=h-Math.round(12*F);
    const dot=(px,py)=>{ctx.beginPath();ctx.arc(px,py,r,0,7);ctx.fill();};
    for(let px=ex;px<=ex+ew;px+=gap){dot(px,ey);dot(px,ey+eh);}
    for(let py=ey;py<=ey+eh;py+=gap){dot(ex,py);dot(ex+ew,py);}
  }else if(B==="ornate"){
    ctx.strokeStyle=line;ctx.lineWidth=Math.max(2,W*.0022);rr(ctx,x,y,w,h,R);ctx.stroke();
    ctx.strokeStyle=gold;ctx.lineWidth=Math.max(1.5,W*.0016);ctx.lineCap="round";
    const L=Math.round(34*F), o=Math.round(16*F);
    const flo=(cx,cy,dx,dy)=>{
      ctx.beginPath();ctx.moveTo(cx+dx*o,cy+dy*o);ctx.lineTo(cx+dx*(o+L),cy+dy*o);
      ctx.moveTo(cx+dx*o,cy+dy*o);ctx.lineTo(cx+dx*o,cy+dy*(o+L));ctx.stroke();
      ctx.fillStyle=gold;ctx.beginPath();ctx.arc(cx+dx*o,cy+dy*o,Math.round(4.5*F),0,7);ctx.fill();};
    flo(x,y,1,1);flo(x+w,y,-1,1);flo(x,y+h,1,-1);flo(x+w,y+h,-1,-1);
    ctx.lineCap="butt";
  }
}
function drawCard(cv,c,p,W,H){
  const ctx=cv.getContext("2d");cv.width=W;cv.height=H;
  const T=TPL[curTpl]||TPL.paper;
  const F=W/1080, pad=Math.round(W*.078), iw=W-pad*2;
  /* 卡片與影片的字級，跟著「設定 → 字級」同步放大或縮小 */
  const FS=Math.min(1.5,Math.max(1,+(S.set.fs)||1)), FT=F*FS;
  /* 「內文字級」只放大問候內文，經文與署名維持原比例，版面才不會被擠掉 */
  const BFS=Math.min(1.8,Math.max(0.85,+(S.set.cardFs)||1)), FB=FT*BFS;
  const sans=getComputedStyle(document.body).fontFamily;
  const serif='"Noto Serif TC","Songti TC","STSong","PMingLiU",serif';
  const ink=T.ink, accent=T.accent, gold=T.gold, sub=T.sub;
  /* 團體名與署名：往主文字色再壓深一點，長輩看得更清楚 */
  const hx=c0=>{const h=String(c0).replace("#","");
    return h.length===3?[0,1,2].map(i=>parseInt(h[i]+h[i],16)):[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));};
  const mixC=(a,b,t)=>{const A=hx(a),B=hx(b);
    return "#"+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t).toString(16).padStart(2,"0")).join("");};
  const subDeep=mixC(T.sub,T.ink,.55);

  /* --- 背景漸層（相片模式時作為底色） --- */
  const g=ctx.createLinearGradient(0,0,W*.3,H);
  g.addColorStop(0,T.bg[0]);g.addColorStop(.55,T.bg[1]);g.addColorStop(1,T.bg[2]);
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  /* --- 背景相片 + 半透明遮罩（維持文字可讀） --- */
  if(photoImg&&photoMode==="bg"){
    coverDraw(ctx,photoImg,0,0,W,H);
    const hex=T.bg[1].replace("#","");
    const R=parseInt(hex.slice(0,2),16),G=parseInt(hex.slice(2,4),16),Bl=parseInt(hex.slice(4,6),16);
    const sc=ctx.createLinearGradient(0,0,0,H);
    sc.addColorStop(0,`rgba(${R},${G},${Bl},0.46)`);
    sc.addColorStop(.5,`rgba(${R},${G},${Bl},0.66)`);
    sc.addColorStop(1,`rgba(${R},${G},${Bl},0.56)`);
    ctx.fillStyle=sc;ctx.fillRect(0,0,W,H);
  }
  /* 角落光暈 */
  const rg=ctx.createRadialGradient(W*.85,H*.10,10,W*.85,H*.10,W*.7);
  rg.addColorStop(0,T.glow);rg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=rg;ctx.fillRect(0,0,W,H);
  const rg2=ctx.createRadialGradient(W*.12,H*.94,10,W*.12,H*.94,W*.55);
  rg2.addColorStop(0,T.glow.replace(/[\d.]+\)$/,"0.22)"));rg2.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=rg2;ctx.fillRect(0,0,W,H);

  /* --- 邊框（可選） --- */
  drawBorder(ctx,W,H,pad,F,T);

  /* --- 團體名（固定在頂端） --- */
  const grpSz=Math.round(27*FT), refSz=Math.round(29*FT), blSz=Math.round(32*FT), sigSz=Math.round(26*FT);
  ctx.textAlign="center";ctx.fillStyle=subDeep;ctx.font=`600 ${grpSz}px ${sans}`;
  const grp=LT((S.set.group||"").trim());
  const grpY=pad+Math.round(40*F);
  if(grp){
    const gw=ctx.measureText(grp).width;
    ctx.fillText(grp,W/2,grpY);
    ctx.strokeStyle=T.frame.replace(/[\d.]+\)$/,"0.6)");ctx.lineWidth=Math.max(1,1.5*F);
    const lx=W/2-gw/2-Math.round(28*F), rx=W/2+gw/2+Math.round(28*F);
    ctx.beginPath();ctx.moveTo(lx-Math.round(30*F),grpY-Math.round(9*F));ctx.lineTo(lx,grpY-Math.round(9*F));ctx.stroke();
    ctx.beginPath();ctx.moveTo(rx,grpY-Math.round(9*F));ctx.lineTo(rx+Math.round(30*F),grpY-Math.round(9*F));ctx.stroke();
  }

  /* --- 版位計算（經文＋內文垂直置中於團體名之下） --- */
  const hasStickerLayout=photoImg&&photoMode==="sticker"&&!suppressSticker;
  /* 祝福語與署名會因為貼紙或自拍而往上移，底部要預留同樣的高度，內文才不會壓過去 */
  const stkBottom=stkPos!=="tl"&&stkPos!=="tr";
  const liftRoom=(hasStickerLayout&&stkBottom)?Math.round(W*stkSize*1.12)+Math.round(30*F):0;
  const topRoom=pad+Math.round(96*F), botRoom=pad+Math.round(160*F)+liftRoom;
  const room=H-topRoom-botRoom;

  let vs=Math.round(54*FT),vl;
  const cV=LT(c.v||""),cR=LT(c.r||""),cB=LT(c.b||BL()[0]);
  while(true){ctx.font=`600 ${vs}px ${serif}`;vl=wrap(ctx,QO()+cV+QC(),iw);
    if(vl.length<=6||vs<=Math.round(30*F))break;vs-=Math.round(3*F);}

  const bodyTxt=LT(merge(c.w,p));
  const fixed=vs*.9+vl.length*vs*1.55+Math.round(52*F)+Math.round(54*F);
  let bs=Math.round(40*FB),bl;
  while(true){ctx.font=`${bs}px ${sans}`;bl=wrap(ctx,bodyTxt,iw);
    if(fixed+bl.length*bs*1.74<=room||bs<=Math.round(24*F))break;bs-=Math.round(2*F);}

  const total=fixed+bl.length*bs*1.74;
  let y=topRoom+Math.max(0,(room-total)/2);

  /* --- 經文 --- */
  ctx.fillStyle=accent;ctx.font=`600 ${vs}px ${serif}`;
  y+=vs*.9;vl.forEach(l=>{ctx.fillText(l,W/2,y);y+=vs*1.55;});

  /* --- 出處 --- */
  ctx.font=`${refSz}px ${sans}`;ctx.fillStyle=sub;
  ctx.fillText(cR,W/2,y);y+=Math.round(52*F);

  /* --- 分隔飾 --- */
  ctx.fillStyle=gold;
  ctx.beginPath();ctx.arc(W/2,y,Math.round(5*F),0,7);ctx.fill();
  ctx.strokeStyle=gold;ctx.lineWidth=2.5*F;
  ctx.beginPath();ctx.moveTo(W/2-Math.round(52*F),y);ctx.lineTo(W/2-Math.round(16*F),y);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2+Math.round(16*F),y);ctx.lineTo(W/2+Math.round(52*F),y);ctx.stroke();
  y+=Math.round(54*F);

  /* --- 內文 --- */
  ctx.textAlign="left";ctx.fillStyle=ink;ctx.font=`${bs}px ${sans}`;
  bl.forEach(l=>{ctx.fillText(l,pad,y);y+=bs*1.74;});

  /* --- 祝福與署名（近底部；自拍或貼相片時上移讓開） --- */
  const hasSticker=photoImg&&photoMode==="sticker"&&!suppressSticker;
  const stkDown=hasSticker&&stkPos!=="tl"&&stkPos!=="tr";
  const lift=(stkDown&&stkPos==="bc")?Math.round(W*stkSize*1.12)+Math.round(20*F):0;
  /* 自拍圓框在右下角，祝福語與署名就靠左排，彼此讓開 */
  const selfR=Math.round(Math.min(W,H)*0.115), selfPad=Math.round(W*.078);
  /* 圓框或相片貼紙佔住一角時，祝福語與署名就排到另一邊，彼此讓開 */
  const stkW=Math.round(W*stkSize);
  const sideR=(!!selfieLayout&&!hasSticker)||(stkDown&&stkPos==="br");
  const sideL=stkDown&&stkPos==="bl";
  const sideMode=sideR||sideL;
  const rightEdge=sideR?(selfieLayout&&!hasSticker?W-selfPad-selfR*2:W-pad-stkW)-Math.round(24*F):W-pad;
  const leftStart=sideL?(pad+stkW+Math.round(24*F)):pad;
  const cxT=sideMode?(leftStart+rightEdge)/2:W/2;
  const maxT=sideMode?(rightEdge-leftStart):iw;
  const fitFont=(txt,size,weight,fam)=>{let z=size;
    while(z>Math.round(16*F)){ctx.font=`${weight} ${z}px ${fam}`;
      if(ctx.measureText(txt).width<=maxT)break;z-=Math.round(2*F);}
    ctx.font=`${weight} ${z}px ${fam}`;return z;};
  ctx.textAlign="center";ctx.fillStyle=accent;
  const blTxt=cB;
  fitFont(blTxt,blSz,"600",serif);
  ctx.fillText(blTxt,cxT,H-pad*.72-Math.round(96*F)-lift);
  const sig=LT((S.set.signer||"").trim());
  if(sig){
    const sigTxt=sig+(isEN()?"":"　敬上");
    ctx.fillStyle=subDeep;fitFont(sigTxt,sigSz,"600",sans);
    ctx.fillText(sigTxt,cxT,H-pad*.72-Math.round(30*F)-lift);
  }

  /* --- 相片貼紙（右下角，拍立得風格） --- */
  if(hasSticker){
    const sw=Math.round(W*stkSize), sh=Math.round(sw*1.12);
    const top=stkPos==="tl"||stkPos==="tr";
    const bx=(stkPos==="bl"||stkPos==="tl")?pad-Math.round(4*F)
            :(stkPos==="bc")?Math.round((W-sw)/2)
            :W-pad-sw+Math.round(4*F);
    const by=top?pad+Math.round(70*F):H-pad-sh+Math.round(4*F);
    ctx.save();
    ctx.translate(bx+sw/2,by+sh/2);ctx.rotate(-3*Math.PI/180);
    ctx.shadowColor="rgba(0,0,0,.30)";ctx.shadowBlur=Math.round(24*F);ctx.shadowOffsetY=Math.round(9*F);
    const fr=Math.round(10*F), pb=Math.round(26*F);   // 白框、底部留白（拍立得）
    rr(ctx,-sw/2,-sh/2,sw,sh,Math.round(10*F));ctx.fillStyle="#FDFBF6";ctx.fill();
    ctx.shadowColor="transparent";
    const iw2=sw-fr*2, ih2=sh-fr-pb;
    ctx.save();rr(ctx,-sw/2+fr,-sh/2+fr,iw2,ih2,Math.round(4*F));ctx.clip();
    coverDraw(ctx,photoImg,-sw/2+fr,-sh/2+fr,iw2,ih2);ctx.restore();
    ctx.restore();
  }
}

function drawSelfie(cx,vid,W,H,F){
  if(!vid||!vid.videoWidth)return;
  const pad=Math.round(W*.078);
  const R=Math.round(Math.min(W,H)*0.115);          // 圓形半徑
  const cxx=W-pad-R+Math.round(4*F), cyy=H-pad-R+Math.round(4*F);
  // 陰影底
  cx.save();
  cx.shadowColor="rgba(0,0,0,.28)";cx.shadowBlur=Math.round(22*F);cx.shadowOffsetY=Math.round(8*F);
  cx.beginPath();cx.arc(cxx,cyy,R,0,7);cx.fillStyle="#000";cx.fill();
  cx.restore();
  // 圓形裁切 + 鏡像貼上相機畫面（cover 置中裁切）
  cx.save();
  cx.beginPath();cx.arc(cxx,cyy,R,0,7);cx.clip();
  const vw=vid.videoWidth, vh=vid.videoHeight, side=Math.min(vw,vh);
  const sx=(vw-side)/2, sy=(vh-side)/2;
  cx.translate(cxx,cyy);cx.scale(-1,1);                // 鏡像（自拍鏡像感）
  cx.drawImage(vid, sx,sy,side,side, -R,-R,R*2,R*2);
  cx.restore();
  // 外環
  cx.beginPath();cx.arc(cxx,cyy,R,0,7);
  cx.lineWidth=Math.max(3,W*.006);cx.strokeStyle="#F4EFE3";cx.stroke();
  cx.beginPath();cx.arc(cxx,cyy,R+Math.round(4*F),0,7);
  cx.lineWidth=Math.max(2,W*.003);cx.strokeStyle="rgba(184,122,34,.85)";cx.stroke();
}

function splitVerse(t){const o=[];let c="";for(const ch of t){c+=ch;if("，。；！？、".indexOf(ch)>=0){o.push(c);c="";}}if(c)o.push(c);
  const r=[];o.forEach(x=>{if(r.length&&x.replace(/[「」』『\s]/g,"").length===0)r[r.length-1]+=x;else r.push(x);});return r.length?r:[t];}
let stageT=[],stageURL=null;
async function playRec(id){
  const r=await getRec(id);if(!r)return;
  stageT.forEach(clearTimeout);stageT=[];
  if(stageURL)URL.revokeObjectURL(stageURL);
  stageURL=URL.createObjectURL(r.blob);
  const vid=$("#stageVid"),txt=$("#stageV"),ref=$("#stageR"),tip=$("#stageTip");
  $("#stage").classList.add("on");
  if(r.kind==="video"){
    txt.innerHTML="";ref.textContent="";ref.classList.remove("show");
    tip.textContent=LT("按「分享到 LINE」即可把這支影片傳給弟兄姊妹。");
    vid.style.display="block";vid.src=stageURL;
    try{await vid.play();}catch(e){}
  }else{
    vid.style.display="none";vid.removeAttribute("src");
    const lines=splitVerse(QO()+r.v+QC());
    txt.innerHTML=lines.map(l=>`<p>${esc(l)}</p>`).join("");
    ref.textContent="—— "+r.r+(S.set.signer?"　"+LT(S.set.signer):"");
    tip.textContent=LT("從右上角下拉開啟「螢幕錄影」，即可錄成影片分享。");
    const pl=$("#player");pl.src=stageURL;
    const ps=[...document.querySelectorAll("#stageV p")];
    const total=Math.max((r.dur||lines.length*2)*1000*.72,2000);
    ps.forEach((el,i)=>stageT.push(setTimeout(()=>el.classList.add("show"),400+i*(total/Math.max(ps.length,1)))));
    stageT.push(setTimeout(()=>ref.classList.add("show"),400+total));
    try{await pl.play();}catch(e){toast("請點一下畫面開始播放");}
  }
}
function stopStage(){
  $("#stage").classList.remove("on");$("#stageR").classList.remove("show");

    "兩個核心：讓耶穌作王、讓耶穌得著一切榮耀。一個目的：建立屬神的體系。",
    "核心生命：無己、謙卑勝過驕傲、先生命再關係後事工、焦點在耶穌不在自己不在環境。",
    "",
    "【嚴格的輸出格式】只輸出以下三個區塊，不要有任何其他前言、說明或標題符號：",
    "第一行：VERSE｜經文全文（一定用《和合本》，且只引用你確有把握的經文，絕不杜撰）",
    "第二行：REF｜經文出處（例如：詩篇 23:1）",
    "第三行開始：WORD｜二到三句溫暖的問候與勸勉，口語、真摯、不說教。全部合計不超過 80 個字。",
    "以收卡人的稱呼直接開頭，例如「王大明弟兄平安！」。可換行，用真實的換行分句。",
    "",
    (LG()==="en"
      ? "【STYLE】Reply entirely in English. Quote Scripture from the World English Bible (public domain), rendering \"Yahweh\" as \"the LORD\". Warm, plain and brief \u2014 two or three short sentences, no more than 55 words in total. Begin the WORD block by addressing the recipient by name."
      : (LG()==="zh-Hans"
        ? "【風格】一律簡體中文。深入淺出、精簡有力（問候二到三句、合計 80 字內）。"
        : "【風格】一律繁體中文。深入淺出、精簡有力（問候二到三句、合計 80 字內）。")),
    "這是要印在小小一張關懷卡上的字，寧可少講一句，也不要囉嗦。每句話都要能被溫柔地讀出來。",
    "不用 Markdown、不用星號井號、不用條列符號。",
    "不要杜撰經文；若不確定經節，寧可選一節你完全有把握的相近經文。"
  ].join("\n");
}
function xzPrompt(){
  const t=(xz.title||"").trim();
  return `收卡人稱呼：${xz.name||"（未填，請用「親愛的弟兄姊妹」）"}${t}\n`
    +`關懷場景：${xz.scene||"一般問安"}\n`
    +`對方的情況或需要：${xz.need||"（未特別說明，請按場景寫溫暖的問候）"}\n\n`
    +`請依規定格式，為這個人寫一張關懷卡片的經文與問候。`;
}
function xzParse(text){
  const t=String(text||"");
  let v="",r="",w="";
  const mv=t.match(/VERSE[｜|:：]\s*([\s\S]*?)(?:\n|$)/);
  const mr=t.match(/REF[｜|:：]\s*([\s\S]*?)(?:\n|$)/);
  const mw=t.match(/WORD[｜|:：]\s*([\s\S]*)$/);
  if(mv)v=mv[1].trim().replace(/^[「『]|[」』]$/g,"");
  if(mr)r=mr[1].trim();
  if(mw)w=mw[1].trim();
  if(!v&&!w){ // 後備：模型沒照格式，就整段當問候
    w=t.trim();
  }
  return {v,r,w};
}

function xzOpen(){
  // 若已在卡片頁選了對象，帶入其姓名
  const p=S.people.find(x=>x.id===curPid);
  if(p){xz.name=p.name;xz.title=p.title||"";}
  xzSheet();
}
function xzSheet(){
  const scenes=XZ_SCENES;
  sheet("✨ AI小智 · 為您量身寫卡片",`
   <div class="muted" style="line-height:1.75;margin-bottom:14px">
     告訴AI小智三件事，它會為這個人寫出合適的經文與問候。寫好後可直接做成圖卡，或複製貼上。
   </div>
   <label class="f" style="margin-top:0">收卡人稱呼</label>
   <div class="row tight">
     <input id="xz_name" style="flex:1;min-width:120px" placeholder="例：王大明" value="${esc(xz.name)}" oninput="xz.name=this.value">
     <select id="xz_title" style="flex:0 0 34%" onchange="xz.title=this.value">
       ${["弟兄","姊妹","爸爸","媽媽","阿公","阿嬤","牧師","傳道","長老","小朋友",""].map(t=>`<option value="${esc(t)}" ${t===xz.title?"selected":""}>${t||"（不加）"}</option>`).join("")}
     </select>
   </div>
   <label class="f">關懷場景</label>
   <select id="xz_scene" onchange="xz.scene=this.value">
     <option value="">— 請選擇 —</option>
     ${scenes.map(s=>`<option ${s===xz.scene?"selected":""}>${s}</option>`).join("")}
   </select>
   <label class="f">對方目前的情況或需要</label>
   <textarea id="xz_need" rows="4" placeholder="例：最近工作壓力大，孩子考試也讓他很煩心，身體有點累。" oninput="xz.need=this.value">${esc(xz.need)}</textarea>
   <div class="hint">寫得越具體，AI小智寫得越貼近。可以留空，AI小智會按場景發揮。</div>
   <hr class="sep">
   <button class="btn wide gold" id="xz_go" onclick="xzGenerate()">${xz.busy?"AI小智思想中…":"✨ 請AI小智寫一張"}</button>
   <div id="xz_out"></div>`);
  if(xz.result)xzRenderResult();
  if(xz.err)$("#xz_out").innerHTML=`<div class="card" style="border-color:var(--red);margin-top:14px"><div class="muted">${esc(xz.err)}</div></div>`;
}
async function xzGenerate(){
  xz.name=($("#xz_name")||{}).value||xz.name;
  xz.title=($("#xz_title")||{}).value||xz.title;
  xz.scene=($("#xz_scene")||{}).value||xz.scene;
  xz.need=($("#xz_need")||{}).value||xz.need;
  if(!xz.scene&&!xz.need){toast("請至少選一個場景，或描述情況");return;}
  xz.busy=true;xz.err="";xz.result=null;
  const b=$("#xz_go");if(b){b.textContent="AI小智思想中…";b.disabled=true;}
  const out=$("#xz_out");if(out)out.innerHTML=`<div class="card" style="margin-top:14px;text-align:center"><div class="muted">✨ AI小智正在為 ${esc(xz.name||"這位弟兄姊妹")} 尋找合適的話…</div></div>`;
  const ctrl=(typeof AbortController!=="undefined")?new AbortController():null;
  const timer=ctrl?setTimeout(()=>{try{ctrl.abort();}catch(_){}},35000):null;
  try{
    if(navigator.onLine===false)throw new Error("offline");
    const res=await fetch(XZ_ENDPOINT,{
      method:"POST",headers:{"Content-Type":"application/json"},
      signal:ctrl?ctrl.signal:undefined,
      body:JSON.stringify({model:XZ_MODEL,max_tokens:1000,system:xzSystem(),
        messages:[{role:"user",content:xzPrompt()}]})
    });
    if(!res.ok)throw new Error("HTTP "+res.status);
    const data=await res.json();
    const text=(data.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("\n").trim();
    if(!text)throw new Error("empty");
    xz.result=xzParse(text);
  }catch(e){
    xz.err=(e&&e.name==="AbortError")?"AI小智等候得有點久，請稍後再試 🙏"
      :(e&&e.message==="offline")?"目前沒有網路，AI小智暫時無法連線 🙏 可先用現成範本。"
      :"AI小智暫時連不上線，請稍後再試 🙏 也可以先用現成的範本卡片。";
  }finally{if(timer)clearTimeout(timer);}
  xz.busy=false;
  xzSheet();
}
function xzRenderResult(){
  const out=$("#xz_out");if(!out||!xz.result)return;
  const rc=xz.result;
  out.innerHTML=`
   <div class="sec-t" style="margin-top:18px">AI小智為您寫的卡片</div>
   <div class="vcard">
     ${rc.v?`<div class="vs"><div class="vt">「${esc(rc.v)}」</div>${rc.r?`<div class="vr">${esc(rc.r)}</div>`:""}</div>`:""}
     <div class="vb">${esc(rc.w)}</div>
   </div>
   <div class="row">
     <button class="btn" onclick="xzMakeImg()">做成圖卡</button>
     <button class="btn ghost" onclick="xzCopy()">複製文字</button>
     <button class="btn ghost sm" onclick="xzToRec()">錄音做卡</button>
     <button class="btn ghost sm" onclick="xzEdit()">改一改</button>
     <button class="btn ghost sm" onclick="xzGenerate()">再寫一張</button>
   </div>
   <div class="hint" style="margin-top:8px">可以先「改一改」調整字句，再做成圖卡或複製貼進 LINE。</div>`;
  localizeEl(out);
}
/* AI小智寫好的稿子，牧者可以親自潤過再送出 */
function xzEdit(){
  const out=$("#xz_out");if(!out||!xz.result)return;
  const rc=xz.result;
  out.innerHTML=`
   <div class="sec-t" style="margin-top:18px">修改AI小智寫的卡片</div>
   <div class="hint">AI小智只是幫您起個頭，最後這幾句話還是要出於您的心。</div>
   <label class="f">經文</label><textarea id="xz_v" rows="3">${esc(rc.v||"")}</textarea>
   <label class="f">出處</label><input id="xz_r" value="${esc(rc.r||"")}">
   <label class="f">安慰造就勸勉的話</label><textarea id="xz_w" rows="8">${esc(rc.w||"")}</textarea>
   <div class="row" style="margin-top:12px">
     <button class="btn" onclick="xzSaveEdit()">套用</button>
     <button class="btn ghost" onclick="xzRenderResult()">取消</button>
   </div>`;
  localizeEl(out);
}
function xzSaveEdit(){
  const g=id=>{const e=document.getElementById(id);return e?e.value.trim():"";};
  const w=g("xz_w");
  if(!w){toast("問候的話不能留空");return;}
  xz.result={v:g("xz_v"),r:g("xz_r"),w:w};
  xzRenderResult();toast("已套用");
}
function xzResultText(){
  const rc=xz.result||{};
  const sig=LT((S.set.signer||"").trim());
  return [rc.v?`「${rc.v}」`:"",rc.r?`—— ${rc.r}`:"","",rc.w||"","",BL()[0],sig?sig+" 敬上":""]
    .filter((x,i)=>x!==""||i<6).join("\n").replace(/\n{3,}/g,"\n\n").trim();
}
function xzCopy(){
  const t=xzResultText();
  navigator.clipboard?navigator.clipboard.writeText(t).then(()=>toast("已複製，可貼到 LINE 或空白卡片")):prompt("長按複製：",t);
}
function xzMakeImg(){
  const rc=xz.result||{};
  closeSheet();
  makeImgRaw({v:rc.v||"願主與你同在",r:rc.r||"",w:rc.w||"",b:BL()[0]});
}

/* ================= 啟動 ================= */
(async()=>{
  try{await openDB();}catch(e){}
  drawNav();render();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
})();

</script>
